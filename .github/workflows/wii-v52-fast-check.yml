name: Wii V52 Focused Owner Test
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v52*'
      - '.github/workflows/wii-v52-fast-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wii-v52-focus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-owner-v52:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Prepare pinned original-free NWii runtime and cache traces
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_perf_patch_guards_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/verify_perf_combo_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_hid4_continuous_patch_v30.py"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_continuous_patch_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_trace_guards_v44.py"
          echo 'PASS: V52 focused runtime prerequisites prepared and original-free source guards passed'
      - name: Run original Wii continuous EXI prefix without replaying V38-V51
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --report "$RUNNER_TEMP/v52-focused.json" \
            --diagnostic-runner V52 \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x804EFA14 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v52_continuous_exi_poll.sh \
              "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/v52-focused.log" 2>&1 || {
              grep -E '^BOOT_DIAGNOSTIC stage=V52\.(runtime_cache_trace_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/v52-focused.log" || true
              grep -E '^BOOT_DIAGNOSTIC assertion_id=V52\.[0-9]{3}$' "$RUNNER_TEMP/v52-focused.log" || true
              echo 'V52 focused original Wii test failed; owner logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/v52-focused.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert r['lane']=='continuous-start' and r['status']=='passed_instrumented'
          assert r['observed_entry']==0x8000403C and r['observed_pc']==0x804EFA14
          assert r['stage']==52 and r['pass_markers']>=1
          print('PASS: V52 focused original Wii continuous __start->EXIInit checkpoint verified')
          PY
      - name: Remove private originals and generated code
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals" \
            "$RUNNER_TEMP/v52-focused.json" "$RUNNER_TEMP/v52-focused.log"
