name: Wii V1160 Gated Continuous Held Callback Return Repair
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-v1059-continuous-third-alarm.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-v1059-continuous-third-alarm
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate strict launch and terminal contracts
        run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v572_full_sc_translation.sh
          bash -n research/native_recomp/run_v575_dsp_sc_launch.sh
          python3 -m unittest discover -s research/native_recomp -p test_v1062_owner_gate.py -v
          for n in 1041_transfer_abi 1043_live_third_handoff 1045_third_transfer_abi 1048_third_alarm_installer 1051_third_launch 1054_third_alarm_audit 1055_third_alarm_launch 1097_after_alarm_installer; do
            python3 -m unittest discover -s research/native_recomp -p "test_v$n.py" -v
          done
  owner-execution:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Require prior owner verification before private work
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 research/native_recomp/verify_v1062_owner_gate.py
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Revalidate private hook composition, link once and execute through original held callback return
        env:
          UNDERCOVER_RUN_V919_HANDLER_EPILOGUE: "1"
          UNDERCOVER_RUN_V920_HANDLER_RETURN: "1"
          UNDERCOVER_RUN_V921_CAPTURE_JOIN: "1"
          UNDERCOVER_RUN_V922_IRQ_RETURN: "1"
          UNDERCOVER_RUN_V932_PENDING_RFI: "1"
          UNDERCOVER_RUN_V939_SECOND_VECTOR: "1"
          UNDERCOVER_RUN_V951_SECOND_DISPATCH: "1"
          UNDERCOVER_RUN_V958_SECOND_ACK: "1"
          UNDERCOVER_RUN_V967_POST_ACK: "1"
          UNDERCOVER_RUN_V989_SHARED_COMPLETION: "1"
          UNDERCOVER_RUN_V1015_ERROR_COMPLETION: "1"
          UNDERCOVER_RUN_V975_SECOND_TIME: "1"
          UNDERCOVER_RUN_V981_SECOND_FRONTIER: "1"
          UNDERCOVER_RUN_V995_SUCCESS_FRONTIER: "1"
          UNDERCOVER_RUN_V1021_ERROR_FRONTIER: "1"
          UNDERCOVER_RUN_V1034_QUEUE_DETAIL: "1"
          UNDERCOVER_RUN_V1040_SIX_ARGS: "1"
          UNDERCOVER_PREPARE_V1029_THIRD_TRANSFER: "1"
          UNDERCOVER_RUN_V1051_THIRD_TRANSFER: "1"
          UNDERCOVER_PREPARE_V1048_THIRD_ALARM: "1"
          UNDERCOVER_RUN_V1055_THIRD_ALARM: "1"
          UNDERCOVER_RUN_V1102_AFTER_ALARM: "1"
          UNDERCOVER_PREPARE_V1097_AFTER_ALARM: "1"
          UNDERCOVER_RUN_V1107_POSTALARM_TIME: "1"
          UNDERCOVER_PREPARE_V1106_POSTALARM_TIME: "1"
          UNDERCOVER_RUN_V1114_POSTALARM_FRONTIER: "1"
          UNDERCOVER_PREPARE_V1113_POSTALARM_FRONTIER: "1"
          UNDERCOVER_RUN_V1121_POSTALARM_WIRELESS: "1"
          UNDERCOVER_PREPARE_V1119_POSTALARM_WIRELESS: "1"
          UNDERCOVER_RUN_V1127_POSTALARM_SUFFIX: "1"
          UNDERCOVER_PREPARE_V1124_POSTALARM_SUFFIX: "1"
          UNDERCOVER_RUN_V1135_POSTALARM_RETURN: "1"
          UNDERCOVER_PREPARE_V1134_POSTALARM_RETURN: "1"
          UNDERCOVER_RUN_V1012_SI_PROFILE: absent
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw876"
          git -C "$RUNNER_TEMP/nw876" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw876" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw876" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v572_full_sc_translation.sh "$RUNNER_TEMP/nw876" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --run-si-handler-suffix | tee "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1051_THIRD_BUILD_PLAN links=1 private_transfer=1 abi_proof_required=1 alarm=1' "$RUNNER_TEMP/v1059-public.log"
          grep -E '^V1049_PRIVATE_ABI_PROOF verified=1 states=[1-9][0-9]{0,4} incoming_reads=0 execution=0$' "$RUNNER_TEMP/v1059-public.log"
          grep -E '^V1029_THIRD_ROUTE installed=1 native_labels=[1-9][0-9]* direct_edges=6 exclusive_device=1 execution=0$' "$RUNNER_TEMP/v1059-public.log"
          grep -E '^V1048_THIRD_ALARM_ROUTE installed=1 native_labels=[1-9][0-9]* suffix_labels=[1-9][0-9]* original_edges=11 token_owner=3 execution=0$' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1102_POSTALARM_BUILD_PLAN links=1 private_installer=1 alarm_predecessor=1' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1107_POSTALARM_TIME_BUILD_PLAN links=1 private_installer=1 prefix_predecessor=1' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1114_POSTALARM_FRONTIER_BUILD_PLAN links=1 private_installer=1 time_predecessor=1' "$RUNNER_TEMP/v1059-public.log"
          grep -E '^V1097_AFTER_ALARM_ROUTE installed=1 native_labels=[1-9][0-9]* suffix_labels=[1-9][0-9]* callback_words=172 token_owner=3 execution=0$' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1106_POSTALARM_TIME_ROUTE installed=1 callback_labels=13 shared_labels=45 direct_edges=4 resume_reused=1 execution=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1113_POSTALARM_FRONTIER_ROUTE installed=1 callback_labels=27 direct_edges=2 resume_reused=1 execution=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V415_FULL_LINK_GATE linked=1 platform=linux-x64 launch=0 boot_verified=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1087_ALARM_HANDOFF started=1 first=1 stage=1 reason=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1048_THIRD_ALARM_RETURN original_return=1 queue=1 token=3 lane=0 timer=0 calls=3 visits=33 suffix_visits=6 status_reads=0 status_writes=0 token_held=1 saved_fields=38 handler_instruction_executed=0 boot_verified=0' "$RUNNER_TEMP/v1059-public.log"
          grep -E '^V1095_AFTER_ALARM_PREFIX original_indirect=1 original_prologue=1 save_return=1 suffix_visits=[1-9][0-9]{0,2} visits=13 writes=8 token=3 held=1 saved_fields=38 continuation_executed=0 boot_verified=0$' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1103_POSTALARM_TIME_RETURN original_return=1 leaves=3 system_visits=25 leaf_visits=18 polls=1 reads=3 offset=1 token=3 held=1 saved_fields=38 continuation_executed=0 boot_verified=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1111_POSTALARM_FRONTIER ordinal=3 visits=17 writes=3 zero_id=1 token=3 held=1 saved_fields=38 call_executed=0 boot_verified=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1121_POSTALARM_WIRELESS_BUILD_PLAN links=1 private_installer=1 frontier_predecessor=1' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1127_POSTALARM_SUFFIX_BUILD_PLAN links=1 private_installer=1 wireless_predecessor=1' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1135_POSTALARM_RETURN_BUILD_PLAN links=1 private_installer=1 suffix_predecessor=1' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1134_POSTALARM_RETURN_ROUTE installed=1 restore_labels=7 tail_labels=4 handler_resume=1 outer_tick=1 execution=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1118_POSTALARM_WIRELESS_RETURN original_setter=1 original_unlock=1 changed=0 visits=66 stores=12 token=3 held=1 saved_fields=38 continuation_executed=0 boot_verified=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1123_POSTALARM_SUFFIX ordinal=13 target_class=0 visits=37 writes=0 polls=4 token=3 held=1 saved_fields=38 call_executed=0 boot_verified=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1132_POSTALARM_RETURN original_restore=1 original_return=1 visits=12 token=3 held=1 saved_fields=38 handler_instruction_executed=0 boot_verified=0' "$RUNNER_TEMP/v1059-public.log"
          grep -Fx 'V1135_POSTALARM_RETURN_CENSUS verified=1 original_callback_return=1 token_held=1 boot_verified=0' "$RUNNER_TEMP/v1059-public.log"
          echo 'V1160_CONTINUOUS_CALLBACK_RETURN verified=1 original_wireless=1 original_suffix=1 original_callback_return=1 boot_verified=0'
      - name: Clean private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw876" "$RUNNER_TEMP/v1059-public.log"
