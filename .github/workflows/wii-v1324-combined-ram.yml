name: Wii V1324 Combined RAM Manifest
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/V1324_COMBINED_RAM_MANIFEST.md'
      - '.github/workflows/wii-v1324-combined-ram.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v1321_combined_resume.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_private_expansion_seed_v1323.cpp -o /tmp/v1324
          /tmp/v1324
