name: Wii Private Plan Cache
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/private_plan_cache.py'
      - 'research/native_recomp/test_private_plan_cache.py'
      - 'research/native_recomp/benchmark_formatter_plan_cache.py'
      - 'research/native_recomp/test_formatter_plan_cache_benchmark.py'
      - '.github/workflows/wii-private-plan-cache.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 research/native_recomp/test_private_plan_cache.py
          python3 research/native_recomp/test_formatter_plan_cache_benchmark.py
          python3 research/native_recomp/test_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_continuation_fixture.py
          python3 research/native_recomp/test_formatter_second_contract.py
          python3 research/native_recomp/test_post_stm_sc_report_formatter_path.py
  owner-benchmark:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Compare original planning results with scoped memoization
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/benchmark_formatter_plan_cache.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean private original inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
