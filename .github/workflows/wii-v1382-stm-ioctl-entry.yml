name: Wii V1382 STM Ioctl Entry Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_stm_ioctl_entry.h'
      - 'research/native_recomp/test_stm_ioctl_entry.cpp'
      - '.github/workflows/wii-v1382-stm-ioctl-entry.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_stm_ioctl_entry.cpp -o /tmp/v1382
          /tmp/v1382
