name: Wii Full Recompilation Build Probe
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      # Do not displace a queued original-image run on unrelated NAND,
      # Windows-only or documentation changes. Match shared build inputs.
      - 'research/native_recomp/prepare_v*_full_*.py'
      - 'research/native_recomp/audit_v*_full_*.py'
      - 'research/native_recomp/test_v*_full_*.py'
      - 'research/native_recomp/wii_full_*.h'
      - 'research/native_recomp/test_wii_full_*.cpp'
      - 'research/native_recomp/wii_probe_log_format.h'
      - 'research/native_recomp/test_wii_probe_log_format.cpp'
      - 'research/native_recomp/run_full_recomp_probe_ci.sh'
      - 'research/native_recomp/run_private_full_*.sh'
      - 'research/native_recomp/make_private_elf_symbol_map.py'
      - 'research/native_recomp/test_private_elf_symbol_map.py'
      - 'research/native_recomp/offline_recompiler_driver_v6.cpp'
      - 'research/native_recomp/apply_psq_indexed_patch.py'
      - 'research/native_recomp/apply_psq_estimate_and_gqr_v5.py'
      - 'research/native_recomp/apply_verified_elf_spans_v6.py'
      - 'research/native_recomp/apply_hid_state_v18.py'
      - 'research/native_recomp/apply_fpscr_v19.py'
      - 'research/native_recomp/apply_l2cr_v20.py'
      - 'research/native_recomp/apply_mtmsr_resume_v74.py'
      - 'research/native_recomp/apply_perf_sprs_v29.py'
      - 'research/native_recomp/verify_perf_combo_v29.py'
      - 'research/native_recomp/apply_hid4*'
      - 'research/native_recomp/*v443*'
      - 'research/native_recomp/*v445*'
      - 'research/native_recomp/*v438*'
      - 'research/native_recomp/make_osinit_lowmem_v31.py'
      - 'research/native_recomp/make_osinit_arena_v32.py'
      - 'research/native_recomp/make_osinit_mem2_v37.py'
      - 'research/native_recomp/make_osinit_ipc_v38.py'
      - 'research/native_recomp/*v457*'
      - 'research/native_recomp/*v466*'
      - 'research/native_recomp/test_v468_exception_pack_geometry.py'
      - 'research/native_recomp/*v470*'
      - 'research/native_recomp/*v473*'
      - 'research/native_recomp/*v475*'
      - 'research/native_recomp/*v476*'
      - 'research/native_recomp/*v480*'
      - 'research/native_recomp/*v481*'
      - 'research/native_recomp/*v482*'
      - 'research/native_recomp/*v483*'
      - 'research/native_recomp/*v486*'
      - 'research/native_recomp/*v488*'
      - 'research/native_recomp/*v489*'
      - 'research/native_recomp/*v490*'
      - 'research/native_recomp/*v491*'
      - 'research/native_recomp/*v500*'
      - 'research/native_recomp/*v504*'
      - 'research/native_recomp/*v505*'
      - 'research/native_recomp/*v510*'
      - 'research/native_recomp/*v520*'
      - 'research/native_recomp/apply_cache_order_v456.py'
      - 'research/native_recomp/apply_cache_continuous_v39.py'
      - 'research/native_recomp/apply_cache_events_v43.py'
      - 'research/native_recomp/apply_cache_trace_v44.py'
      - 'research/native_recomp/apply_dcbz_v67.py'
      - 'research/native_recomp/flat_cacheline_zero_v67.h'
      - '.github/workflows/wii-full-recomp-probe.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Sample syntax, all shards, native link, bounded startup, hardware, cache, data, OS entry, time, memory arenas, IPC, exception vectors, alarm or IRQ table'
        type: choice
        required: true
        default: sample
        options: [sample, all, link, startup, hardware, cache, data, os-entry, os-time, os-hardware, os-arena, os-ipc, os-vector, os-pack, os-alarm, os-irq, os-mmio, os-irq-return, os-context, os-cache-reuse, os-exi-poll, os-exi-handlers, os-exi-id, os-exi-absent, os-si-entry]
permissions:
  contents: read
concurrency:
  group: wii-full-recomp-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-symbol-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      link_requested: ${{ steps.link_request.outputs.link_requested }}
      startup_requested: ${{ steps.link_request.outputs.startup_requested }}
      hardware_requested: ${{ steps.link_request.outputs.hardware_requested }}
      cache_requested: ${{ steps.link_request.outputs.cache_requested }}
      data_requested: ${{ steps.link_request.outputs.data_requested }}
      os_entry_requested: ${{ steps.link_request.outputs.os_entry_requested }}
      os_time_requested: ${{ steps.link_request.outputs.os_time_requested }}
      os_hardware_requested: ${{ steps.link_request.outputs.os_hardware_requested }}
      os_arena_requested: ${{ steps.link_request.outputs.os_arena_requested }}
      os_ipc_requested: ${{ steps.link_request.outputs.os_ipc_requested }}
      os_vector_requested: ${{ steps.link_request.outputs.os_vector_requested }}
      os_pack_requested: ${{ steps.link_request.outputs.os_pack_requested }}
      os_alarm_requested: ${{ steps.link_request.outputs.os_alarm_requested }}
      os_irq_requested: ${{ steps.link_request.outputs.os_irq_requested }}
      os_mmio_requested: ${{ steps.link_request.outputs.os_mmio_requested }}
      os_irq_return_requested: ${{ steps.link_request.outputs.os_irq_return_requested }}
      os_context_requested: ${{ steps.link_request.outputs.os_context_requested }}
      os_exi_poll_requested: ${{ steps.link_request.outputs.os_exi_poll_requested }}
      os_exi_handlers_requested: ${{ steps.link_request.outputs.os_exi_handlers_requested }}
      os_exi_id_requested: ${{ steps.link_request.outputs.os_exi_id_requested }}
      os_exi_absent_requested: ${{ steps.link_request.outputs.os_exi_absent_requested }}
      os_si_entry_requested: ${{ steps.link_request.outputs.os_si_entry_requested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Test original-free big-endian Wii ELF symbol reader
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_private_elf_symbol_map.py -v
          python3 -m py_compile research/native_recomp/make_private_elf_symbol_map.py
          bash -n research/native_recomp/run_full_recomp_probe_ci.sh
      - name: Test private complete-link helper without game code
        run: |
          set -euo pipefail
          bash -n research/native_recomp/run_private_full_link.sh
          python3 -m unittest discover -s research/native_recomp -p test_v415_private_full_link.py -v
      - name: Test bounded full-image startup witness without game code
        run: |
          set -euo pipefail
          bash -n research/native_recomp/run_private_full_start.sh
          python3 -m unittest discover -s research/native_recomp -p test_v419_full_start.py -v
          g++ -std=c++20 -Wall -Wextra -Werror -Iresearch/native_recomp research/native_recomp/test_wii_full_start_witness.cpp -o "$RUNNER_TEMP/v419-witness"
          "$RUNNER_TEMP/v419-witness"
      - name: Test complete-image hardware continuation witness
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v425_full_hardware.py -v
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_full_hardware_witness.cpp -o "$RUNNER_TEMP/v425-witness"
          "$RUNNER_TEMP/v425-witness"
      - name: Test complete-image cache and error-handler continuation witness
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v428_full_cache.py -v
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_full_cache_witness.cpp -o "$RUNNER_TEMP/v428-witness"
          "$RUNNER_TEMP/v428-witness"
      - name: Test complete-image data continuation witness
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v430_full_data.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_full_data_witness.cpp -o "$RUNNER_TEMP/v430-witness"
          "$RUNNER_TEMP/v430-witness"
      - name: Test complete-image DBInit and OSInit entry witness
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v433_full_os_entry.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_full_os_entry_witness.cpp -o "$RUNNER_TEMP/v433-witness"
          "$RUNNER_TEMP/v433-witness"
      - name: Test complete-image cold OSInit and time witness
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p 'test_v435_full_os_time*.py' -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_full_os_time_witness.cpp -o "$RUNNER_TEMP/v435-witness"
          "$RUNNER_TEMP/v435-witness"
      - name: Test OSInit execution parameters and hardware-register continuation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v439_full_os_hardware.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_full_os_hardware_witness.cpp -o "$RUNNER_TEMP/v439-witness"
          "$RUNNER_TEMP/v439-witness"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_probe_log_format.cpp -o "$RUNNER_TEMP/v449-format"
          "$RUNNER_TEMP/v449-format"
      - name: Test complete-image boot info and MEM1 arena witness
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v444_full_os_arena.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_full_os_arena_witness.cpp -o "$RUNNER_TEMP/v444-witness"
          "$RUNNER_TEMP/v444-witness"
      - name: Test complete-image MEM2 and IPC pointer witness
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v446_full_os_ipc.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_full_os_ipc_witness.cpp -o "$RUNNER_TEMP/v446-witness"
          "$RUNNER_TEMP/v446-witness"
      - name: Verify original-free first-vector continuation witness
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v457_exception_vector.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exception_vector_witness_v457.cpp -o "$RUNNER_TEMP/v457-witness"
          "$RUNNER_TEMP/v457-witness"
      - name: Verify complete exception pack and private geometry
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v466_exception_pack.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v468_exception_pack_geometry.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exception_pack_route_v466.cpp -o "$RUNNER_TEMP/v466-route"
          "$RUNNER_TEMP/v466-route"
      - name: Verify original-free alarm and IRQ table continuations
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v470_alarm_startup.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v473_module_irq.py -v
          for v in 470 473; do
            if [[ "$v" == 470 ]]; then unit=test_wii_alarm_startup_witness_v470.cpp; else unit=test_wii_module_irq_witness_v473.cpp; fi
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$unit" -o "$RUNNER_TEMP/v$v-witness"
            "$RUNNER_TEMP/v$v-witness"
          done
          python3 -m unittest discover -s research/native_recomp -p test_v475_irq_bootstrap.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v476_irq_mmio.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_irq_bootstrap_v475.cpp -o "$RUNNER_TEMP/v475-irq"
          "$RUNNER_TEMP/v475-irq"
          python3 -m unittest discover -s research/native_recomp -p test_v483_irq_return.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_irq_return_witness_v482.cpp -o "$RUNNER_TEMP/v482-irq"
          "$RUNNER_TEMP/v482-irq"
          python3 -m unittest discover -s research/native_recomp -p test_v486_context_startup.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_context_startup_witness_v486.cpp -o "$RUNNER_TEMP/v486-context"
          "$RUNNER_TEMP/v486-context"
          python3 -m unittest discover -s research/native_recomp -p test_v488_os_cache_reuse.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v491_exi_poll.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_os_cache_reuse_v488.cpp -o "$RUNNER_TEMP/v488-reuse"
          "$RUNNER_TEMP/v488-reuse"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_poll_witness_v491.cpp -o "$RUNNER_TEMP/v491-poll"
          "$RUNNER_TEMP/v491-poll"
          python3 -m unittest discover -s research/native_recomp -p test_v500_exi_handlers.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_handler_witness_v500.cpp -o "$RUNNER_TEMP/v500-handlers"
          "$RUNNER_TEMP/v500-handlers"
          python3 -m unittest discover -s research/native_recomp -p test_v504_exi_id.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v505_exi_profile_writer.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_id_witness_v504.cpp -o "$RUNNER_TEMP/v504-id"
          "$RUNNER_TEMP/v504-id"
          python3 -m unittest discover -s research/native_recomp -p test_v510_exi_absent.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_absent_witness_v510.cpp -o "$RUNNER_TEMP/v510-absent"
          "$RUNNER_TEMP/v510-absent"
          python3 -m unittest discover -s research/native_recomp -p test_v520_si_entry.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_si_entry_witness_v520.cpp -o "$RUNNER_TEMP/v520-si-entry"
          "$RUNNER_TEMP/v520-si-entry"
      - name: Select private link or startup only for relevant changes
        if: github.event_name == 'push'
        id: link_request
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          requested=false
          startup=false
          hardware=false
          cache=false
          data=false
          os_entry=false
          os_time=false
          os_hardware=false
          os_arena=false
          os_ipc=false
          os_vector=false
          os_pack=false
          os_alarm=false
          os_irq=false
          os_mmio=false
          os_irq_return=false
          os_context=false
          os_exi_poll=false
          os_exi_handlers=false
          os_exi_id=false
          os_exi_absent=false
          os_si_entry=false
          # Do not run the expensive original-image build on every startup
          # probe. Compare the actual push range, not a commit message.
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch -q --depth=1 origin "$BEFORE"
            fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/run_private_full_link.sh \
              research/native_recomp/run_full_recomp_probe_ci.sh \
              research/native_recomp/offline_recompiler_driver_v6.cpp \
              research/native_recomp/make_private_elf_symbol_map.py \
              research/native_recomp/apply_psq_indexed_patch.py \
              research/native_recomp/apply_psq_estimate_and_gqr_v5.py \
              research/native_recomp/apply_verified_elf_spans_v6.py || rc=$?
            if [[ "$rc" == 1 ]]; then requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v419_full_start.py \
              research/native_recomp/audit_v419_full_start.py \
              research/native_recomp/run_private_full_start.sh \
              research/native_recomp/wii_full_start_witness.h \
              research/native_recomp/wii_full_start_probe_v419.h || rc=$?
            if [[ "$rc" == 1 ]]; then startup=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v425_full_hardware.py \
              research/native_recomp/audit_v425_full_hardware.py \
              research/native_recomp/wii_full_hardware_witness.h \
              research/native_recomp/wii_full_hardware_probe_v425.h \
              research/native_recomp/apply_hid_state_v18.py \
              research/native_recomp/apply_fpscr_v19.py || rc=$?
            if [[ "$rc" == 1 ]]; then hardware=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v428_full_cache.py \
              research/native_recomp/audit_v428_full_cache.py \
              research/native_recomp/wii_full_cache_witness.h \
              research/native_recomp/apply_l2cr_v20.py \
              research/native_recomp/apply_mtmsr_resume_v74.py || rc=$?
            if [[ "$rc" == 1 ]]; then cache=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v430_full_data.py \
              research/native_recomp/audit_v430_full_data.py \
              research/native_recomp/wii_full_data_witness.h || rc=$?
            if [[ "$rc" == 1 ]]; then data=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v433_full_os_entry.py \
              research/native_recomp/audit_v433_full_os_entry.py \
              research/native_recomp/wii_full_os_entry_witness.h || rc=$?
            if [[ "$rc" == 1 ]]; then os_entry=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v435_full_os_time.py \
              research/native_recomp/audit_v435_full_os_time.py \
              research/native_recomp/wii_full_os_time_witness.h || rc=$?
            if [[ "$rc" == 1 ]]; then os_time=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v439_full_os_hardware.py \
              research/native_recomp/audit_v439_full_os_hardware.py \
              research/native_recomp/test_v439_full_os_hardware.py \
              research/native_recomp/apply_perf_sprs_v29.py \
              research/native_recomp/verify_perf_combo_v29.py \
              research/native_recomp/apply_hid4_continuous_v30.py \
              research/native_recomp/apply_hid4_fp_v30.py \
              research/native_recomp/wii_full_os_hardware_witness.h \
              research/native_recomp/wii_probe_log_format.h \
              research/native_recomp/test_wii_probe_log_format.cpp \
              research/native_recomp/apply_function_root_v443.py \
              research/native_recomp/run_v443_function_root.sh \
              research/native_recomp/generate_function_root_v443.cpp \
              research/native_recomp/test_native_root_v443.cpp || rc=$?
            if [[ "$rc" == 1 ]]; then os_hardware=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v444_full_os_arena.py \
              research/native_recomp/audit_v444_full_os_arena.py \
              research/native_recomp/wii_full_os_arena_witness.h \
              research/native_recomp/make_osinit_lowmem_v31.py \
              research/native_recomp/make_osinit_arena_v32.py || rc=$?
            if [[ "$rc" == 1 ]]; then os_arena=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v446_full_os_ipc.py \
              research/native_recomp/audit_v446_full_os_ipc.py \
              research/native_recomp/wii_full_os_ipc_witness.h \
              research/native_recomp/make_osinit_mem2_v37.py \
              research/native_recomp/make_osinit_ipc_v38.py \
              research/native_recomp/apply_exact_dispatch_v445.py \
              research/native_recomp/apply_native_tick_v438.py || rc=$?
