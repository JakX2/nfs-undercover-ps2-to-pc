  private-translation:
    needs: synthetic-symbol-map
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || needs.synthetic-symbol-map.outputs.link_requested == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin gdown downloader version
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: SHA-verify private original Wii DOL and ELF
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Fetch pinned NWiiRecomp
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
      - name: Translate owner Wii DOL and validate generated C++ without publishing it
        env:
          PROBE_SCOPE: ${{ inputs.scope || (needs.synthetic-symbol-map.outputs.os_si_entry_requested == 'true' && 'os-si-entry' || (needs.synthetic-symbol-map.outputs.os_exi_absent_requested == 'true' && 'os-exi-absent' || (needs.synthetic-symbol-map.outputs.os_exi_id_requested == 'true' && 'os-exi-id' || (needs.synthetic-symbol-map.outputs.os_exi_handlers_requested == 'true' && 'os-exi-handlers' || (needs.synthetic-symbol-map.outputs.os_exi_poll_requested == 'true' && 'os-exi-poll' || (needs.synthetic-symbol-map.outputs.os_context_requested == 'true' && 'os-context' || (needs.synthetic-symbol-map.outputs.os_irq_return_requested == 'true' && 'os-irq-return' || (needs.synthetic-symbol-map.outputs.os_mmio_requested == 'true' && 'os-mmio' || (needs.synthetic-symbol-map.outputs.os_irq_requested == 'true' && 'os-irq' || (needs.synthetic-symbol-map.outputs.os_alarm_requested == 'true' && 'os-alarm' || (needs.synthetic-symbol-map.outputs.os_pack_requested == 'true' && 'os-pack' || (needs.synthetic-symbol-map.outputs.os_vector_requested == 'true' && 'os-vector' || (needs.synthetic-symbol-map.outputs.os_ipc_requested == 'true' && 'os-ipc' || (needs.synthetic-symbol-map.outputs.os_arena_requested == 'true' && 'os-arena' || (needs.synthetic-symbol-map.outputs.os_hardware_requested == 'true' && 'os-hardware' || (needs.synthetic-symbol-map.outputs.os_time_requested == 'true' && 'os-time' || (needs.synthetic-symbol-map.outputs.os_entry_requested == 'true' && 'os-entry' || (needs.synthetic-symbol-map.outputs.data_requested == 'true' && 'data' || (needs.synthetic-symbol-map.outputs.cache_requested == 'true' && 'cache' || (needs.synthetic-symbol-map.outputs.hardware_requested == 'true' && 'hardware' || (needs.synthetic-symbol-map.outputs.startup_requested == 'true' && 'startup' || 'link'))))))))))))))))))))) }}
        run: |
          set -euo pipefail
          umask 077
          bash research/native_recomp/run_full_recomp_probe_ci.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            "$RUNNER_TEMP/originals/NfsMWRelease.elf" "$RUNNER_TEMP/private-translated" "$PROBE_SCOPE"
      - name: Clean owner files, generated original code and all private logs
        if: always()
        run: |
