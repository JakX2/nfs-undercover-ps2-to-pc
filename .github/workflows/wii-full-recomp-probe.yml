name: Wii Full Recompilation Build Probe
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/**'
      - '.github/workflows/wii-full-recomp-probe.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Sample syntax, all shards, native link, or bounded native startup'
        type: choice
        required: true
        default: sample
        options: [sample, all, link, startup]
permissions:
  contents: read
concurrency:
  group: wii-full-recomp-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-symbol-map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      link_requested: ${{ steps.link_request.outputs.link_requested }}
      startup_requested: ${{ steps.link_request.outputs.startup_requested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Test original-free big-endian Wii ELF symbol reader
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_private_elf_symbol_map.py -v
          python3 -m py_compile research/native_recomp/make_private_elf_symbol_map.py
          bash -n research/native_recomp/run_full_recomp_probe_ci.sh
      - name: Test private complete-link helper without game code
        run: |
          set -euo pipefail
          bash -n research/native_recomp/run_private_full_link.sh
          python3 -m unittest discover -s research/native_recomp -p test_v415_private_full_link.py -v
      - name: Test bounded full-image startup witness without game code
        run: |
          set -euo pipefail
          bash -n research/native_recomp/run_private_full_start.sh
          python3 -m unittest discover -s research/native_recomp -p test_v419_full_start.py -v
          g++ -std=c++20 -Wall -Wextra -Werror -Iresearch/native_recomp research/native_recomp/test_wii_full_start_witness.cpp -o "$RUNNER_TEMP/v419-witness"
          "$RUNNER_TEMP/v419-witness"
      - name: Select private link or startup only for relevant changes
        if: github.event_name == 'push'
        id: link_request
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          requested=false
          startup=false
          # Do not run the expensive original-image build on every startup
          # probe. Compare the actual push range, not a commit message.
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch -q --depth=1 origin "$BEFORE"
            fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/run_private_full_link.sh \
              research/native_recomp/run_full_recomp_probe_ci.sh || rc=$?
            if [[ "$rc" == 1 ]]; then requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
            rc=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/native_recomp/prepare_v419_full_start.py \
              research/native_recomp/audit_v419_full_start.py \
              research/native_recomp/run_private_full_start.sh \
              research/native_recomp/wii_full_start_witness.h \
              research/native_recomp/wii_full_start_probe_v419.h || rc=$?
            if [[ "$rc" == 1 ]]; then startup=true; requested=true
            elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
          fi
          echo "link_requested=$requested" >> "$GITHUB_OUTPUT"
          echo "startup_requested=$startup" >> "$GITHUB_OUTPUT"
  private-translation:
    needs: synthetic-symbol-map
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || needs.synthetic-symbol-map.outputs.link_requested == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin gdown downloader version
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: SHA-verify private original Wii DOL and ELF
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Fetch pinned NWiiRecomp
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
      - name: Translate owner Wii DOL and validate generated C++ without publishing it
        env:
          PROBE_SCOPE: ${{ inputs.scope || (needs.synthetic-symbol-map.outputs.startup_requested == 'true' && 'startup' || 'link') }}
        run: |
          set -euo pipefail
          umask 077
          bash research/native_recomp/run_full_recomp_probe_ci.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            "$RUNNER_TEMP/originals/NfsMWRelease.elf" "$RUNNER_TEMP/private-translated" "$PROBE_SCOPE"
      - name: Clean owner files, generated original code and all private logs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/private-translated"
