name: Wii Original MI Mapper ABI
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v630*'
      - '.github/workflows/wii-v630-mapper-abi.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify conservative PPC liveness classifier
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_mapper_abi_v630.cpp -o "$RUNNER_TEMP/abi"
          "$RUNNER_TEMP/abi"
  owner-mapper-abi:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Classify original mapper GPR3 input liveness
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/make_v630_mapper_abi.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" "$RUNNER_TEMP/originals/v630_private_mapper_prefix.h"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -DUNDERCOVER_V630_OWNER -Iresearch/native_recomp -I"$RUNNER_TEMP/originals" research/native_recomp/test_wii_mapper_abi_v630.cpp -o "$RUNNER_TEMP/originals/abi"
          "$RUNNER_TEMP/originals/abi"
      - name: Clean private original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
