name: Wii Formatter Epilogue Audit
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/audit_formatter_epilogue.py'
      - 'research/native_recomp/test_formatter_epilogue.py'
      - '.github/workflows/wii-formatter-epilogue-audit.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-epilogue-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_formatter_epilogue.py
          python3 research/native_recomp/test_stm_outer_restore.py
          python3 research/native_recomp/test_formatter_epilogue.py
  owner-geometry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require verified original stack byte provenance and expanded symbolic replay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          reqs=(
              Requirement(45955086674,'7f14affec6dd2d62eecf6d0fd03e1b2992e1eed7',
                          '.github/workflows/wii-formatter-post-ctr-owner.yml','owner-post-ctr'),
              Requirement(45957277734,'9a4a9ae9cbfd5c706ab3096df6f7c5734806afca',
                          '.github/workflows/wii-formatter-special-contract.yml','owner-geometry'),
          )
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          if not all(verify(fetch,x) for x in reqs):raise SystemExit('FORMATTER_EPILOGUE_AUDIT_GATE verified=0')
          print('FORMATTER_EPILOGUE_AUDIT_GATE verified=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Audit next original instruction after caller LR restoration
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_formatter_epilogue.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean private originals
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
