name: Physics steering research (synthetic tests)

on:
  pull_request:
    paths:
      - "physics/phase33/**"
      - "physics/phase36/**"
      - "physics/phase37/**"
      - "physics/phase38/**"
      - "physics/phase39/**"
      - "physics/phase40/**"
      - "physics/phase41/**"
      - "physics/phase42/**"
      - "physics/phase43/**"
      - "physics/phase44/**"
      - "physics/phase45/**"
      - "physics/phase46/**"
      - ".github/workflows/physics-steering-tests.yml"
  push:
    branches:
      - "research/physics-phase31-steering"
    paths:
      - "physics/phase33/**"
      - "physics/phase36/**"
      - "physics/phase37/**"
      - "physics/phase38/**"
      - "physics/phase39/**"
      - "physics/phase40/**"
      - "physics/phase41/**"
      - "physics/phase42/**"
      - "physics/phase43/**"
      - "physics/phase44/**"
      - "physics/phase45/**"
      - "physics/phase46/**"
      - ".github/workflows/physics-steering-tests.yml"

permissions:
  contents: read

jobs:
  synthetic-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Phase 36 synthetic tests
        run: python -m unittest discover -s physics/phase36 -p 'test_*.py' -v
      - name: Phase 37 synthetic tests
        run: python -m unittest discover -s physics/phase37 -p 'test_*.py' -v
      - name: Phase 38 synthetic tests
        run: python -m unittest discover -s physics/phase38 -p 'test_*.py' -v
      - name: Phase 39 synthetic tests
        run: python -m unittest discover -s physics/phase39 -p 'test_*.py' -v
      - name: Phase 40 synthetic tests
        run: python -m unittest discover -s physics/phase40 -p 'test_*.py' -v
      - name: Phase 41 synthetic tests
        run: python -m unittest discover -s physics/phase41 -p 'test_*.py' -v
      - name: Phase 42 synthetic tests
        run: python -m unittest discover -s physics/phase42 -p 'test_*.py' -v
      - name: Phase 43 synthetic tests
        run: python -m unittest discover -s physics/phase43 -p 'test_*.py' -v
      - name: Phase 44 synthetic tests
        run: python -m unittest discover -s physics/phase44 -p 'test_*.py' -v
      - name: Phase 45 synthetic tests
        run: python -m unittest discover -s physics/phase45 -p 'test_*.py' -v
      - name: Phase 46 synthetic tests
        run: python -m unittest discover -s physics/phase46 -p 'test_*.py' -v
