name: Wii V1265 IPC Dispatcher Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/test_ipc_dispatch_contract_v1265.cpp'
      - '.github/workflows/wii-v1265-ipc-dispatch-contract.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Native ACK and dispatcher witness refusal cases
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_ipc_dispatch_contract_v1265.cpp -o "$RUNNER_TEMP/v1265-contract"
          "$RUNNER_TEMP/v1265-contract"
