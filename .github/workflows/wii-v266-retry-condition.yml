name: Wii V266 Original Wii Retry CR0 Compare
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v266*'
      - '.github/workflows/wii-v266-retry-condition.yml'
permissions:
  contents: read
concurrency:
  group: wii-v266-retry-condition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v266:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V266 original-free branch compare producer
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/ppc_retry_condition.py research/native_recomp/audit_v266_retry_condition.py research/native_recomp/test_v266_retry_condition.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v266_retry_condition.py' -v
          echo 'PASS: original-free V266 CR producer semantics'
  owner-original-v266:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V266 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Audit authentic original Wii condition-register producer privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v266_retry_condition.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v266.log" 2>&1 || {
            grep -E '^V266_CONDITION_AUDIT verified=0$' "$RUNNER_TEMP/v266.log" | sort -u || true
            echo 'V266 compare producer not verified; private original withheld' >&2
            exit 1
          }
          grep -Fx 'V266_CONDITION_AUDIT verified=1' "$RUNNER_TEMP/v266.log"
          grep -E '^V266_CONDITION backedge_from=-?[0-9]{1,3} backedge_to=-?[0-9]{1,3} prev_distance=4 producer_kind=[0-5] producer_cr_field=(-1|[0-7]) producer_ra=(-1|[0-9]|[1-2][0-9]|3[01]) producer_rb=(-1|[0-9]|[1-2][0-9]|3[01]) producer_imm_zero=(-1|[01]) compares_helper_r3=[01]$' "$RUNNER_TEMP/v266.log"
          echo 'PASS: V266 authenticated original Wii retry comparison'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v266.log"
