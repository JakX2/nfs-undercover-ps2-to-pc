name: Wii V109 Original Nonempty SC Path Copy
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v109*'
      - '.github/workflows/wii-v109-sc-nonempty.yml'
permissions:
  contents: read
concurrency:
  group: wii-v109-sc-path-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-sc-path-v109:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Prepare pinned original-free NWii runtime and cache traces
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_perf_patch_guards_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/verify_perf_combo_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_hid4_continuous_patch_v30.py"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_continuous_patch_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_trace_guards_v44.py"
          python3 "$here/apply_jump_table_v58.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_jump_table_patch_v58.py"
          python3 "$here/apply_dcbi_v60.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hollywood_mmio_v62.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_native_lowmem_v63.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_bat_registers_v65.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbz_v67.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_exception_sprg.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_mtmsr_resume_v74.py" "$RUNNER_TEMP/nwii"
          echo 'PASS: V72 focused runtime prerequisites prepared and original-free source guards passed'
      - name: Execute owner-original nonempty SC pathname copy
        run: |
          set -euo pipefail
          umask 077
          bash research/native_recomp/run_v109_continuous_sc_nonempty.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/sc109.log" 2>&1 || {
              grep -E '^V109_WRAPPER (derived|syntax_ok|syntax_failed)$|^V109_WRAPPER_SYNTAX line=[0-9]+$|^V104_STAGE (runtime_cache_trace_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/sc109.log" || true
              grep -E '^V77_(HARNESS_LINE|GENERATOR_LINE) [0-9]+$|^V77_COMPILE_UNIT (harness|generated|loader|generator)$|^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc109.log" || true
              code="$(grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc109.log" | tail -n 1 | cut -d= -f2 || true)"
              if [[ "$code" =~ ^[0-9]{3}$ ]]; then
                python3 research/native_recomp/diagnose_sc_nonempty_v109.py "$((10#$code))" || true
              fi
              grep -E '^V109_SC_SECOND_SOURCE order=[01] mapped=[01] terminated=[01] empty=[01] output=[01] abi=[01]$|^V109_SC_SECOND_COPY input=[01] bounded=[01]$|^V109_SC_NEXT_LENGTH route=[01] data=[01] prior=[01]$|^V109_TRIAL_PASS trial=[0-9]{1,2}$' "$RUNNER_TEMP/sc109.log" | sort -u || true
              echo 'V109 owner-original SC path candidate failed; private diagnostics withheld' >&2
              exit 1
            }
          # Preserve earlier stage evidence for context, not as a second
          # route-specific success requirement. The V109 private runner has
          # already verified all 16 trials and both original copy predicates.
          grep -E '^V104_STAGE (runtime_cache_trace_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled)$' "$RUNNER_TEMP/sc109.log" | sort -u || true
          grep -E '^V107_SC_SOURCE mapped=[01] empty=[01] original_literal=[01]$|^V108_SC_GATE owner=[01] empty=[01] span=[01]$|^V108_SC_RESTORE owner=[01] empty_before=[01] exact=[01]$' "$RUNNER_TEMP/sc109.log" | sort -u || true
          grep -Fx 'V109_WRAPPER derived' "$RUNNER_TEMP/sc109.log"
          grep -Fx 'V109_WRAPPER syntax_ok' "$RUNNER_TEMP/sc109.log"
          grep -Fx 'V109_NATIVE_EXIT ok=1' "$RUNNER_TEMP/sc109.log"
          grep -Fx 'V109_STAGE native_test_passed' "$RUNNER_TEMP/sc109.log"
          grep -Fx 'V109_SC_SECOND_COPY input=1 bounded=1' "$RUNNER_TEMP/sc109.log"
          grep -Fx 'V109_SC_NEXT_LENGTH route=1 data=1 prior=1' "$RUNNER_TEMP/sc109.log"
          grep -Fx 'BOOT_PROGRESS entry=0x8000403C pc=0x80544AC0 stage=109' "$RUNNER_TEMP/sc109.log"
          echo 'PASS: owner-original V109 SC nonempty branch reached original next strlen'
      - name: Remove private owner and generated code
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals" "$RUNNER_TEMP/sc109.log"
