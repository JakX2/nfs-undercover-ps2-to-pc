name: V59 same-handle ROOT source integrity (asset-free)
on:
  push:
    paths:
      - 'research/v59/**'
      - 'research/v55/v55_cross_scene_hypothesis_gate.py'
      - '.github/workflows/v59-asset-free-tests.yml'
  pull_request:
    paths:
      - 'research/v59/**'
      - 'research/v55/v55_cross_scene_hypothesis_gate.py'
      - '.github/workflows/v59-asset-free-tests.yml'
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V59 same-handle tests
        run: python -m unittest discover -s research/v59 -p 'test_v59.py' -v
      - name: V55 cross-scene regression tests (private fixture skipped)
        run: python -m unittest discover -s research/v55 -p 'test_v55.py' -v
      - name: V56 candidate graph regression tests (private fixture skipped)
        run: python -m unittest discover -s research/v56 -p 'test_v56.py' -v
      - name: V58 archive scanner regression tests
        run: python -m unittest discover -s research/v58 -p 'test_v58.py' -v
