name: Wii V1303 Cleared IRQ Idle Select Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-v1303-cleared-select.yml'
      - 'research/native_recomp/wii_live_epilogue_v762.h'
      - 'research/native_recomp/test_live_epilogue_select_v1284.cpp'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify pending and cleared native scheduler epilogue contracts
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_live_epilogue_select_v1284.cpp -o /tmp/v1303
          /tmp/v1303
