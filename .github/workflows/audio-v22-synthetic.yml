name: Audio V22 synthetic validation

on:
  pull_request:
    paths:
      - 'audio/**'
      - '.github/workflows/audio-v22-synthetic.yml'
  push:
    branches:
      - 'research/audio-v22-decoder-validation'
    paths:
      - 'audio/**'
      - '.github/workflows/audio-v22-synthetic.yml'

permissions:
  contents: read

jobs:
  test-audio-harness:
    name: PCM comparison regression tests (synthetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run stdlib-only V22 synthetic tests
        run: python -m unittest discover -s audio/tests -p 'test_*.py' -v
