name: Audio V22-V28 real decoder and private MT10 bridge

on:
  pull_request:
    paths:
      - 'audio/**'
      - '.github/workflows/audio-v22-synthetic.yml'
  push:
    branches:
      - 'research/audio-v22-decoder-validation'
    paths:
      - 'audio/**'
      - '.github/workflows/audio-v22-synthetic.yml'

permissions:
  contents: read

jobs:
  synthetic-audio-validation:
    name: V22-V28 stdlib-only synthetic regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s audio/tests -p 'test_*.py' -v

  vgmstream-cli-smoke:
    name: Official CLI plus generated PCM/TXTH decode (no game audio)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download latest vgmstream static Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vgmstream"
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 150 \
            'https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-linux-cli.tar.gz' \
            -o "$RUNNER_TEMP/vgmstream-linux-cli.tar.gz"
          echo "Downloaded archive:"
          sha256sum "$RUNNER_TEMP/vgmstream-linux-cli.tar.gz"
          tar -tzf "$RUNNER_TEMP/vgmstream-linux-cli.tar.gz" | head -30
          tar -xzf "$RUNNER_TEMP/vgmstream-linux-cli.tar.gz" -C "$RUNNER_TEMP/vgmstream"
          cli="$(find "$RUNNER_TEMP/vgmstream" -type f -name 'vgmstream-cli' -print -quit)"
          if [[ -z "$cli" ]]; then echo "::error::vgmstream-cli executable absent from official release"; exit 1; fi
          chmod +x "$cli"
          "$cli" -h > "$RUNNER_TEMP/vgmstream-help.txt" 2>&1 || true
          grep -Eiq '(vgmstream|Usage:)' "$RUNNER_TEMP/vgmstream-help.txt"
          python audio/tools/vgmstream_real_decoder_selftest_v24.py --decoder "$cli" | tee "$RUNNER_TEMP/v24-decoder-selftest.json"
          python audio/tools/ea_schl_platform_pcm_selftest_v26.py --decoder "$cli" | tee "$RUNNER_TEMP/v26-ea-schl.json"
          python audio/tools/ea_mt10_synthetic_silence_v27.py --decoder "$cli" | tee "$RUNNER_TEMP/v27-ea-mt10.json"
          python audio/tools/ea_mt10_synthetic_silence_v27.py --decoder "$cli" --pulse | tee "$RUNNER_TEMP/v27-ea-mt10-pulse.json"
          python audio/tools/undercover_mt10_private_bridge_v28.py --self-test --decoder "$cli" | tee "$RUNNER_TEMP/v28-private-bridge-synthetic.json"
          {
            echo '### vgmstream CLI synthetic decode integration'
            echo ''
            echo 'Official nightly Linux binary downloaded. V24 PCM16LE/TXTH metadata + WAV round-trip self-test passed.'
            echo ''
            echo 'Archive SHA-256:'
            sha256sum "$RUNNER_TEMP/vgmstream-linux-cli.tar.gz"
            echo 'This job tests only the executable. No game recordings are present.'
          } >> "$GITHUB_STEP_SUMMARY"
