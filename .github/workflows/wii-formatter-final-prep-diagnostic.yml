name: Wii Formatter 116 Native Prep Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-final-prep-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-final-prep-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 -m py_compile research/native_recomp/prepare_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_next_report_byte_fixture.py
  owner-diagnostic:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require pinned original 115 native job and authenticated 116 geometry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          def fetch(path):
              raw=subprocess.check_output(
                  ['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],
                  stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:
              run=fetch('actions/runs/45970231112')
              job=fetch('actions/jobs/140419657940')
              predecessor=(run.get('id')==45970231112 and
                  run.get('head_sha')=='348d9f80141dc00fcfaf0e4c2ebd3fc1d250ce92' and
                  run.get('head_branch')=='research/wii-native-recomp-preflight' and
                  run.get('path')=='.github/workflows/wii-formatter-caller-ancestor-retry.yml' and
                  run.get('status')=='completed' and run.get('run_attempt')==1 and
                  job.get('id')==140419657940 and job.get('run_id')==45970231112 and
                  job.get('name')=='owner-caller-stack-move' and
                  job.get('status')=='completed' and job.get('conclusion')=='success' and
                  job.get('run_attempt')==1)
              reqs=(
                  Requirement(45968115256,'0b469e64994aa98caa2134d09bb1001187e834ea',
                              '.github/workflows/wii-formatter-caller-after-stack-move-audit.yml','owner-geometry'),
                  Requirement(45968552391,'5a7600edf3da65986e5635926164f960b98e0ffa',
                              '.github/workflows/wii-formatter-caller-after-stack-direct-audit.yml','owner-geometry'),
              )
              ok=predecessor and all(verify(fetch,r) for r in reqs)
          except (OSError,ValueError,TypeError,subprocess.SubprocessError):
              ok=False
          if not ok:raise SystemExit('FORMATTER_FINAL_PREP_GATE verified=0')
          print('FORMATTER_FINAL_PREP_GATE verified=1 original_115=1 geometry=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Retry original 116 with bounded private preparation phase diagnostics
        env:
          UNDERCOVER_EXPECTED_CALLER_INTEGER_COUNT: '2'
          UNDERCOVER_EXPECTED_CALLER_POST_INTEGER_COUNT: '1'
          UNDERCOVER_EXPECTED_CALLER_MIXED_INTEGERS: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_TAKEN: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_FALLTHROUGH: '1'
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw1352"
          git -C "$RUNNER_TEMP/nw1352" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw1352" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw1352" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v1256_native_scheduler_postack.sh "$RUNNER_TEMP/nw1352" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --formatter-nested-caller-final-integer
      - name: Clean private original inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw1352"
