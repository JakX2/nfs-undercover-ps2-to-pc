name: Wii Formatter Isolated 116 Contract Preflight
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-final-integer-isolated-prep.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-116-isolated-prep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 -m py_compile research/native_recomp/prepare_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_nested_log.py
  owner-contract:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require exact successful 115 native job without requiring failed 116
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          def fetch(endpoint):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{endpoint}"],timeout=30)
              return json.loads(raw)
          run=fetch('actions/runs/45970231112')
          job=fetch('actions/jobs/140419657940')
          ok=(run.get('id')==45970231112 and
              run.get('head_sha')=='348d9f80141dc00fcfaf0e4c2ebd3fc1d250ce92' and
              run.get('head_branch')=='research/wii-native-recomp-preflight' and
              run.get('run_attempt')==1 and
              job.get('id')==140419657940 and
              job.get('run_id')==45970231112 and
              job.get('run_attempt')==1 and
              job.get('name')=='owner-caller-stack-move' and
              job.get('status')=='completed' and
              job.get('conclusion')=='success')
          if not ok:raise SystemExit('FORMATTER_116_ISOLATED_GATE verified=0')
          print('FORMATTER_116_ISOLATED_GATE verified=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Build only the original 116 final-integer contract without a callee root
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/prepare_formatter_nested_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --caller-final-integer
      - name: Clean private original inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
