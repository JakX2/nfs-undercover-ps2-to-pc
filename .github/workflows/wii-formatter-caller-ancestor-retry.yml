                  and previous.get('head_branch')=='research/wii-native-recomp-preflight'
                  and previous.get('path')=='.github/workflows/wii-formatter-caller-mixed-owner.yml'
                  and previous.get('status')=='completed' and previous.get('run_attempt')==1
                  and prior.get('id')==140401936638 and prior.get('run_id')==45967653602
