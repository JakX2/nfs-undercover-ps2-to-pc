name: Wii V108 Authenticated SC Literal Restoration
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v108*'
      - '.github/workflows/wii-v108-sc-restore.yml'
permissions:
  contents: read
concurrency:
  group: wii-v108-restore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-literal-v108:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Prepare pinned original-free NWii runtime and cache traces
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_perf_patch_guards_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/verify_perf_combo_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_hid4_continuous_patch_v30.py"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_continuous_patch_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_trace_guards_v44.py"
          python3 "$here/apply_jump_table_v58.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_jump_table_patch_v58.py"
          python3 "$here/apply_dcbi_v60.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hollywood_mmio_v62.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_native_lowmem_v63.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_bat_registers_v65.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbz_v67.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_exception_sprg.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_mtmsr_resume_v74.py" "$RUNNER_TEMP/nwii"
          echo 'PASS: V72 focused runtime prerequisites prepared and original-free source guards passed'
      - name: Execute authenticated owner SC literal restoration probe
        run: |
          set -euo pipefail
          umask 077
          bash research/native_recomp/run_v108_sc_literal_restore.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/sc108.log" 2>&1 || true
          grep -E '^V104_STAGE (runtime_cache_trace_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled)$' "$RUNNER_TEMP/sc108.log" || true
          grep -E '^V77_(HARNESS_LINE|GENERATOR_LINE) [0-9]+$|^V77_COMPILE_UNIT (harness|generated|loader|generator)$' "$RUNNER_TEMP/sc108.log" || true
          grep -Fx 'V104_STAGE native_compiled' "$RUNNER_TEMP/sc108.log"
          grep -Fx 'V107_SC_SOURCE mapped=1 empty=1 original_literal=1' "$RUNNER_TEMP/sc108.log"
          grep -Fx 'V108_SC_GATE owner=1 empty=1 span=1' "$RUNNER_TEMP/sc108.log"
          grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}          # Decode only an exact public test-harness assertion label.
          # Original executable data and native private diagnostics stay local.
          code="$(grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc108.log" | tail -n 1 | cut -d= -f2 || true)"
          if [[ "$code" =~ ^[0-9]{3}$ ]]; then
            python3 research/native_recomp/diagnose_sc_literal_restore_v108.py "$((10#$code))"
          fi
          grep -Fx 'V108_SC_RESTORE owner=1 empty_before=1 exact=1' "$RUNNER_TEMP/sc108.log"
          # Public callsite IDs only, never guest filenames, code, or buffers.
          grep -E '^V104_FALLTHROUGH pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8} phase=[0-9]{1,2} cache=[0-9]{1,2}$|^V104_FAIL_HOOK pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$|^V104_DEPENDENCY pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$|^V98_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$' "$RUNNER_TEMP/sc108.log" | sort -u || true
          # The subsequent V104 submit may still fail; do not claim boot.
          grep -E '^V103_SC_DIAG prior_nonempty=[01] path_ptr=[01] copy_span=[01] pointer_equal=[01] arg_empty=[01] copy_equal=[01]$|^V104_ASYNC_SUBMIT route=[01] request=[01] mode=[01] path=[01] abi=[01] prior=[01]$' "$RUNNER_TEMP/sc108.log" | sort -u || true
          echo 'PASS: original SC initialized literal restored at original guest input'
      - name: Remove private owner and generated code
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals" "$RUNNER_TEMP/sc108.log"
 "$RUNNER_TEMP/sc108.log" || true
          # Report only original function/return addresses from source-owned
          # bounded hooks. Never print private guest data or raw native logs.
          grep -E '^V104_FAIL_HOOK pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$|^V104_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$|^V104_FALLTHROUGH pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5} phase=[0-2] cache=[0-2]
          # Decode only an exact public test-harness assertion label.
          # Original executable data and native private diagnostics stay local.
          code="$(grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc108.log" | tail -n 1 | cut -d= -f2 || true)"
          if [[ "$code" =~ ^[0-9]{3}$ ]]; then
