name: Wii V1229 Post-ACK IPC Join
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1229*'
      - '.github/workflows/wii-v1229-post-ack-ipc.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate cold admission and exact direct call timing
        run: |
          set -euo pipefail
          for test in test_ipc_entry_join_v930 test_wii_ipc_client_witness_v623 test_post_ack_ipc_join_v1229; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done
