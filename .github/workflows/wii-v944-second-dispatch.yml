name: Wii V944 Second SI Dispatcher Witness
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v944*'
      - 'research/native_recomp/wii_external_return_v706.h'
      - 'research/native_recomp/wii_si_dispatch_v667.h'
      - '.github/workflows/wii-v944-second-dispatch.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for n in second_si_dispatch_v944 si_dispatch_v667 external_return_v706; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/test_$n.cpp" -o "$RUNNER_TEMP/$n"
            "$RUNNER_TEMP/$n"
          done
