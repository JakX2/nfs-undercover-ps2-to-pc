name: Wii V710 Native Post-ACK OS Leaf Control
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v710*'
      - 'research/native_recomp/*v713*'
      - 'research/native_recomp/*v717*'
      - 'research/native_recomp/*v718*'
      - '.github/workflows/wii-v710-os-leaves.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile generated PPC post-ACK ordered leaf returns
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw710"
          git -C "$RUNNER_TEMP/nw710" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw710" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw710" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_os_leaves_v710.sh "$RUNNER_TEMP/nw710"
