name: Wii Native Installed SC Overlay
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v561*'
      - '.github/workflows/wii-v561-native-sc-overlay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned NWiiRecomp and run synthetic SC overlay
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw561"
          git -C "$RUNNER_TEMP/nw561" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw561" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw561" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v561_sc_overlay.sh "$RUNNER_TEMP/nw561"
  owner-geometry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner original
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Translate authenticated original SC vector and run independent caller
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw561"
          git -C "$RUNNER_TEMP/nw561" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw561" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw561" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v561_sc_overlay.sh "$RUNNER_TEMP/nw561" "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Clean private owner files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
