name: Wii V1409 Async Submit Queue Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_ioctl_submit_queue_v1409.h'
      - 'research/native_recomp/test_ioctl_submit_queue_v1409.cpp'
      - '.github/workflows/wii-v1409-submit-queue.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cd research/native_recomp
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_ioctl_submit_queue_v1409.cpp -o /tmp/v1409
          /tmp/v1409
