name: Wii V1307 Cooperative Fixture Geometry
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1307*'
      - '.github/workflows/wii-v1307-cooperative-fixture.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded cooperative fixture expansion
        run: python3 -m unittest discover -s research/native_recomp -p test_v1307_cooperative_fixture.py -v
