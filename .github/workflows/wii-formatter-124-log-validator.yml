name: Wii Formatter 124 Exact Native Log Validator
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-124-log-validator.yml'
      - 'research/native_recomp/validate_formatter_nested_log.py'
      - 'research/native_recomp/test_formatter_report_third_immediate_log.py'
      - 'research/native_recomp/test_formatter_report_second_immediate_log.py'
      - 'research/native_recomp/test_formatter_report_signext_log.py'
permissions:
  contents: read
concurrency:
  group: wii-formatter-124-validator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/validate_formatter_nested_log.py research/native_recomp/test_formatter_report_third_immediate_log.py
          python3 research/native_recomp/test_formatter_report_third_immediate_log.py
          python3 research/native_recomp/test_formatter_report_second_immediate_log.py
          python3 research/native_recomp/test_formatter_report_signext_log.py
          python3 research/native_recomp/test_formatter_nested_log.py
