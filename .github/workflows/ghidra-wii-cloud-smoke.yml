name: Cloud Ghidra Wii loader smoke (synthetic only)

on:
  workflow_dispatch:
  push:
    branches:
      - research/wii-native-recomp-preflight
    paths:
      - '.github/workflows/ghidra-wii-cloud-smoke.yml'
      - 'research/native_recomp/cloud_ghidra/**'
  pull_request:
    paths:
      - '.github/workflows/ghidra-wii-cloud-smoke.yml'
      - 'research/native_recomp/cloud_ghidra/**'

permissions:
  contents: read

concurrency:
  group: ghidra-source-only-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Ghidra headless + GameCube/Wii loader on original-free DOL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHIDRA_MAXMEM: 2G
      GHIDRA_HEADLESS_MAXMEM: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare offline-verifiable Ghidra and Wii loader
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip' \
            -o ghidra.zip
          echo '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  ghidra.zip' | sha256sum -c -
          unzip -q ghidra.zip
          test -x "$RUNNER_TEMP/ghidra_12.1.3_PUBLIC/support/analyzeHeadless"

          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/Cuyler36/Ghidra-GameCube-Loader/releases/download/1.3.1/GameCubeLoader-1.3.0-921504c-Ghidra_12.1.zip' \
            -o gamecube-loader.zip
          echo '9892f28fc1e7f19bb3fcec7cfb4ad2ab7504503b571d93de8b142a6f7bec8ed0  gamecube-loader.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra_12.1.3_PUBLIC/Ghidra/Extensions/Ghidra"
          unzip -q gamecube-loader.zip -d "$RUNNER_TEMP/ghidra_12.1.3_PUBLIC/Ghidra/Extensions/Ghidra"
          test "$(find "$RUNNER_TEMP/ghidra_12.1.3_PUBLIC/Ghidra/Extensions" -name ppc_gekko_broadway.ldefs | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/ghidra_12.1.3_PUBLIC/Ghidra/Extensions" -name extension.properties | wc -l)" -ge 1
          echo 'PASS: pinned Ghidra and bundled Wii processor definitions installed in ephemeral cloud'

      - name: Create independent synthetic DOL and verify headless function index
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 research/native_recomp/cloud_ghidra/make_synthetic_dol.py "$RUNNER_TEMP/synthetic_wii.dol"
          mkdir -p "$RUNNER_TEMP/ghidra-projects"
          "$RUNNER_TEMP/ghidra_12.1.3_PUBLIC/support/analyzeHeadless" \
            "$RUNNER_TEMP/ghidra-projects" UndercoverWiiSynthetic \
            -import "$RUNNER_TEMP/synthetic_wii.dol" \
            -loader GameCubeLoader \
            -loader-autoloadMaps false \
            -scriptPath "$GITHUB_WORKSPACE/research/native_recomp/cloud_ghidra" \
            -postScript ExportWiiFunctionManifest.java "$RUNNER_TEMP/functions.json" synthetic \
            -analysisTimeoutPerFile 180 \
            -deleteProject > "$RUNNER_TEMP/ghidra-smoke.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/ghidra-smoke.log"
              exit 1
            }
          test -s "$RUNNER_TEMP/functions.json" || {
            tail -100 "$RUNNER_TEMP/ghidra-smoke.log"
            echo 'Headless exporter produced no index' >&2
            exit 1
          }
          python3 research/native_recomp/cloud_ghidra/check_manifest.py "$RUNNER_TEMP/functions.json"
          echo 'PASS: synthetic Wii DOL decoded and function-call edges verified'
          # Source-only workflow: never upload a DOL, project, output or action artifact.
