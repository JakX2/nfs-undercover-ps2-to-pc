name: Wii Native Cold IPC Control
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v617*'
      - 'research/native_recomp/wii_native_ios_binding.h'
      - 'research/native_recomp/wii_native_ios_transport.h'
      - 'research/native_recomp/wii_ios_bus.h'
      - '.github/workflows/wii-v617-ipc-control.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify cold IPC proof against actual transport and prior asynchronous controls
        run: |
          set -euo pipefail
          for src in test_wii_cold_ipc_control_v617 test_wii_native_ios_binding test_wii_native_ios_transport test_wii_ios_bus; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$src.cpp" -o "$RUNNER_TEMP/$src"
            "$RUNNER_TEMP/$src"
          done
