name: Wii V270 Original Wii SYSCONF Store Guards
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v270*'
      - '.github/workflows/wii-v270-sc-guards.yml'
permissions:
  contents: read
concurrency:
  group: wii-v270-sc-guards-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v270:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V270 original-free conditional store guarding
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v270_sc_writer_guards.py research/native_recomp/test_v270_sc_writer_guards.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v270_sc_writer_guards.py' -v
          echo 'PASS: original-free V270 guarded-store analysis'
  owner-original-v270:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V270 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Inspect original Wii SC helper store guards privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v270_sc_writer_guards.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v270.log" 2>&1 || {
            grep -E '^V270_GUARD_AUDIT verified=0$' "$RUNNER_TEMP/v270.log" | sort -u || true
            echo 'V270 direct store guard scan not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V270_GUARD_AUDIT verified=1' "$RUNNER_TEMP/v270.log"
          grep -E '^V270_SC_SITES reads=1 writes=2 read_offset=[0-9]{1,4} store1_offset=[0-9]{1,4} store2_offset=[0-9]{1,4}$' "$RUNNER_TEMP/v270.log"
          grep -E '^V270_SC_STORE rank=[12] offset=[0-9]{1,4} rs=([0-9]|[1-2][0-9]|3[01]) prev_kind=[0-3] prev_const=(-1|[0-4]) skip_cond=[0-9]{1,3} skip_direct=[0-9]{1,3}$' "$RUNNER_TEMP/v270.log"
          echo 'PASS: V270 original Wii guarded status store classification'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v270.log"
