name: Wii V128 Original Next Function Audit
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v128*'
      - '.github/workflows/wii-v128-next-function-audit.yml'
permissions:
  contents: read
concurrency:
  group: wii-v128-next-function-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-v128-next-audit:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'Owner Wii staging failed after three bounded attempts' >&2
            exit 1
          fi
      - name: Classify authenticated next-function span
        run: |
          set -euo pipefail
          umask 077
          owner="$RUNNER_TEMP/originals/NfsMWRelease.dol"
          python3 research/native_recomp/make_v125_canonical_fixture.py "$owner" \
            "$RUNNER_TEMP/v128-canonical.dol" > "$RUNNER_TEMP/v128-builder-private.log" 2>&1 || {
              echo 'V128_V125_CANONICAL ok=0';exit 1
            }
          python3 research/native_recomp/restore_v127_osinit_tail.py \
            "$RUNNER_TEMP/v128-canonical.dol" "$owner" "$RUNNER_TEMP/v128-v127.dol" \
            > "$RUNNER_TEMP/v128-restorer-private.log" 2>&1 || {
              echo 'V128_V127_RESTORE ok=0';exit 1
            }
          echo 'V128_V127_RESTORE ok=1'
          python3 research/native_recomp/diagnose_v128_next_function.py \
            "$owner" "$RUNNER_TEMP/v128-v127.dol"
      - name: Remove private owner and fixture
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v128-canonical.dol" \
            "$RUNNER_TEMP/v128-v127.dol" "$RUNNER_TEMP/v128-builder-private.log" \
            "$RUNNER_TEMP/v128-restorer-private.log"
