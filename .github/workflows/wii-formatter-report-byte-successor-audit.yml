name: Wii Formatter Next Callee Integer Provenance Audit
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/audit_formatter_report_byte_successor.py'
      - '.github/workflows/wii-formatter-report-byte-successor-audit.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-next-integer-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_formatter_report_byte_successor.py
          python3 research/native_recomp/audit_formatter_report_byte_successor.py --self-test
          python3 research/native_recomp/prepare_formatter_next_entry_report_byte_contract.py --self-test
          python3 research/native_recomp/test_formatter_next_report_byte_fixture.py
  owner-provenance:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require authenticated private byte, not native execution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          req=Requirement(
              45970804310,'aefa484d8fcd55c26db75fd639aa9df3d7384250',
              '.github/workflows/wii-formatter-next-entry-report-byte-contract.yml',
              'owner-geometry')
          def fetch(endpoint):
              raw=subprocess.check_output(
                  ['gh','api',f"repos/{os.environ['GH_REPO']}/{endpoint}"],
                  stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:ok=verify(fetch,req)
          except (OSError,ValueError,TypeError,KeyError,subprocess.SubprocessError):ok=False
          if not ok:raise SystemExit('FORMATTER_SUCCESSOR_GATE verified=0')
          print('FORMATTER_SUCCESSOR_GATE verified=1 authenticated_118=1 native_118=0')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage private originals for aggregate-only successor classification
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Classify the next original integer without execution or raw operand logging
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_formatter_report_byte_successor.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
