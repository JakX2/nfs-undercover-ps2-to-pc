name: Wii Native Cache Operation Composition
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v456*'
      - '.github/workflows/wii-v456-cache-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test source patch and shell syntax
        run: |
          python3 -m unittest discover -s research/native_recomp -p test_v456_cache_order.py -v
          bash -n research/native_recomp/run_v456_cache_order.sh
      - name: Fetch pinned compiler
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw456"
          git -C "$RUNNER_TEMP/nw456" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw456" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw456" checkout -q --detach FETCH_HEAD
      - name: Compose startup and cache patches then execute native tests
        run: bash research/native_recomp/run_v456_cache_order.sh "$RUNNER_TEMP/nw456"
