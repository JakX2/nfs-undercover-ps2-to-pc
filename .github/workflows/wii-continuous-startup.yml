  fast-owner-startup:
    # Independent source-only and private checkpoints run concurrently for faster feedback.
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned Wii originals
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Pin independent NWiiRecomp source
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          # Patch V29 performance SPRs before V18 HID0/HID2 and V20 L2CR
          # modify their source-switch anchors. Do not reorder these.
          python3 research/native_recomp/apply_nonsplit_dispatch_v15.py "$RUNNER_TEMP/nwii"
          python3 research/native_recomp/apply_perf_sprs_v29.py "$RUNNER_TEMP/nwii"
          python3 research/native_recomp/test_perf_patch_guards_v29.py "$RUNNER_TEMP/nwii"
          # Recreate the V26 runtime prerequisites without compiling V26-V37.
          python3 research/native_recomp/apply_hid_state_v18.py "$RUNNER_TEMP/nwii"
          python3 research/native_recomp/apply_fpscr_v19.py "$RUNNER_TEMP/nwii"
          python3 research/native_recomp/apply_l2cr_v20.py "$RUNNER_TEMP/nwii"
          python3 research/native_recomp/apply_syscall_pc_v26.py "$RUNNER_TEMP/nwii"
          python3 research/native_recomp/verify_perf_combo_v29.py "$RUNNER_TEMP/nwii"
      - name: Verify latest original Wii continuous-start checkpoint (V38)
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --report "$RUNNER_TEMP/frontier-v38.json" \
            --diagnostic-runner V38 \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x80520DA4 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v38_continuous_vectorcopy.sh \
              "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/frontier-private.log" 2>&1 || {
              # Only allowlisted independently-authored checkpoint labels are printed.
              grep -E '^BOOT_DIAGNOSTIC stage=V38\.(v29_runtime_verified|hid4_runtime_verified|fixture_generated|geometry_verified|negative_guards_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/frontier-private.log" || true
              grep -E '^BOOT_DIAGNOSTIC assertion_id=V38\.[0-9]{3}$' "$RUNNER_TEMP/frontier-private.log" || true
              echo 'Original V38 native frontier check failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/frontier-v38.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert result['schema'] == 'undercover-boot-progress-v1'
          assert result['lane'] == 'continuous-start'
          assert result['status'] == 'passed_instrumented'
          assert result['observed_entry'] == 0x8000403C
          assert result['observed_pc'] == 0x80520DA4
          assert result['stage'] == 38 and result['pass_markers'] >= 1
          print('PASS: owner-original continuous Wii startup V38 checkpoint verified')
          PY
      - name: Verify original Wii continuous cache-maintenance V39
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/frontier-v38.json" \
            --require-progress --report "$RUNNER_TEMP/frontier-v39.json" \
            --diagnostic-runner V39 \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x80520DB8 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v39_continuous_cache.sh \
              "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/v39-private.log" 2>&1 || {
              # Allowlisted milestone labels only; owner PPC code and logs withheld.
              grep -E '^BOOT_DIAGNOSTIC stage=V39\.(v29_runtime_verified|hid4_runtime_verified|cache_patch_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/v39-private.log" || true
              grep -E '^BOOT_DIAGNOSTIC stage=V39\.fixture_(collision|stop_collision|section|source|inherited|other)$' "$RUNNER_TEMP/v39-private.log" || true
              grep -E '^BOOT_RESULT status=(failed|setup_error) .* reason=(runner_failed|no_native_pass_marker|expected_stop_not_observed|no_guest_checkpoint|no_verified_stage_advance|stop_pc_unchanged|ValueError|OSError)$' "$RUNNER_TEMP/v39-private.log" || true
              echo 'V39 continuous Wii cache native test failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/frontier-v39.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert r['status']=='advanced' and r['lane']=='continuous-start'
          assert r['observed_entry']==0x8000403C and r['observed_pc']==0x80520DB8
          assert r['stage']==39 and r['pass_markers']>=1
          print('PASS: original Wii continuous __start executed both native cache helpers to 0x80520DB8')
          PY
      - name: Remove private originals and temporary translations
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals" \
            "$RUNNER_TEMP/frontier-private.log" "$RUNNER_TEMP/frontier-v38.json" \
            "$RUNNER_TEMP/v39-private.log" "$RUNNER_TEMP/frontier-v39.json"
