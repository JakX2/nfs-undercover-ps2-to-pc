name: Wii Continuous Startup Checks
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/**'
      - '.github/workflows/wii-continuous-startup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wii-continuous-startup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check source-only checkpoint validation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_boot_progress.py -v
          bash -n research/native_recomp/run_v26_recovered_tests.sh
          bash -n research/native_recomp/run_v27_continuous_interrupt.sh
          bash -n research/native_recomp/run_v28_continuous_execparams.sh
          bash -n research/native_recomp/run_v29_continuous_perfsprs.sh
          bash -n research/native_recomp/run_v30_continuous_hid4.sh
          bash -n research/native_recomp/run_v31_continuous_lowmem.sh
          bash -n research/native_recomp/run_v32_continuous_arena.sh
          bash -n research/native_recomp/run_v33_continuous_mem2.sh
          bash -n research/native_recomp/run_v34_continuous_ipc.sh
          bash -n research/native_recomp/run_v35_continuous_exception.sh
          python3 -m py_compile research/native_recomp/make_start_to_exception_v35.py research/native_recomp/test_v35_continuous_exception_geometry.py
          python3 -m py_compile research/native_recomp/make_start_to_ipc_v34.py research/native_recomp/test_v34_continuous_ipc_geometry.py
          python3 -m py_compile research/native_recomp/make_start_to_mem2_v33.py research/native_recomp/test_v33_continuous_mem2_geometry.py
          python3 -m py_compile research/native_recomp/make_start_to_arena_v32.py research/native_recomp/test_v32_continuous_geometry.py
          python3 -m py_compile research/native_recomp/make_start_to_lowmem_v31.py research/native_recomp/test_v31_continuous_geometry.py
          python3 -m py_compile research/native_recomp/make_start_to_hid4_v30.py research/native_recomp/test_v30_continuous_geometry.py research/native_recomp/apply_hid4_continuous_v30.py
          python3 research/native_recomp/test_hid4_continuous_patch_v30.py
          python3 -m py_compile research/native_recomp/make_start_to_perfsprs_v29.py research/native_recomp/test_v29_perfsprs_geometry.py research/native_recomp/verify_perf_combo_v29.py
          python3 -m py_compile research/native_recomp/make_start_to_execparams_v28.py research/native_recomp/test_v28_execparams_geometry.py
          python3 -m py_compile research/native_recomp/make_start_to_interrupt_v27.py research/native_recomp/test_v27_interrupt_geometry.py
          python3 research/native_recomp/test_syscall_pc_v26.py
          python3 -m unittest discover -s research/native_recomp -p test_probe_next_osinit_v33.py -v
      - name: Get exact NWiiRecomp source
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
      - name: Compile and run recovered synthetic V26 time/interrupt startup
        run: |
          set -euo pipefail
          bash research/native_recomp/run_v26_recovered_tests.sh "$RUNNER_TEMP/nwii" > "$RUNNER_TEMP/v25-synthetic.log" 2>&1 || {
            tail -65 "$RUNNER_TEMP/v25-synthetic.log"
            exit 1
          }
          grep -q '^PASS:' "$RUNNER_TEMP/v25-synthetic.log"
          echo 'PASS: independent synthetic V26 native AOT executed; original __start remains unverified here'
  owner-startup:
    needs: synthetic-startup
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned Wii originals
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Pin independent NWiiRecomp source
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          # Patch V29 performance SPRs before V18 HID0/HID2 and V20 L2CR
          # modify their source-switch anchors. Do not reorder these.
          python3 research/native_recomp/apply_nonsplit_dispatch_v15.py "$RUNNER_TEMP/nwii"
          python3 research/native_recomp/apply_perf_sprs_v29.py "$RUNNER_TEMP/nwii"
          python3 research/native_recomp/test_perf_patch_guards_v29.py "$RUNNER_TEMP/nwii"
      - name: Execute recovered original V26 __start -> time/interrupt native continuation
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --report "$RUNNER_TEMP/continuous-checkpoint.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x805206B4 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v26_recovered_tests.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private.log" 2>&1 || {
              # Only classify fixed, original-free stage messages. Never print
              # arbitrary owner logs, private opcode bytes, paths or symbols.
              if grep -q 'PASS: V26 recovered bounded startup fixture created privately' "$RUNNER_TEMP/private.log"; then
                echo 'V26_STAGE fixture_generated'
              else
                echo 'V26_STAGE before_fixture_generation'
              fi
              if grep -q 'PASS: recovered V26 fixture exact private PowerPC span and stop geometry' "$RUNNER_TEMP/private.log"; then
                echo 'V26_STAGE fixture_verified'
              fi
              if grep -q 'Recovered V26 native compile failed: owner' "$RUNNER_TEMP/private.log"; then
                echo 'V26_STAGE native_compilation_failed'
              fi
              if grep -q 'Recovered V26 native test failed: owner' "$RUNNER_TEMP/private.log"; then
                echo 'V26_STAGE native_assertion_failed'
              fi
              if grep -q 'Recovered V26 generator failed: owner' "$RUNNER_TEMP/private.log"; then
                echo 'V26_STAGE dispatch_generator_failed'
              fi
              grep '^V26_SAFE_DIAGNOSTIC ' "$RUNNER_TEMP/private.log" || true
              if grep -q 'Recovered V26 generator failed: owner' "$RUNNER_TEMP/private.log"; then
                echo 'V26_SAFE_DIAGNOSTIC private generator validation failed'
              fi
              echo 'Recovered original V26 startup native test failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-checkpoint.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start'
          assert r['status']=='passed_instrumented'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x805206B4 and r['stage']==26
          assert r['pass_markers']>=1
          print('PASS: authentic recovered V26 __start checkpoint 0x805206B4 measured by native syscall callback')
          PY
      - name: Verify genuine post-V26 interrupt BL from continuous original __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-checkpoint.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v27.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x805206BC \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v27_continuous_interrupt.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v27.log" 2>&1 || {
              echo 'V27 owner-original continuous-start regression failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v27.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x805206BC and r['stage']==27
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start advanced past V26 B4 interrupt call to test-only Bc stop')
          PY
      - name: Verify original __OSGetExecParams through continuous __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-v27.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v28.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x805206C0 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v28_continuous_execparams.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v28.log" 2>&1 || {
              echo 'V28 owner-original continuous-start execparams regression failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v28.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x805206C0 and r['stage']==28
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start executed __OSGetExecParams and reached 0x805206C0')
          PY
      - name: Verify six original performance SPR helper calls from continuous __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-v28.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v29.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x805206F0 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v29_continuous_perfsprs.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v29.log" 2>&1 || {
              # The V29 runner emits only allowlisted source-only labels.
              # Do not expose private DOL, generated C++, or owner test logs.
              grep -E '^V29_STAGE (before_perf_patch|perf_patch_present|compatible_runtime|private_fixture_created|private_geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/private-v29.log" || true
              echo 'V29 continuous owner-original MMCR/PMC native test failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v29.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x805206F0 and r['stage']==29
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start advanced through six MMCR/PMC writes to F0 test stop')
          PY
      - name: Verify original HID4 speculation and FPSCR through continuous __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-v29.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v30.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x80520700 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v30_continuous_hid4.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v30.log" 2>&1 || {
              # Never upload original code, PPC bytes or translated C++.
              # Only these fixed stage labels are safe to report.
              grep -E '^V30_STAGE (v29_runtime_verified|hid4_patch_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/private-v30.log" || true
              echo 'V30 continuous owner-original HID4/FP regression failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v30.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x80520700 and r['stage']==30
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start advanced through HID4/speculation/non-IEEE FP setup to 0x80520700')
          PY
      - name: Verify original Wii low-memory boot handoff through continuous __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-v30.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v31.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x80520778 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v31_continuous_lowmem.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v31.log" 2>&1 || {
              grep -E '^V31_STAGE (v29_runtime_verified|hid4_runtime_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/private-v31.log" || true
              echo 'V31 owner-original continuous boot-info regression failed; original logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v31.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x80520778 and r['stage']==31
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start advanced through low-memory boot-info to 0x80520778')
          PY
      - name: Verify original Wii MEM1 arena setters from continuous __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-v31.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v32.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x80520818 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v32_continuous_arena.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v32.log" 2>&1 || {
              grep -E '^V32_STAGE (v29_runtime_verified|hid4_runtime_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/private-v32.log" || true
              echo 'V32 owner-original continuous MEM1 arena regression failed; original logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v32.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x80520818 and r['stage']==32
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start advanced through MEM1 setters to 0x80520818')
          PY
      - name: Verify original Wii MEM2 arena setters from continuous __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-v32.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v33.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x805208A4 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v33_continuous_mem2.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v33.log" 2>&1 || {
              # Emit allowlisted state transitions only; no game binaries,
              # raw disassembly, native translations or private logs.
              grep -E '^V33_STAGE (v29_runtime_verified|hid4_runtime_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/private-v33.log" || true
              echo 'V33 owner-original continuous MEM2 arena test failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v33.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x805208A4 and r['stage']==33
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start advanced through MEM2 setters to 0x805208A4')
          PY
      - name: Verify original Wii IPC buffer pointer initializer from continuous __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-v33.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v34.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x805208A8 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v34_continuous_ipc.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v34.log" 2>&1 || {
              # Never print owner PPC bytes, generated C++, or raw private logs.
              grep -E '^V34_STAGE (v29_runtime_verified|hid4_runtime_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/private-v34.log" || true
              echo 'V34 original Wii continuous IPC-buffer assertion failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v34.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x805208A8 and r['stage']==34
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start ran authentic __OSInitIPCBuffer to 0x805208A8')
          PY
      - name: Verify bounded original Wii exception fast-path from continuous __start
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane continuous-start --baseline "$RUNNER_TEMP/continuous-v34.json" \
            --require-progress --report "$RUNNER_TEMP/continuous-v35.json" \
            --timeout 1400 --expected-entry 0x8000403C --expected-pc 0x80520CA8 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_v35_continuous_exception.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/private-v35.log" 2>&1 || {
              # Fixed state labels only; never emit original Wii PPC, translated
              # game C++, owner private logs, memory or binary files.
              grep -E '^V35_STAGE (v29_runtime_verified|hid4_runtime_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/private-v35.log" || true
              echo 'V35 owner-original bounded exception fast-path test failed; private logs withheld' >&2
              exit 1
            }
          python3 - "$RUNNER_TEMP/continuous-v35.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='continuous-start' and r['status']=='advanced'
          assert r['observed_entry']==0x8000403C
          assert r['observed_pc']==0x80520CA8 and r['stage']==35
          assert r['pass_markers']>=1
          print('PASS: original Wii continuous __start reached bounded OSExceptionInit prologue at 0x80520CA8')
          PY
      - name: Classify next original Wii OSInit control flow without publishing proprietary code
        run: |
          set -euo pipefail
          python3 research/native_recomp/probe_next_osinit_v33.py \
            "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Remove owner executable, private translations and logs
        if: always()
        run: |
