name: V60 candidate cohort comparison (synthetic only)
on:
  push:
    paths:
      - 'research/v60/**'
      - 'research/v58/v58_stream_scene_bridge.py'
      - '.github/workflows/v60-asset-free-tests.yml'
  pull_request:
    paths:
      - 'research/v60/**'
      - 'research/v58/v58_stream_scene_bridge.py'
      - '.github/workflows/v60-asset-free-tests.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V60 synthetic cohort/falsification tests
        run: python -m unittest discover -s research/v60 -p 'test_v60.py' -v
      - name: V58 existing archive tests
        run: python -m unittest discover -s research/v58 -p 'test_v58.py' -v
