name: Wii V786 Original Alarm Return Full Image
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v786*'
      - 'research/native_recomp/*v789*'
      - '.github/workflows/wii-v786-alarm-return.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the pending source and exception route
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v672_si_ack_route.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v668_si_ack.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v675_si_ack_integration.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v681_si_helper.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v689_si_second.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v713_leaf_coverage.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v718_postack_diagnostics.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_postack_branch_poll_v719.cpp -o "$RUNNER_TEMP/v719"
          "$RUNNER_TEMP/v719"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_si_first_helper_v681.cpp -o "$RUNNER_TEMP/v681"
          "$RUNNER_TEMP/v681"
          python3 -m unittest discover -s research/native_recomp -p test_v726_handler_return.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v742_handler_time.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v747_time_suffix.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v768_transfer_prefix.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v777_transfer_return.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v778_transfer_suffix.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_transfer_slot_v778.cpp -o "$RUNNER_TEMP/v778"
          "$RUNNER_TEMP/v778"
          python3 -m unittest discover -s research/native_recomp -p test_v786_alarm_return.py -v
          bash -n research/native_recomp/run_v572_full_sc_translation.sh
          bash -n research/native_recomp/run_v575_dsp_sc_launch.sh
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_si_completion_ack_v668.cpp -o "$RUNNER_TEMP/v672"
          "$RUNNER_TEMP/v672"
  owner-preflight:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Compose complete image with first native SI acknowledgement
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw672"
          git -C "$RUNNER_TEMP/nw672" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw672" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw672" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v572_full_sc_translation.sh "$RUNNER_TEMP/nw672" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --prepare-si-alarm
      - name: Clean private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw672"
  owner-execution:
    needs: owner-preflight
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original complete image through original alarm return or guarded boundary
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw786"
          git -C "$RUNNER_TEMP/nw786" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw786" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw786" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v572_full_sc_translation.sh "$RUNNER_TEMP/nw786" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --run-si-alarm
      - name: Clean private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw786"
