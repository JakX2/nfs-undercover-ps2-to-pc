name: Wii Single Request IPC Ring Dispatch Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_ipc_ring_dispatch.h'
      - 'research/native_recomp/test_ipc_ring_dispatch.cpp'
      - '.github/workflows/wii-ipc-ring-dispatch.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cd research/native_recomp
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_ipc_ring_dispatch.cpp -o /tmp/ipc_ring_dispatch
          /tmp/ipc_ring_dispatch
