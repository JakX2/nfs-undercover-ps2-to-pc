name: Wii V1333 Nested ACK Admission Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/V1333_NESTED_ACK_ADMISSION.md'
      - '.github/workflows/wii-v1333-nested-admission.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_callback_path_budget_v1283.cpp -o /tmp/v1333
          /tmp/v1333
          python3 -m unittest discover -s research/native_recomp -p test_v1283_callback_paths.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v1331_nested_ack_path.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v1176_ack_helper.py -v
