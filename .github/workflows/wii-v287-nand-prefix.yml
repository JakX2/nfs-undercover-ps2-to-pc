name: Wii V287 Original Wii NAND Child Entry Prefix
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v287*'
      - '.github/workflows/wii-v287-nand-prefix.yml'
permissions:
  contents: read
concurrency:
  group: wii-v287-nand-prefix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v287:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V287 original-free NAND entry prefix control flow
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v287_nand_prefix.py research/native_recomp/test_v287_nand_prefix.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v287_nand_prefix.py' -v
          echo 'PASS: V287 original-free original NAND prefix classification'
  owner-original-v287:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V287 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Audit original Wii NAND child entry prefix control-flow
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v287_nand_prefix.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v287.log" 2>&1 || {
            grep -E '^V287_PREFIX_AUDIT verified=0$' "$RUNNER_TEMP/v287.log" | sort -u || true
            echo 'V287 original entry prefix not verified; proprietary code withheld' >&2
            exit 1
          }
          grep -Fx 'V287_PREFIX_AUDIT verified=1' "$RUNNER_TEMP/v287.log"
          grep -E '^V287_NAND_PREFIX child=8052fa60 bytes=80 calls=[0-9]{1,2} conditional=[0-9]{1,2} forward_beyond_early=[0-9]{1,2}$' "$RUNNER_TEMP/v287.log"
          grep -E '^V287_PREFIX_CALL rank=[0-9]{1,2} offset=[0-9]{1,2} target=[0-9a-f]{8}$' "$RUNNER_TEMP/v287.log" || true
          grep -E '^V287_PREFIX_BRANCH rank=[0-9]{1,2} offset=[0-9]{1,2} dest_offset=-?[0-9]{1,6} bo=([0-9]|[1-2][0-9]|3[01]) bi=([0-9]|[1-2][0-9]|3[01]) cr_expected=(-1|[01]) prev_cmp_kind=[0-2] cmp_field=(-1|[0-7]) cmp_ra=(-1|[0-9]|[1-2][0-9]|3[01]) imm_class=(-1|[0-4])$' "$RUNNER_TEMP/v287.log" || true
          echo 'V279 isolated original NAND direct linked callsite verified'
          echo 'V279 no raw PowerPC instructions or original owner bytes exported'
          echo 'V279 authenticated control-flow classification complete'
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V287 owner-verified original NAND entry prefix'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v287.log"
