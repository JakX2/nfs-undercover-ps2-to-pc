name: V53 exploratory spatial audit (asset-free)
on:
  push:
    paths:
      - 'research/v53/**'
      - 'research/v50/v50_scenery_index_crosscheck.py'
      - '.github/workflows/v53-asset-free-tests.yml'
  pull_request:
    paths:
      - 'research/v53/**'
      - 'research/v50/v50_scenery_index_crosscheck.py'
      - '.github/workflows/v53-asset-free-tests.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic-only source tests
        run: python -m unittest discover -s research/v53 -p 'test_v53.py' -v