name: Wii Native Host Runtime CMake
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/CMakeLists.txt'
      - 'research/native_recomp/wii_ipc_mailbox.h'
      - 'research/native_recomp/wii_hollywood_irq.h'
      - 'research/native_recomp/wii_ios_bus.h'
      - 'research/native_recomp/wii_stm_ios.h'
      - 'research/native_recomp/wii_guest_filesystem.h'
      - 'research/native_recomp/wii_sysconf_image.h'
      - 'research/native_recomp/wii_ios_yield_scheduler.h'
      - 'research/native_recomp/wii_nand_ios_reply_yield.h'
      - 'research/native_recomp/wii_ios_memory.h'
      - 'research/native_recomp/wii_physical_ram.h'
      - 'research/native_recomp/wii_native_ios_transport.h'
      - 'research/native_recomp/wii_native_ios_binding.h'
      - 'research/native_recomp/wii_native_ios_boundary.h'
      - 'research/native_recomp/wii_native_ios_aot_session.h'
      - 'research/native_recomp/wii_dol_loader_v431.h'
      - 'research/native_recomp/test_wii_dol_loader_v431.cpp'
      - 'research/native_recomp/apply_dol_loader_v431.py'
      - 'research/native_recomp/test_v431_dol_loader_patch.py'
      - 'research/native_recomp/test_wii_native_ios_aot_session.cpp'
      - 'research/native_recomp/wii_v423_synthetic_program.h'
      - 'research/native_recomp/generate_native_ios_aot_v423.cpp'
      - 'research/native_recomp/test_native_ios_aot_v423.cpp'
      - 'research/native_recomp/apply_native_lowmem_v63.py'
      - 'research/native_recomp/apply_nonsplit_dispatch_v15.py'
      - 'research/native_recomp/apply_mtmsr_resume_v74.py'
      - 'research/native_recomp/apply_exception_sprg.py'
      - 'research/native_recomp/apply_syscall_pc_v26.py'
      - 'research/native_recomp/native_external_irq.h'
      - 'research/native_recomp/test_wii_native_ios_boundary.cpp'
      - 'research/native_recomp/test_wii_native_ios_binding.cpp'
      - 'research/native_recomp/apply_native_ios_mmio_v418.py'
      - 'research/native_recomp/apply_native_ios_width_v421.py'
      - 'research/native_recomp/test_v421_native_ios_width.py'
      - 'research/native_recomp/apply_hollywood_mmio_v62.py'
      - 'research/native_recomp/test_v418_native_ios_mmio.py'
      - 'research/native_recomp/test_nwii_native_ios_mmio_v418.cpp'
      - 'research/native_recomp/test_wii_physical_ram.cpp'
      - 'research/native_recomp/test_wii_native_ios_transport.cpp'
      - 'research/native_recomp/test_wii_ipc_mailbox.cpp'
      - 'research/native_recomp/test_wii_hollywood_irq.cpp'
      - 'research/native_recomp/test_wii_ios_bus.cpp'
      - 'research/native_recomp/test_wii_stm_ios.cpp'
      - 'research/native_recomp/test_wii_guest_filesystem.cpp'
      - 'research/native_recomp/test_wii_sysconf_image.cpp'
      - 'research/native_recomp/test_wii_ios_yield_scheduler.cpp'
      - 'research/native_recomp/test_wii_nand_ios_reply_v374.cpp'
      - '.github/workflows/wii-native-host-cmake.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wii-native-host-cmake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free-host-runtime:
    name: Host CMake / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure independent native C++20 host runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S research/native_recomp -B "$RUNNER_TEMP/wii-host" -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          else
            cmake -S research/native_recomp -B "$RUNNER_TEMP/wii-host" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          fi
      - name: Build original-free host runtime and fourteen native test programs
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/wii-host" --config Debug --parallel 2
      - name: Run native IPC IOS NAND and SYSCONF tests with CTest
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/wii-host" -C Debug --output-on-failure --parallel 2
  pinned-nwii-mmio:
    name: Pinned NWiiRuntime MMIO transport
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate reversible source-only patch
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v418_native_ios_mmio.py -v
      - name: Fetch pinned original-free NWiiRuntime
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii-v418"
          git -C "$RUNNER_TEMP/nwii-v418" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii-v418" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii-v418" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii-v418" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
      - name: Compile and execute real MMU IPC PI wrappers with synthetic IOS requests
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v418"
          python3 research/native_recomp/apply_native_ios_mmio_v418.py "$root"
          python3 research/native_recomp/apply_native_ios_mmio_v418.py "$root"
          g++ -std=c++20 -O1 -Wall -Wextra -Wno-unused-parameter -Wno-unused-variable -Wno-sign-compare -pthread \
            -I"$root/nWiiRuntime/include" \
            research/native_recomp/test_nwii_native_ios_mmio_v418.cpp \
            "$root/nWiiRuntime/src/core/os_hle_stubs.cpp" \
            "$root/nWiiRuntime/src/hw/mmio_dispatcher.cpp" \
            "$root/nWiiRuntime/src/hw/hw_pi.cpp" \
            "$root/nWiiRuntime/src/hw/hw_ipc.cpp" \
            -o "$RUNNER_TEMP/v418-mmio"
          timeout 20s "$RUNNER_TEMP/v418-mmio"
      - name: Check native IOS widths and aliases in real pinned MMU
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v418"
          python3 -m unittest discover -s research/native_recomp -p test_v421_native_ios_width.py -v
          python3 research/native_recomp/apply_native_ios_width_v421.py "$root"
          python3 research/native_recomp/apply_native_ios_width_v421.py "$root"
          g++ -DV421_WIDTH_CHECKS -DV422_BOUNDARY_CHECKS -std=c++20 -O1 -Wall -Wextra -Wno-unused-parameter -Wno-unused-variable -Wno-sign-compare -pthread \
            -I"$root/nWiiRuntime/include" \
            research/native_recomp/test_nwii_native_ios_mmio_v418.cpp \
            "$root/nWiiRuntime/src/core/os_hle_stubs.cpp" \
            "$root/nWiiRuntime/src/hw/mmio_dispatcher.cpp" \
            "$root/nWiiRuntime/src/hw/hw_pi.cpp" \
            "$root/nWiiRuntime/src/hw/hw_ipc.cpp" \
            -o "$RUNNER_TEMP/v421-mmio"
          timeout 20s "$RUNNER_TEMP/v421-mmio"
      - name: Generate and execute native AOT IOS request and both guest rfi returns
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v418"
          host="$GITHUB_WORKSPACE/research/native_recomp"
          work="$RUNNER_TEMP/v423-aot"
          mkdir "$work"
          for patch in apply_nonsplit_dispatch_v15 apply_mtmsr_resume_v74 apply_syscall_pc_v26 apply_exception_sprg apply_native_lowmem_v63; do
            python3 "$host/$patch.py" "$root"
          done
          inc=(-I"$root/nWiiRuntime/include" -I"$root/nWiiAnalyzer/include" -I"$root/nWiiRecomp/include" -I"$host")
          g++ -std=c++20 -O2 -Wno-unused-variable -Wno-sign-compare "${inc[@]}" \
            "$host/generate_native_ios_aot_v423.cpp" \
            "$root/nWiiRuntime/src/core/loader.cpp" "$root/nWiiAnalyzer/src/analyzer.cpp" \
            "$root/nWiiAnalyzer/src/dolphin_sigdb.cpp" "$root/nWiiAnalyzer/src/signature_scanner.cpp" \
            "$root/nWiiRecomp/src/recompiler.cpp" "$root/nWiiRecomp/src/symbols.cpp" \
            -o "$work/generator"
          for mode in nonsplit split; do
            mkdir "$work/$mode"
            "$work/generator" "$work/$mode" "$mode"
            g++ -std=c++20 -O1 -Wall -Wextra -Wno-unused-label -Wno-unused-parameter -Wno-unused-variable -Wno-sign-compare -pthread \
              -fsanitize=address,undefined -fno-pie -no-pie "${inc[@]}" \
              "$host/test_native_ios_aot_v423.cpp" "$work/$mode"/*.cpp \
              "$root/nWiiRuntime/src/core/os_hle_stubs.cpp" \
              "$root/nWiiRuntime/src/hw/mmio_dispatcher.cpp" \
              "$root/nWiiRuntime/src/hw/hw_pi.cpp" \
              "$root/nWiiRuntime/src/hw/hw_ipc.cpp" \
              -o "$work/test-$mode"
            timeout 20s "$work/test-$mode"
          done
      - name: Validate transactional DOL loading through the actual pinned loader API
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v418"
          host="$GITHUB_WORKSPACE/research/native_recomp"
          python3 -m unittest discover -s "$host" -p test_v431_dol_loader_patch.py -v
          python3 "$host/apply_dol_loader_v431.py" "$root"
          python3 "$host/apply_dol_loader_v431.py" "$root"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-variable -Wno-sign-compare \
            -fsanitize=address,undefined -fno-pie -no-pie -DV431_PINNED_LOADER \
            -I"$root/nWiiRuntime/include" -I"$host" "$host/test_wii_dol_loader_v431.cpp" \
            "$root/nWiiRuntime/src/core/loader.cpp" -o "$RUNNER_TEMP/v431-loader"
          timeout 20s "$RUNNER_TEMP/v431-loader" "$RUNNER_TEMP/v431-synthetic.dol"
