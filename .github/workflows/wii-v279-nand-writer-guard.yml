name: Wii V279 Original Wii NAND Child Status-Writer Call Guard
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v279*'
      - '.github/workflows/wii-v279-nand-writer-guard.yml'
permissions:
  contents: read
concurrency:
  group: wii-v279-nand-writer-guard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v279:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V279 original-free PowerPC NAND callback call guard
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v279_nand_writer_guard.py research/native_recomp/test_v279_nand_writer_guard.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v279_nand_writer_guard.py' -v
          echo 'PASS: original-free V279 original NAND call guard classifier'
  owner-original-v279:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V279 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Verify original Wii NAND child to status-writer BL guard privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v279_nand_writer_guard.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v279.log" 2>&1 || {
            grep -E '^V279_NAND_CALL_AUDIT verified=0$' "$RUNNER_TEMP/v279.log" | sort -u || true
            echo 'V279 NAND call guard not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V279_NAND_CALL_AUDIT verified=1' "$RUNNER_TEMP/v279.log"
          grep -E '^V279_NAND_SC_CALL child=8052fa60 writer=8052fca4 direct=1 call_offset=[0-9]{1,4} skip_cond=[0-9]{1,3} nearest_skip_offset=(-1|[0-9]{1,4}) nearest_target_offset=(-1|[0-9]{1,4}) bo=(-1|[0-9]|[1-2][0-9]|3[01]) bi=(-1|[0-9]|[1-2][0-9]|3[01]) cr_expected=(-1|[01]) cr_field=(-1|[0-7]) producer_kind=[0-3] producer_ra=(-1|[0-9]|[1-2][0-9]|3[01]) producer_imm_class=(-1|[0-4])$' "$RUNNER_TEMP/v279.log"
          echo 'V279 isolated original NAND direct linked callsite verified'
          echo 'V279 no raw PowerPC instructions or original owner bytes exported'
          echo 'V279 authenticated control-flow classification complete'
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V279 authentic original Wii NAND-to-SC writer callsite guard'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v279.log"
