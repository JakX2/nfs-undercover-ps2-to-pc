name: Wii V104 Original IOS_OpenAsync Request Preparation
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v104*'
      - '.github/workflows/wii-v104-sc-async-submit.yml'
permissions:
  contents: read
concurrency:
  group: wii-v104-focus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-owner-v104:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Prepare pinned original-free NWii runtime and cache traces
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_perf_patch_guards_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/verify_perf_combo_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_hid4_continuous_patch_v30.py"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_continuous_patch_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_trace_guards_v44.py"
          python3 "$here/apply_jump_table_v58.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_jump_table_patch_v58.py"
          python3 "$here/apply_dcbi_v60.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hollywood_mmio_v62.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_native_lowmem_v63.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_bat_registers_v65.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbz_v67.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_exception_sprg.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_mtmsr_resume_v74.py" "$RUNNER_TEMP/nwii"
          echo 'PASS: V72 focused runtime prerequisites prepared and original-free source guards passed'
      - name: Run original IOS_OpenAsync request preparation candidate
        run: |
          set -euo pipefail
          umask 077
          bash research/native_recomp/run_v104_continuous_sc_async_submit.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/v104-focused.log" 2>&1 || {
              grep -E '^V104_STAGE (runtime_cache_trace_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled|native_test_passed)$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V77_ACK_STATE ctrl=[01] flag=[01] waiting=[01] returned=[01] queued=[01] writes=[01] read=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V76_DISPATCH_STATE index=[01] context=[01] route=[01] masked=[01] ack=[01] pi=[01] mask=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V76_MMIO_UNSUPPORTED addr=0?c[0-9a-f]{6}$|^V76_MMIO_UNSUPPORTED addr=0?d[0-9a-f]{6}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V75_VECTOR_STATE index=[01] context=[01] pc=[01] msr=[01] gpr=[01] special=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V74_IRQ_ENTRY idle=1 waiting=1 vector=1 srr=1 ack=1$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V73_WAIT_STATE waiting=[01] head=[01] tail=[01] queue=[01] links=[01] force0=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V72_IRQ_HANDLER candidate=[123]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V72_SDA phase=[01] site=[0-9a-f]{8} addr=[0-9a-f]{8} width=[124] init=[01] initial_nz=[01] live_nz=[01] equal=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V72_SEND_STATE lr=[01] msg=[0-9]{1,2} x1=[0-9]{1,2} ee=[01] flush=[0-9]{1,2} disable=[0-9]{1,2} ack=[0-9]{1,2}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V71_REQUEST_SHAPE request=[0-9]{1,3} command=[0-9]{1,3} path=[0-9]{1,3}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}$|^V77_COMPILE_UNIT (harness|generated|loader|generator)$|^V77_HARNESS_LINE [0-9]+$|^V77_GENERATOR_LINE [0-9]+$|^V77_WARNING [a-z0-9-]+$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V79_RFI_STATE resume=[01] regs=[01] waiting=[01]$|^V79_REPLY_ENTRY route=[01] wire=[01] waiting=[01] pending=[01]$|^V104_TRIAL_PASS trial=[0-9]{1,2}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V79_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5} phase=[01] enable=[01] resched=[01] load=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V79_GETCONTEXT resched=[01] lr=[01] masked=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V80_WAKE_ENTRY route=[01] waiting=[01] wire=[01] consumed=[01]$|^V104_TRIAL_PASS trial=[0-9]{1,2}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V81_READY_STATE route=[01] drained=[01] ready=[01] enrolled=[01] idle=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V82_REPLY_RETURN clear=[01] ready=[01] route=[01]$|^V82_LOAD_CONTEXT selected=[01] running=[01] saved=[01]$|^V82_RESUME_STATE running=[01] stack=[01] queue=[01] route=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V83_FREE_ENTRY request=[01] result=[01] route=[01]$|^V83_SECOND_OPEN first=[01] next=[01] abi=[01] cleanup=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V84_SECOND_ACK first=[01] second=[01] wire=[01] pending=[01] route=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V85_STM_OPENS descriptors=[01] idle=[01] cleanup=[01] abi=[01] route=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V86_ASYNC_ENTRY route=[01] service=[01] buffers=[01] callback=[01] idle=[01]$|^V86_ASYNC_SUBMIT route=[01] allocated=[01] flush=[01] wire=[01] idle=[01]$|^V86_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V87_ASYNC_RETURN route=[01] descriptors=[01] thread=[01] sent=[01] before=[01]$|^V87_DEFERRED pending=[01] ack=[01] wire=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V88_ACTIVE_VECTOR route=[01] saved=[01] running=[01] masked=[01]$|^V88_ACTIVE_ACK clear=[01] deferred=[01] running=[01] route=[01]$|^V88_ACTIVE_RFI regs=[01] status=[01] running=[01] deferred=[01]$|^V88_STM_RETURN route=[01] abi=[01] running=[01] deferred=[01] devices=[01]$|^V88_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V89_SUBSYSTEM route=[01] queue=[01] abi=[01] version=[01] pending=[01]$|^V89_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V90_CONSOLE_ROUTE route=[01] abi=[01] console=[01] queue=[01] devices=[01] pending=[01]$|^V90_ROUTE_TARGET mode=[0-3] pc=(8051e7e4|8052f94c)$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V91_RESOURCE_BUFFER route=[01] bounds=[01]$|^V91_RESOURCE_OPEN route=[01] abi=[01] path=[01] devices=[01] pending=[01] kind=[0-8]$|^V91_LITERAL count=[0-3]$|^V91_PATH_DIAGNOSTIC length=[0-9]{1,2} mem2=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V92_FS_ACK prior=[01] event=[01]$|^V92_FS_RETURN route=[01] result=[01] descriptors=[01] deferred=[01] abi=[01] idle=[01] bounds=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V93_HEAP_ENTRY route=[01] bounds=[01]$|^V93_ISFS_RETURN route=[01] result=[01] memory=[01] state=[01] preserved=[01]$|^V93_NEXT_OPEN route=[01] service=[01] preserved=[01]$|^V93_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V94_ES_ACK prior=[01] event=[01]$|^V94_ES_RETURN route=[01] result=[01] prior=[01] deferred=[01] abi=[01]$|^V94_TITLE_REQUEST route=[01] api=[01] vector=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V95_VECTOR_SUBMIT flush=[01] wire=[01]$|^V95_TITLE_ACK wire=[01] output=[01]$|^V95_TITLE_RETURN route=[01] output=[01] abi=[01] prior=[01] vector=[01]$|^V95_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V96_DIRECTORY_REQUEST api=[01] vector=[01] title=[01]$|^V96_VECTOR_SUBMIT flush=[01] wire=[01]$|^V96_DIRECTORY_ACK wire=[01] output=[01]$|^V96_DIRECTORY_RETURN route=[01] data=[01] vector=[01] abi=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V97_DIRECTORY_COPY copied=[01]$|^V97_CLOSE_ACK wire=[01] closed=[01]$|^V97_ES_RETURN route=[01] closed=[01] prior=[01] abi=[01] callback=[01]$|^V97_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V98_NAND_SEQUENCE disable=[0-2] restore=[0-2] version=[0-1] report=[0-1] committed=[01]$|^V98_NAND_RETURN route=[01] stack=[01] status=[01]$|^V98_CONDITIONAL_HELPER selected=1$|^V98_NAND_CALLBACK route=[01] abi=[01] list=[01] directory=[01] state=[01] prior=[01]$|^V98_VERSION_POINTER nonzero=[01] owner=[01]$|^V98_INITIAL_DATA count=[0-9]{1,2}$|^V98_DEPENDENCY pc=80[45][0-9a-f]{5} lr=80[45][0-9a-f]{5}$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V99_SIBLING_MEMORY route=[01] abi=[01] data=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V100_SC_ENTRY status=[01]$|^V100_SC_STATUS entry=[01]$|^V100_SC_ROUTE route=[01] thread=[01] prior=[01] chosen=[12]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V101_SC_SAVE route=[01]$|^V101_SC_CHILD route=[01] running=[01] prior=[01] kind=[12] arg=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V102_SC_STRLEN input=[01] bounded=[01]$|^V102_SC_COPY input=[01] bounded=[01]$|^V102_SC_PATH route=[01] bytes=[01] abi=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V103_SC_SAVE route=[01]$|^V103_SC_COPY bounded=[01] prior=[01]$|^V103_SC_ASYNC_ENTRY route=[01] path=[01] mode=[01] callback=[01] copied=[01] prior=[01] abi=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              # Public source-only assertion decoder; no owner data is emitted.
              code="$(grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/v104-focused.log" | tail -n 1 | cut -d= -f2 || true)"
              if [[ "$code" =~ ^[0-9]{3}$ ]]; then
                python3 research/native_recomp/diagnose_sc_async_submit_v104.py "$((10#$code))" || true
              fi
              grep -E '^V103_SC_DIAG prior_nonempty=[01] path_ptr=[01] copy_span=[01] pointer_equal=[01] arg_empty=[01] copy_equal=[01]$|^V104_ASYNC_SAVE route=[01]$|^V104_ASYNC_CACHE bounded=[01]$|^V104_ASYNC_VECTOR route=[01]$|^V104_ASYNC_SYSCALL order=[01] lines=[01]$|^V104_ASYNC_SUBMIT route=[01] request=[01] mode=[01] path=[01] abi=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log" | sort -u || true
              grep -E '^V104_DEPENDENCY pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$' "$RUNNER_TEMP/v104-focused.log" | sort -u || true
              grep -E '^V104_FALLTHROUGH pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8} phase=[0-9]{1,2} cache=[0-9]{1,2}$' "$RUNNER_TEMP/v104-focused.log" | sort -u || true
              grep -E '^V104_TRACE seq=[0-9]{1,2} pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$' "$RUNNER_TEMP/v104-focused.log" | sort -u || true
              grep -E '^V104_FAIL_HOOK pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$' "$RUNNER_TEMP/v104-focused.log" | sort -u || true
              grep -E '^V104_RUNNER_POSTFAIL line=[0-9]+$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V104_SUCCESS_GATE count=[0-9]{1,3} save=[01] cache=[01] sc=[01] submit=[01] terminal=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
              grep -E '^V104_WRAPPER_STAGE (derived|syntax_ok)$' "$RUNNER_TEMP/v104-focused.log" || true
              echo 'V104 candidate failed; private logs withheld' >&2
              exit 1
            }
          grep -E '^V71_REQUEST_SHAPE request=[0-9]{1,3} command=[0-9]{1,3} path=[0-9]{1,3}$' "$RUNNER_TEMP/v104-focused.log" || true
          grep -E '^V72_IRQ_HANDLER candidate=[123]$' "$RUNNER_TEMP/v104-focused.log" || true
          grep -E '^V73_WAIT_STATE waiting=[01] head=[01] tail=[01] queue=[01] links=[01] force0=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
          grep -E '^V74_IRQ_ENTRY idle=1 waiting=1 vector=1 srr=1 ack=1$' "$RUNNER_TEMP/v104-focused.log" || true
          grep -E '^V75_VECTOR_STATE index=[01] context=[01] pc=[01] msr=[01] gpr=[01] special=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
          grep -E '^V76_DISPATCH_STATE index=[01] context=[01] route=[01] masked=[01] ack=[01] pi=[01] mask=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
          grep -E '^V77_ACK_STATE ctrl=[01] flag=[01] waiting=[01] returned=[01] queued=[01] writes=[01] read=[01]$' "$RUNNER_TEMP/v104-focused.log" || true
          grep -E '^V79_RFI_STATE resume=[01] regs=[01] waiting=[01]$|^V79_REPLY_ENTRY route=[01] wire=[01] waiting=[01] pending=[01]$|^V104_TRIAL_PASS trial=[0-9]{1,2}$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V80_WAKE_ENTRY route=[01] waiting=[01] wire=[01] consumed=[01]$|^V104_TRIAL_PASS trial=[0-9]{1,2}$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V81_READY_STATE route=[01] drained=[01] ready=[01] enrolled=[01] idle=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V82_REPLY_RETURN clear=[01] ready=[01] route=[01]$|^V82_LOAD_CONTEXT selected=[01] running=[01] saved=[01]$|^V82_RESUME_STATE running=[01] stack=[01] queue=[01] route=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V83_FREE_ENTRY request=[01] result=[01] route=[01]$|^V83_SECOND_OPEN first=[01] next=[01] abi=[01] cleanup=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V84_SECOND_ACK first=[01] second=[01] wire=[01] pending=[01] route=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V85_STM_OPENS descriptors=[01] idle=[01] cleanup=[01] abi=[01] route=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V86_ASYNC_ENTRY route=[01] service=[01] buffers=[01] callback=[01] idle=[01]$|^V86_ASYNC_SUBMIT route=[01] allocated=[01] flush=[01] wire=[01] idle=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V87_ASYNC_RETURN route=[01] descriptors=[01] thread=[01] sent=[01] before=[01]$|^V87_DEFERRED pending=[01] ack=[01] wire=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V88_ACTIVE_VECTOR route=[01] saved=[01] running=[01] masked=[01]$|^V88_ACTIVE_ACK clear=[01] deferred=[01] running=[01] route=[01]$|^V88_ACTIVE_RFI regs=[01] status=[01] running=[01] deferred=[01]$|^V88_STM_RETURN route=[01] abi=[01] running=[01] deferred=[01] devices=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V89_SUBSYSTEM route=[01] queue=[01] abi=[01] version=[01] pending=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V90_CONSOLE_ROUTE route=[01] abi=[01] console=[01] queue=[01] devices=[01] pending=[01]$|^V90_ROUTE_TARGET mode=[0-3] pc=(8051e7e4|8052f94c)$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V91_RESOURCE_BUFFER route=[01] bounds=[01]$|^V91_RESOURCE_OPEN route=[01] abi=[01] path=[01] devices=[01] pending=[01] kind=[0-8]$|^V91_LITERAL count=[0-3]$|^V91_PATH_DIAGNOSTIC length=[0-9]{1,2} mem2=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V92_FS_ACK prior=[01] event=[01]$|^V92_FS_RETURN route=[01] result=[01] descriptors=[01] deferred=[01] abi=[01] idle=[01] bounds=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V93_HEAP_ENTRY route=[01] bounds=[01]$|^V93_ISFS_RETURN route=[01] result=[01] memory=[01] state=[01] preserved=[01]$|^V93_NEXT_OPEN route=[01] service=[01] preserved=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V94_ES_ACK prior=[01] event=[01]$|^V94_ES_RETURN route=[01] result=[01] prior=[01] deferred=[01] abi=[01]$|^V94_TITLE_REQUEST route=[01] api=[01] vector=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V95_VECTOR_SUBMIT flush=[01] wire=[01]$|^V95_TITLE_ACK wire=[01] output=[01]$|^V95_TITLE_RETURN route=[01] output=[01] abi=[01] prior=[01] vector=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V96_DIRECTORY_REQUEST api=[01] vector=[01] title=[01]$|^V96_VECTOR_SUBMIT flush=[01] wire=[01]$|^V96_DIRECTORY_ACK wire=[01] output=[01]$|^V96_DIRECTORY_RETURN route=[01] data=[01] vector=[01] abi=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V97_DIRECTORY_COPY copied=[01]$|^V97_CLOSE_ACK wire=[01] closed=[01]$|^V97_ES_RETURN route=[01] closed=[01] prior=[01] abi=[01] callback=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V98_NAND_SEQUENCE disable=[0-2] restore=[0-2] version=[0-1] report=[0-1] committed=[01]$|^V98_NAND_RETURN route=[01] stack=[01] status=[01]$|^V98_CONDITIONAL_HELPER selected=1$|^V98_NAND_CALLBACK route=[01] abi=[01] list=[01] directory=[01] state=[01] prior=[01]$|^V98_VERSION_POINTER nonzero=[01] owner=[01]$|^V98_INITIAL_DATA count=[0-9]{1,2}$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V99_SIBLING_MEMORY route=[01] abi=[01] data=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V100_SC_ENTRY status=[01]$|^V100_SC_STATUS entry=[01]$|^V100_SC_ROUTE route=[01] thread=[01] prior=[01] chosen=[12]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V101_SC_SAVE route=[01]$|^V101_SC_CHILD route=[01] running=[01] prior=[01] kind=[12] arg=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V102_SC_STRLEN input=[01] bounded=[01]$|^V102_SC_COPY input=[01] bounded=[01]$|^V102_SC_PATH route=[01] bytes=[01] abi=[01] prior=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -E '^V103_SC_SAVE route=[01]$|^V103_SC_COPY bounded=[01] prior=[01]$|^V103_SC_ASYNC_ENTRY route=[01] path=[01] mode=[01] callback=[01] copied=[01] prior=[01] abi=[01]$' "$RUNNER_TEMP/v104-focused.log"
          grep -Fx 'BOOT_PROGRESS entry=0x8000403C pc=0x805195EC stage=104' "$RUNNER_TEMP/v104-focused.log"
          echo 'PASS: V104 genuine IOS_OpenAsync native submit boundary'
      - name: Remove private originals and generated code
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals" \
            "$RUNNER_TEMP/v104-focused.json" "$RUNNER_TEMP/v104-focused.log"
