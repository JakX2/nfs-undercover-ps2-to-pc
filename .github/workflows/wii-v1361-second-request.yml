name: Wii V1361 Second Open Transaction Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1361*'
      - '.github/workflows/wii-v1361-second-request.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for test in test_open_cache_range_v649 test_wii_open_sc_route_v637 test_wii_open_request_witness_v639 test_post_ack_open_join_v1242 test_second_request_v1361; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
