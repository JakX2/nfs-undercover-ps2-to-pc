name: Wii Original Formatter 127 Immediate Native Continuation
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-caller-report-sixth-immediate-native-owner.yml'
      - 'research/native_recomp/test_formatter_report_fifth_immediate_native_wiring.py'
      - 'research/native_recomp/test_formatter_report_sixth_immediate_fixture.py'
      - 'research/native_recomp/test_formatter_report_sixth_immediate_nested.py'
      - 'research/native_recomp/test_formatter_report_fourth_immediate_nested.py'
      - 'research/native_recomp/test_formatter_report_fifth_immediate_nested.py'
      - 'research/native_recomp/wii_formatter_report_byte_transition.h'
      - 'research/native_recomp/wii_formatter_caller_integer.h'
      - 'research/native_recomp/wii_formatter_report_signext.h'
      - 'research/native_recomp/wii_formatter_report_second_immediate.h'
      - 'research/native_recomp/wii_formatter_report_third_immediate.h'
      - 'research/native_recomp/wii_formatter_report_fourth_immediate.h'
      - 'research/native_recomp/test_formatter_report_sixth_immediate_log.py'
      - 'research/native_recomp/test_formatter_report_sixth_immediate.cpp'
      - 'research/native_recomp/wii_formatter_report_sixth_immediate.h'
      - 'research/native_recomp/test_formatter_report_fifth_immediate_fixture.py'
      - 'research/native_recomp/test_formatter_report_fifth_immediate_nested.py'
      - 'research/native_recomp/test_formatter_report_fifth_immediate_log.py'
      - 'research/native_recomp/wii_formatter_report_fifth_immediate.h'
      - 'research/native_recomp/test_formatter_report_fifth_immediate.cpp'
      - 'research/native_recomp/test_formatter_report_immediate_fixture.py'
      - 'research/native_recomp/test_formatter_report_stack_copy_fixture.py'
      - 'research/native_recomp/test_formatter_report_third_immediate_native_wiring.py'
      - 'research/native_recomp/test_formatter_report_fourth_immediate_native_wiring.py'
      - 'research/native_recomp/wii_post_stm_sc_formatter.h'
      - 'research/native_recomp/prepare_formatter_nested_fixture.py'
      - 'research/native_recomp/validate_formatter_nested_log.py'
      - 'research/native_recomp/test_native_scheduler_postack_v1256.cpp'
      - 'research/native_recomp/run_v1256_native_scheduler_postack.sh'
      - 'research/native_recomp/test_formatter_report_successor_chain.cpp'
      - 'research/native_recomp/test_formatter_nested_join.cpp'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-127-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 -m py_compile research/native_recomp/prepare_formatter_report_fifth_immediate_fixture.py research/native_recomp/prepare_formatter_nested_fixture.py research/native_recomp/validate_formatter_nested_log.py
          python3 research/native_recomp/test_formatter_report_fourth_immediate_fixture.py
          python3 research/native_recomp/test_formatter_report_fifth_immediate_fixture.py
          python3 research/native_recomp/test_formatter_report_sixth_immediate_fixture.py
          python3 research/native_recomp/test_formatter_report_third_immediate_nested.py
          python3 research/native_recomp/test_formatter_report_fourth_immediate_nested.py
          python3 research/native_recomp/test_formatter_report_fifth_immediate_nested.py
          python3 research/native_recomp/test_formatter_report_sixth_immediate_nested.py
          python3 research/native_recomp/test_formatter_report_third_immediate_log.py
          python3 research/native_recomp/test_formatter_report_fourth_immediate_log.py
          python3 research/native_recomp/test_formatter_report_fifth_immediate_log.py
          python3 research/native_recomp/test_formatter_report_sixth_immediate_log.py
          python3 research/native_recomp/test_formatter_report_third_immediate_native_wiring.py
          python3 research/native_recomp/test_formatter_report_fourth_immediate_native_wiring.py
          python3 research/native_recomp/test_formatter_report_fifth_immediate_native_wiring.py
          python3 research/native_recomp/test_formatter_report_second_immediate_nested.py
          python3 research/native_recomp/test_formatter_report_second_immediate_log.py
          python3 research/native_recomp/test_formatter_report_signext_nested.py
          python3 research/native_recomp/test_formatter_report_immediate_fixture.py
          python3 research/native_recomp/test_formatter_report_stack_copy_fixture.py
          python3 research/native_recomp/test_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_nested_log.py
          for test in test_formatter_caller_integer test_formatter_report_byte_transition test_formatter_nested_join test_formatter_report_signext test_formatter_report_second_immediate test_formatter_report_third_immediate test_formatter_report_fourth_immediate test_formatter_report_fifth_immediate test_formatter_report_sixth_immediate test_formatter_report_successor_chain; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
          g++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -Iresearch/native_recomp research/native_recomp/test_formatter_report_fifth_immediate.cpp -o /tmp/test_formatter_report_fifth_immediate_release
          /tmp/test_formatter_report_fifth_immediate_release
          g++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -Iresearch/native_recomp research/native_recomp/test_formatter_report_sixth_immediate.cpp -o /tmp/test_formatter_report_sixth_immediate_release
          /tmp/test_formatter_report_sixth_immediate_release
  # Original 127 requires successful pinned original 126 execution and
  # independently authenticated 127 private provenance.
  prerequisites:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.pins.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: Check pinned upstream proofs, skip owner if pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          proofs=(
              Requirement(46069757610,'8f226be7799b5baede0845f0070e6b9a88fb0a93',
                          '.github/workflows/wii-formatter-caller-report-fifth-immediate-native-owner.yml',
                          'owner-fifth-immediate'),
              Requirement(46067342027,'f51e30eacc8315b5453cf6206edfe6e70628b6b3',
                          '.github/workflows/wii-formatter-127-immediate-fixture.yml',
                          'owner-provenance'),
          )
          def fetch(endpoint):
              raw=subprocess.check_output(
                  ['gh','api',f"repos/{os.environ['GH_REPO']}/{endpoint}"],
                  stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:ready=all(verify(fetch,proof) for proof in proofs)
          except (OSError,ValueError,TypeError,KeyError,subprocess.SubprocessError):ready=False
          print('eligible=' + str(ready).lower())
          PY
      - name: Report prerequisite decision
        env:
          ELIGIBLE: ${{ steps.pins.outputs.eligible }}
        run: |
          if [[ "$ELIGIBLE" == true ]]; then
            echo 'FORMATTER_127_ELIGIBLE ready=1 original_execution=0'
          else
            echo 'FORMATTER_127_ELIGIBLE ready=0 original_execution=0'
          fi
  owner-sixth-immediate:
    needs: [original-free, prerequisites]
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true' && needs.prerequisites.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Require pinned original 126 native execution and original 127 fixture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          prerequisites=(
              Requirement(46069757610,'8f226be7799b5baede0845f0070e6b9a88fb0a93',
                          '.github/workflows/wii-formatter-caller-report-fifth-immediate-native-owner.yml',
                          'owner-fifth-immediate'),
              Requirement(46067342027,'f51e30eacc8315b5453cf6206edfe6e70628b6b3',
                          '.github/workflows/wii-formatter-127-immediate-fixture.yml',
                          'owner-provenance'),
          )
          def fetch(endpoint):
              raw=subprocess.check_output(
                  ['gh','api',f"repos/{os.environ['GH_REPO']}/{endpoint}"],
                  stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:ok=all(verify(fetch,requirement) for requirement in prerequisites)
          except (OSError,ValueError,TypeError,KeyError,subprocess.SubprocessError):ok=False
          if not ok:raise SystemExit('FORMATTER_127_NATIVE_GATE verified=0')
          print('FORMATTER_127_NATIVE_GATE verified=1 original_126=1 authenticated_127=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage authenticated private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original 127-instruction guarded native continuation
        env:
          UNDERCOVER_EXPECTED_CALLER_INTEGER_COUNT: '2'
          UNDERCOVER_EXPECTED_CALLER_POST_INTEGER_COUNT: '1'
          UNDERCOVER_EXPECTED_CALLER_MIXED_INTEGERS: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_TAKEN: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_FALLTHROUGH: '1'
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nwii127"
          git -C "$RUNNER_TEMP/nwii127" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii127" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii127" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v1256_native_scheduler_postack.sh "$RUNNER_TEMP/nwii127" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --formatter-nested-caller-report-sixth-immediate
      - name: Remove original files and generated translated code
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nwii127"
