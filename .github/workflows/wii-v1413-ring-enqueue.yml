name: Wii V1413 IPC Ring Enqueue Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_ipc_ring_enqueue_v1413.h'
      - 'research/native_recomp/test_ipc_ring_enqueue_v1413.cpp'
      - 'research/native_recomp/test_v1414_ring_geometry.py'
      - '.github/workflows/wii-v1413-ring-enqueue.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cd research/native_recomp
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_ipc_ring_enqueue_v1413.cpp -o /tmp/ring
          /tmp/ring
          python3 test_v1414_ring_geometry.py
