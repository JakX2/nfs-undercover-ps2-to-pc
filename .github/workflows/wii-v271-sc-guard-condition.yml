name: Wii V271 Original Wii SC Status Completion Branches
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v271*'
      - '.github/workflows/wii-v271-sc-guard-condition.yml'
permissions:
  contents: read
concurrency:
  group: wii-v271-sc-guard-condition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v271:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V271 synthetic PowerPC SC store skip conditions
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v271_sc_guard_condition.py research/native_recomp/test_v271_sc_guard_condition.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v271_sc_guard_condition.py' -v
          echo 'PASS: original-free V271 CR skip-store semantics'
  owner-original-v271:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V271 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Inspect original Wii SC store CR skip conditions privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v271_sc_guard_condition.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v271.log" 2>&1 || {
            grep -E '^V271_GUARD_AUDIT verified=0$' "$RUNNER_TEMP/v271.log" | sort -u || true
            echo 'V271 direct store guard condition not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V271_GUARD_AUDIT verified=1' "$RUNNER_TEMP/v271.log"
          test "$(grep -Ec '^V271_SC_GUARD rank=[12] store_offset=[0-9]{1,4} branch_offset=[0-9]{1,4} target_offset=[0-9]{1,4} bo=([0-9]|[1-2][0-9]|3[0-1]) bi=([0-9]|[1-2][0-9]|3[0-1]) cr_field=[0-7] cr_bit=[0-3] ctr_decrement=[01] cr_expected=(-1|[01]) direct_cmp=[01] cmp_kind=[0-3] cmp_ra=(-1|[0-9]|[1-2][0-9]|3[01]) cmp_imm_class=(-1|[0-4]) read_rt=([0-9]|[1-2][0-9]|3[01]) status_cmp=[01]$' "$RUNNER_TEMP/v271.log")" -eq 2
          grep -E '^V271_SC_GUARD rank=[12] store_offset=[0-9]{1,4} branch_offset=[0-9]{1,4} target_offset=[0-9]{1,4} bo=([0-9]|[1-2][0-9]|3[0-1]) bi=([0-9]|[1-2][0-9]|3[0-1]) cr_field=[0-7] cr_bit=[0-3] ctr_decrement=[01] cr_expected=(-1|[01]) direct_cmp=[01] cmp_kind=[0-3] cmp_ra=(-1|[0-9]|[1-2][0-9]|3[01]) cmp_imm_class=(-1|[0-4]) read_rt=([0-9]|[1-2][0-9]|3[01]) status_cmp=[01]$' "$RUNNER_TEMP/v271.log"
          echo 'PASS: V271 original Wii guarded status clear comparison'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v271.log"
