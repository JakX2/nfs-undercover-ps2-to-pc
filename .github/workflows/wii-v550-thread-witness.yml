name: Wii Native Thread Witness Checks
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v549*'
      - '.github/workflows/wii-v550-thread-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thread-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify corrected SI flag and authenticated thread geometry
        run: |
          python3 -m unittest discover -s research/native_recomp -p test_v524_si_sampling.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v529_si_discovery.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v549_thread_init.py -v
      - name: Check SI and thread witness negative controls under sanitizers
        run: |
          set -euo pipefail
          for test in test_wii_si_sampling_witness_v524 test_wii_si_discovery_witness_v529 test_wii_thread_init_witness_v549; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie \
              -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done
