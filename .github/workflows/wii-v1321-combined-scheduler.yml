name: Wii V1321 Combined Scheduler Fixture
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1321*'
      - '.github/workflows/wii-v1321-combined-scheduler.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v1321_combined_resume.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v1307_cooperative_fixture.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v1316_reply_helper.py -v
