name: Wii V771 Post-ACK Native Transfer Device Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v771*'
      - 'research/native_recomp/wii_si_follow_on_v750.h'
      - '.github/workflows/wii-v771-postack-transfer.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for version in si_follow_on_v750 postack_transfer_device_v771; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/test_${version}.cpp" -o "$RUNNER_TEMP/test"
            "$RUNNER_TEMP/test"
          done
