name: Wii Formatter Caller Mixed Byte Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/prepare_formatter_caller_mixed_byte_contract.py'
      - 'research/native_recomp/test_formatter_caller_mixed_byte_contract.py'
      - '.github/workflows/wii-formatter-caller-mixed-byte-contract.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-caller-mixed-byte-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/prepare_formatter_caller_mixed_byte_contract.py
          python3 research/native_recomp/test_stm_outer_restore.py
          python3 research/native_recomp/test_formatter_caller_mixed_byte_contract.py
  owner-geometry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require verified original stack byte provenance and expanded symbolic replay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          reqs=(
              Requirement(45964294830,'93b55242dfe69e55405ea94d83c291f973db3f89',
                          '.github/workflows/wii-formatter-caller-mixed-load-audit.yml','owner-geometry'),
              Requirement(45963685357,'7ab733d443931895eeadca636242b11de1796f66',
                          '.github/workflows/wii-formatter-caller-mixed-contract.yml','owner-geometry'),
          )
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          if not all(verify(fetch,x) for x in reqs):raise SystemExit('FORMATTER_CALLER_MIXED_BYTE_CONTRACT_GATE verified=0')
          print('FORMATTER_CALLER_MIXED_BYTE_CONTRACT_GATE verified=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Authenticate next original byte load and guarded continuation
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/prepare_formatter_caller_mixed_byte_contract.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean private originals
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
