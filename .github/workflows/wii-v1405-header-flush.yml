name: Wii V1405 Header Cache and Handoff Contract
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/V1405_HEADER_FLUSH.md'
      - '.github/workflows/wii-v1405-header-flush.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cd research/native_recomp
          for test in test_ioctl_first_flush_v1398 test_ioctl_construction_v1392; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie "$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
