name: Wii V1268 Native Reply IRQ Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1268*'
      - '.github/workflows/wii-v1268-reply-irq-contract.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test reply IRQ after captured first interrupt RFI
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_scheduler_reply_irq_v1268.cpp -o "$RUNNER_TEMP/v1268"
          "$RUNNER_TEMP/v1268"
