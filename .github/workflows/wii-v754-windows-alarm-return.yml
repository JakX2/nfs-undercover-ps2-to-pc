name: Wii V754 Windows Original Fifth SI Alarm Return
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/windows_alarm_return_v754.py'
      - 'research/native_recomp/test_v754_windows_alarm_return.py'
      - '.github/workflows/wii-v754-windows-alarm-return.yml'
permissions:
  contents: read
concurrency:
  group: wii-v754-windows-alarm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fifth-call native Windows composition and fail-closed audit
        shell: pwsh
        run: |
          python -m unittest discover -s research/native_recomp -p test_v754_windows_alarm_return.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v786_alarm_return.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v753_windows_transfer_suffix.py -v
          exit $LASTEXITCODE
  owner-windows:
    needs: original-free
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned private staging dependency
        run: python -m pip install --quiet 'gdown==5.2.0'
      - name: Stage and authenticate owner DOL and ELF
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        shell: pwsh
        run: |
          python owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py (Join-Path $env:RUNNER_TEMP 'orig754')
          exit $LASTEXITCODE
      - name: Fetch exact pinned NWiiRecomp
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nw754-o'
          git init -q $root
          git -C $root remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C $root fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $root checkout -q --detach FETCH_HEAD
          exit $LASTEXITCODE
      - name: Build authentic original Windows fifth SI alarm-return path
        shell: pwsh
        run: |
          $orig = Join-Path $env:RUNNER_TEMP 'orig754'
          python research/native_recomp/windows_full_build_v426.py (Join-Path $env:RUNNER_TEMP 'nw754-o') (Join-Path $env:RUNNER_TEMP 'w754-o') --owner-dol (Join-Path $orig 'NfsMWRelease.dol') --owner-elf (Join-Path $orig 'NfsMWRelease.elf') --owner-scope os-si-handler-time --owner-alarm-return
          exit $LASTEXITCODE
      - name: Delete owner inputs, generated game code and private binaries
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('orig754','nw754-o','w754-o')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $path) { Remove-Item -Recurse -Force $path }
          }
