name: Wii V265 Original Wii Retry Branch Condition
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v265*'
      - '.github/workflows/wii-v265-retry-edge.yml'
permissions:
  contents: read
concurrency:
  group: wii-v265-retry-edge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v265:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V265 PowerPC BO/BI branch and synthetic retry edge
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/ppc_retry_edge.py research/native_recomp/audit_v265_retry_edge.py research/native_recomp/test_ppc_retry_edge.py
          python3 -m unittest discover -s research/native_recomp -p 'test_ppc_retry_edge.py' -v
          echo 'PASS: original-free V265 PowerPC branch semantics'
  owner-original-v265:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V265 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Audit original Wii BO/BI branch condition without code export
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v265_retry_edge.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v265.log" 2>&1 || {
            grep -E '^RETRY_EDGE_AUDIT verified=0$' "$RUNNER_TEMP/v265.log" | sort -u || true
            echo 'V265 retry edge not verified; private original withheld' >&2
            exit 1
          }
          grep -Fx 'RETRY_EDGE_AUDIT verified=1' "$RUNNER_TEMP/v265.log"
          grep -E '^RETRY_EDGE backedge_count=1 back_span=[0-9]{1,5} bo=([0-9]|[1-2][0-9]|3[0-1]) bi=([0-9]|[1-2][0-9]|3[0-1]) cr_field=[0-7] cr_bit=[0-3] ctr_decrement=[01] ctr_zero=(-1|[01]) cr_expected=(-1|[01])$' "$RUNNER_TEMP/v265.log"
          echo 'PASS: V265 authenticated PowerPC retry condition'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v265.log"
