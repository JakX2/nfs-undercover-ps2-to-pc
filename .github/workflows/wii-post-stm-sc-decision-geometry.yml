name: Wii Private Post-STM SC Decision Fixture
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/prepare_post_stm_sc_decision.py'
      - 'research/native_recomp/test_post_stm_sc_decision.py'
      - '.github/workflows/wii-post-stm-sc-decision-geometry.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-post-stm-sc-decision-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/prepare_post_stm_sc_decision.py
          python3 research/native_recomp/test_stm_outer_restore.py
          python3 research/native_recomp/test_post_stm_sc_decision.py
  owner-geometry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require verified historic SC subsystem and current STM final geometry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          reqs=(
              Requirement(45876224184,'0cb44416f98f370b6db5b47d227d248e1ac40f58',
                          '.github/workflows/wii-post-stm-sc-disable-owner.yml','owner-sc-disable'),
              Requirement(45876451195,'9982258bb49a59d1b10708136334d2d956d70e49',
                          '.github/workflows/wii-post-stm-sc-state-geometry.yml','owner-geometry'),
          )
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          if not all(verify(fetch,x) for x in reqs):raise SystemExit('POST_STM_SC_DECISION_GATE verified=0')
          print('POST_STM_SC_DECISION_GATE verified=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Authenticate original SC decision guarded fixture
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/prepare_post_stm_sc_decision.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean private originals
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
