name: Wii V841 Post Setter Callback Witness
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v841*'
      - '.github/workflows/wii-v841-callback-suffix.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded post-setter callback witness
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_callback_suffix_v841.cpp -o "$RUNNER_TEMP/v841"
          "$RUNNER_TEMP/v841"
