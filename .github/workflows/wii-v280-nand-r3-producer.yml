name: Wii V280 Original Wii NAND Child r3 Source
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v280*'
      - '.github/workflows/wii-v280-nand-r3-producer.yml'
permissions:
  contents: read
concurrency:
  group: wii-v280-nand-r3-producer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v280:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V280 original-free guarded NAND r3 producer
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v280_nand_r3_producer.py research/native_recomp/test_v280_nand_r3_producer.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v280_nand_r3_producer.py' -v
          echo 'PASS: original-free V280 original NAND r3 provenance'
  owner-original-v280:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V280 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Trace original Wii NAND child r3 producer before status-writer BL
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v280_nand_r3_producer.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v280.log" 2>&1 || {
            grep -E '^V280_R3_AUDIT verified=0$' "$RUNNER_TEMP/v280.log" | sort -u || true
            echo 'V280 r3 producer not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V280_R3_AUDIT verified=1' "$RUNNER_TEMP/v280.log"
          grep -E '^V280_NAND_R3 child=8052fa60 writer=8052fca4 cmp_offset=176 guarded_call=184 guards=[0-9]{1,3} source=(call|load|immediate|computed|barrier|unknown|entry) source_offset=(-1|[0-9]{1,4}) source_target=[0-9a-f]{8} tracked=([0-9]|[1-2][0-9]|3[01]) copies=[0-9]{1,2} width=[0-4] base=(-1|[0-9]|[1-2][0-9]|3[01]) disp=-?[0-9]{1,5}$' "$RUNNER_TEMP/v280.log"
          echo 'V279 isolated original NAND direct linked callsite verified'
          echo 'V279 no raw PowerPC instructions or original owner bytes exported'
          echo 'V279 authenticated control-flow classification complete'
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V280 original Wii NAND r3 branch input classified'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v280.log"
