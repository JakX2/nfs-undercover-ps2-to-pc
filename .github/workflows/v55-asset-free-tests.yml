name: V55 scenery archive inventory (synthetic only)
on:
  push:
    paths:
      - 'research/v55/**'
      - '.github/workflows/v55-asset-free-tests.yml'
  pull_request:
    paths:
      - 'research/v55/**'
      - '.github/workflows/v55-asset-free-tests.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run asset-free tests
        run: python -m unittest discover -s research/v55 -p 'test_v55.py' -v
