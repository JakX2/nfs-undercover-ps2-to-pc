name: Wii Original Formatter 117 Direct Callee Trace Retry
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-caller-next-entry-retry.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-return-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 research/native_recomp/test_formatter_caller_next_entry_contract.py
          python3 research/native_recomp/test_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_nested_log.py
          for test in test_post_stm_sc_entry test_formatter_nested_join; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
  owner-caller-next-entry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require successful pinned 116 native diagnostic and original callee geometry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          reqs=(
              Requirement(45970376538,'29ee24c9e151a0e7b8d08c54cda05c8a9e9e96e5',
                          '.github/workflows/wii-formatter-control-source.yml','original-free'),
              Requirement(45969432302,'38986493dd892edd7c5ed84f83b42a8dcc776965',
                          '.github/workflows/wii-formatter-caller-next-entry-contract.yml','owner-geometry'),
          )
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:
              run_id=45976423264
              prior=fetch(f'actions/runs/{run_id}')
              job=fetch('actions/jobs/140430069379')
              ok=(prior.get('id')==run_id
                  and prior.get('head_sha')=='9f4cd969e47901aef91ed26eb35f88ef73d7c188'
                  and prior.get('head_branch')=='research/wii-native-recomp-preflight'
                  and prior.get('path')=='.github/workflows/wii-formatter-final-prep-diagnostic.yml'
                  and prior.get('run_attempt')==1
                  and prior.get('status')=='completed' and prior.get('conclusion')=='success'
                  and job.get('id')==140430069379 and job.get('run_id')==run_id
                  and job.get('run_attempt')==1 and job.get('name')=='owner-diagnostic'
                  and job.get('status')=='completed' and job.get('conclusion')=='success'
                  and all(verify(fetch,req) for req in reqs))
          except (OSError,ValueError,subprocess.SubprocessError):
              ok=False
          if not ok:raise SystemExit('POST_STM_SC_FORMATTER_OWNER_GATE verified=0')
          print('POST_STM_SC_FORMATTER_OWNER_GATE verified=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original 117-instruction path to new callee entry (load unexecuted)
        env:
          UNDERCOVER_EXPECTED_CALLER_INTEGER_COUNT: '2'
          UNDERCOVER_EXPECTED_CALLER_POST_INTEGER_COUNT: '1'
          UNDERCOVER_EXPECTED_CALLER_MIXED_INTEGERS: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_TAKEN: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_FALLTHROUGH: '1'
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw1352"
          git -C "$RUNNER_TEMP/nw1352" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw1352" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw1352" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v1256_native_scheduler_postack.sh "$RUNNER_TEMP/nw1352" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --formatter-nested-caller-next-entry
      - name: Clean private original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw1352"
