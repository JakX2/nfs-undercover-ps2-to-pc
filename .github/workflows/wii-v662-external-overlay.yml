name: Wii V662 Complete Native External Vector Preflight
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v662*'
      - '.github/workflows/wii-v662-external-overlay.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic overlay and audit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v662_external_overlay.py -v
          bash -n research/native_recomp/run_v572_full_sc_translation.sh
          git init -q "$RUNNER_TEMP/nw662"
          git -C "$RUNNER_TEMP/nw662" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw662" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw662" checkout -q --detach FETCH_HEAD
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -I"$RUNNER_TEMP/nw662/nWiiRuntime/include" -Iresearch/native_recomp research/native_recomp/test_external_overlay_v662.cpp -o "$RUNNER_TEMP/test-v662"
          "$RUNNER_TEMP/test-v662"
  owner-translation:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Translate and audit complete original external vector without execution
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw662"
          git -C "$RUNNER_TEMP/nw662" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw662" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw662" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v572_full_sc_translation.sh "$RUNNER_TEMP/nw662" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --prepare-external-overlay
      - name: Clean private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw662"
