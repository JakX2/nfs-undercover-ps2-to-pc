name: Wii V277 Original Wii SYSCONF Writer Callgraph
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v277*'
      - '.github/workflows/wii-v277-sc-writer-callers.yml'
permissions:
  contents: read
concurrency:
  group: wii-v277-sc-writer-callers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v277:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V277 original-free PowerPC direct writer callers
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v277_sc_writer_callers.py research/native_recomp/test_v277_sc_writer_callers.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v277_sc_writer_callers.py' -v
          echo 'PASS: original-free V277 direct writer callgraph'
  owner-original-v277:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V277 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Audit original Wii SYSCONF writer direct callers privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v277_sc_writer_callers.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v277.log" 2>&1 || {
            grep -E '^V277_SC_CALL_AUDIT verified=0$' "$RUNNER_TEMP/v277.log" | sort -u || true
            echo 'V277 writer callgraph not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V277_SC_CALL_AUDIT verified=1' "$RUNNER_TEMP/v277.log"
          grep -E '^V277_SC_CALLS targets=6 direct_calls=[0-9]{1,6} caller_pairs=[0-9]{1,6} writer_to_writer=[0-9]{1,6} unmapped=[0-9]{1,6}$' "$RUNNER_TEMP/v277.log"
          test "$(grep -Ec '^V277_SC_TARGET target=[0-9a-f]{8} calls=[0-9]{1,6} callers=[0-9]{1,6}$' "$RUNNER_TEMP/v277.log")" -eq 6
          grep -E '^V277_SC_CALLER target=[0-9a-f]{8} rank=[1-6] owner=[0-9a-f]{8} calls=[0-9]{1,6}$' "$RUNNER_TEMP/v277.log" || true
          grep -E '^V277_SC_TARGET target=[0-9a-f]{8} calls=[0-9]{1,6} callers=[0-9]{1,6}$' "$RUNNER_TEMP/v277.log"
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V277 authenticated original Wii direct writer callgraph'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v277.log"
