name: Wii V866 Original Callback With Live EXI Profile
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v866*'
      - 'research/native_recomp/wii_wireless_wrapper_v844.h'
      - '.github/workflows/wii-v866-owner-profile-callback.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v853_resume_dispatch.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v802_callback_time.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_callback_frontier_v829.cpp -o "$RUNNER_TEMP/v829"
          "$RUNNER_TEMP/v829"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_callback_suffix_v841.cpp -o "$RUNNER_TEMP/v841"
          "$RUNNER_TEMP/v841"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wireless_sram_write_v857.cpp -o "$RUNNER_TEMP/v857"
          "$RUNNER_TEMP/v857"
          bash -n research/native_recomp/run_owner_callback_after_setter_v842.sh
  owner-context:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original callback through indirect dispatch and resumed caller
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw866"
          git -C "$RUNNER_TEMP/nw866" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw866" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw866" checkout -q --detach FETCH_HEAD
          UNDERCOVER_TEST_CALLBACK_RETURN=1 UNDERCOVER_TEST_CALLBACK_DISPATCH=1 UNDERCOVER_TEST_WIRELESS_WRITE_WITNESS=1 UNDERCOVER_TEST_LIVE_EXI_PROFILE=1 bash research/native_recomp/run_owner_callback_after_setter_v842.sh "$RUNNER_TEMP/nw866" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Remove private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw866"
