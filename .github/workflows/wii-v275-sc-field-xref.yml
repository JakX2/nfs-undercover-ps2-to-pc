name: Wii V275 Original Wii SYSCONF Structure Field Xrefs
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v275*'
      - '.github/workflows/wii-v275-sc-field-xref.yml'
permissions:
  contents: read
concurrency:
  group: wii-v275-sc-field-xref-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v275:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V275 original-free PPC structure field xrefs
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v275_sc_field_xref.py research/native_recomp/test_v275_sc_field_xref.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v275_sc_field_xref.py' -v
          echo 'PASS: original-free V275 structure field PPC xrefs'
  owner-original-v275:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V275 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Cross-check original Wii SC source field and candidate writers privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v275_sc_field_xref.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v275.log" 2>&1 || {
            grep -E '^V275_FIELD_AUDIT verified=0$' "$RUNNER_TEMP/v275.log" | sort -u || true
            echo 'V275 structure field scan not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V275_FIELD_AUDIT verified=1' "$RUNNER_TEMP/v275.log"
          grep -E '^V275_SC_FIELD links=4 sections=([1-9]|[1-2][0-9]|3[0-2]) loads=[0-9]{1,6} word_writes=[0-9]{1,6} byte_writes=[0-9]{1,6} half_writes=[0-9]{1,6} owner_writers=[0-9]{1,6} near_writer_owners=[0-9]{1,4} unmapped=[0-9]{1,6}$' "$RUNNER_TEMP/v275.log"
          test "$(grep -Ec '^V275_FIELD_INPUT owner=[0-9a-f]{8} store_offset=[0-9]{1,5} load_offset=[0-9]{1,5} base_reg=([0-9]|[1-2][0-9]|3[01]) value_reg=([0-9]|[1-2][0-9]|3[01])$' "$RUNNER_TEMP/v275.log")" -eq 4
          grep -E '^V275_FIELD_INPUT owner=[0-9a-f]{8} store_offset=[0-9]{1,5} load_offset=[0-9]{1,5} base_reg=([0-9]|[1-2][0-9]|3[01]) value_reg=([0-9]|[1-2][0-9]|3[01])$' "$RUNNER_TEMP/v275.log"
          grep -E '^V275_FIELD_WRITER rank=([1-9]|1[0-2]) owner=[0-9a-f]{8} stores=[0-9]{1,4}$' "$RUNNER_TEMP/v275.log" || true
          echo 'PASS: V275 owner Wii SC structure-offset Xrefs classified'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v275.log"
