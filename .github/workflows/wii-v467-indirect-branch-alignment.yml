name: Wii Native Indirect Branch Alignment
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v467*'
      - '.github/workflows/wii-v467-indirect-branch-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test source patch and shell syntax
        run: |
          python3 -m unittest discover -s research/native_recomp -p test_v467_indirect_branch_alignment.py -v
          bash -n research/native_recomp/run_v467_indirect_branch_alignment.sh
      - name: Fetch pinned compiler
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw467"
          git -C "$RUNNER_TEMP/nw467" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw467" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw467" checkout -q --detach FETCH_HEAD
      - name: Compare native LR and CTR target alignment with actual interpreter
        run: bash research/native_recomp/run_v467_indirect_branch_alignment.sh "$RUNNER_TEMP/nw467"
