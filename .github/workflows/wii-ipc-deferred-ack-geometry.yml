name: Wii Private Deferred IPC ACK Geometry
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/prepare_ipc_deferred_ack_geometry.py'
      - 'research/native_recomp/test_ipc_deferred_ack_geometry.py'
      - '.github/workflows/wii-ipc-deferred-ack-geometry.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-ipc-deferred-ack-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/prepare_ipc_deferred_ack_geometry.py
          python3 -m unittest discover -s research/native_recomp -p test_ipc_deferred_ack_geometry.py -v
  owner-geometry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require verified profile geometry and deferred ACK memory contract
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          reqs=(
              Requirement(45849414950,'7d7c1694862dd1644256e109e3d78bde1bcf99f9',
                          '.github/workflows/wii-ipc-profile-geometry.yml','owner-geometry'),
              Requirement(45865397367,'34da0c9a2755f7cc1b673fcd710b46102c9769f3',
                          '.github/workflows/wii-ipc-deferred-ack-memory.yml','source'),
          )
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          if not all(verify(fetch,x) for x in reqs):raise SystemExit('IPC_DEFERRED_ACK_GATE verified=0')
          print('IPC_DEFERRED_ACK_GATE verified=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Authenticate ACK credit increment and profile decrement
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/ack-geometry"
          python3 research/native_recomp/prepare_ipc_deferred_ack_geometry.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --out "$RUNNER_TEMP/ack-geometry"
          printf '#include "private_deferred_ack_execution.h"\nint main(){return deferred_ack_private::expected.words.empty();}\n' > "$RUNNER_TEMP/ack-geometry/check.cpp"
          g++ -std=c++20 -Wall -Wextra -Werror -Iresearch/native_recomp "$RUNNER_TEMP/ack-geometry/check.cpp" -o "$RUNNER_TEMP/ack-geometry/check" 2>"$RUNNER_TEMP/ack-geometry/compile.log" || { echo "DEFERRED_ACK_HEADER compiled=0"; exit 1; }
          "$RUNNER_TEMP/ack-geometry/check"
          echo "DEFERRED_ACK_HEADER compiled=1"
      - name: Clean private originals
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/ack-geometry"
