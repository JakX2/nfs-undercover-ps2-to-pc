name: Wii V291 Original Wii NAND First Guard Fallthrough
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v291*'
      - '.github/workflows/wii-v291-nand-fallthrough.yml'
permissions:
  contents: read
concurrency:
  group: wii-v291-nand-fallthrough-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v291:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V291 original-free NAND first-guard fallthrough
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v291_nand_fallthrough.py research/native_recomp/test_v291_nand_fallthrough.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v291_nand_fallthrough.py' -v
          echo 'PASS: V291 original-free NAND CR0 and control flow'
  owner-original-v291:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V291 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Classify original Wii NAND zero-check fallthrough privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v291_nand_fallthrough.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v291.log" 2>&1 || {
            grep -E '^V291_NAND_FLOW_AUDIT verified=0$' "$RUNNER_TEMP/v291.log" | sort -u || true
            echo 'V291 NAND fallthrough not verified; proprietary instructions withheld' >&2
            exit 1
          }
          grep -Fx 'V291_NAND_FLOW_AUDIT verified=1' "$RUNNER_TEMP/v291.log"
          grep -E '^V291_NAND_FALLTHROUGH child=8052fa60 cmp=8 branch=24 service_call=80 cr0=(preserved|clobbered|inconclusive) between_keep=[0-3] between_write=[0-3] between_unknown=[0-3] between_control=[0-3] events=[0-9]{1,2} conditional=[0-9]{1,2} direct_call=[0-9]{1,2} direct_jump=[0-9]{1,2} lr=[0-9]{1,2} ctr=[0-9]{1,2} system=[0-9]{1,2}$' "$RUNNER_TEMP/v291.log"
          grep -E '^V291_FLOW rank=[0-9]{1,2} offset=[0-9]{1,3} kind=(conditional|direct_call|direct_jump|lr|ctr|system) target_offset=-?[0-9]{1,6} bo=(-1|[0-9]|[1-2][0-9]|3[01]) bi=(-1|[0-9]|[1-2][0-9]|3[01])$' "$RUNNER_TEMP/v291.log" || true
          echo 'V288 validated original NAND early PowerPC CR0 producer'
          echo 'V288 owner-original ELF read-only and authenticated'
          echo 'V279 isolated original NAND direct linked callsite verified'
          echo 'V279 no raw PowerPC instructions or original owner bytes exported'
          echo 'V279 authenticated control-flow classification complete'
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V291 authenticated original NAND fallthrough flow'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v291.log"
