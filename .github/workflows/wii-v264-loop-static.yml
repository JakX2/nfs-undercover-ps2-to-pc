name: Wii V264 Private Wii OSInit Retry Control Audit
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v264*'
      - '.github/workflows/wii-v264-loop-static.yml'
permissions:
  contents: read
concurrency:
  group: wii-v264-loop-static-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v264:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V264 original-free PPC branch decoder and source privacy
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v264_osinit_retry_elf.py research/native_recomp/test_v264_loop_static.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v264_loop_static.py' -v
          echo 'PASS: original-free V264 branch decoder tests'
  owner-original-v264:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V264 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Audit SHA-pinned original Wii retry control flow privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v264_osinit_retry_elf.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v264.log" 2>&1 || {
            grep -E '^V264_AUDIT_ERROR kind=(digest|symbols|caller|helper|section|geometry)$' "$RUNNER_TEMP/v264.log" | sort -u || true
            echo 'V264 owner original control flow not verified; private code withheld' >&2
            exit 1
          }
          grep -Fx 'V264_ORIGINAL_ELF verified=1' "$RUNNER_TEMP/v264.log"
          grep -E '^V264_LOOP_STRUCT owner=1 direct=[01] link=[01] window=([8-9]|[1-5][0-9]|6[0-4]) cond=[0-9]{1,3} backward=[0-9]{1,3} back_to_call=[0-9]{1,3} compare=[0-9]{1,3} loads=[0-9]{1,3} stores=[0-9]{1,3} sda_loads=[0-9]{1,3} disable=[0-9]{1,3} restore=[0-9]{1,3} gettime=[0-9]{1,3} mftb=[0-9]{1,3} back_span=[0-9]{1,6}$' "$RUNNER_TEMP/v264.log"
          echo 'PASS: V264 private PowerPC control-flow audit'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v264.log"
