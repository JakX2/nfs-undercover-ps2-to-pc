name: Wii Native BAT Mapping Witness
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v590*'
      - '.github/workflows/wii-v590-bat-witness.yml'
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Independent physical entry and return witness controls
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_bat_mapping_witness_v590.cpp -o "$RUNNER_TEMP/v590"
          "$RUNNER_TEMP/v590"
