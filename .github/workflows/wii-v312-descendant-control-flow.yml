name: Wii V312 Original NAND Helper Control-Flow Audit
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v312*'
      - '.github/workflows/wii-v312-descendant-control-flow.yml'
permissions:
  contents: read
concurrency:
  group: wii-v312-descendant-control-flow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V312 original-free helper control-flow audit
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v312_descendant_control_flow.py research/native_recomp/test_v312_descendant_control_flow.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v312_descendant_control_flow.py' -v
          echo 'PASS: synthetic-only V312 helper callgraph audit'
  owner-original-v312:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V312 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Audit original Wii first NAND service helper control flow
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v312_descendant_control_flow.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v312.log" 2>&1 || {
            grep -E '^V312_HELPER_AUDIT verified=0$' "$RUNNER_TEMP/v312.log" | sort -u || true
            echo 'V312 original helper audit not verified; game code withheld' >&2
            exit 1
          }
          grep -Fx 'V312_HELPER_AUDIT verified=1' "$RUNNER_TEMP/v312.log"
          grep -E '^V312_HELPER_FLOW original=1 pc=80519bcc words=64 calls=[0-9]{1,3} targets=[0-9]{1,3} conditional_calls=[0-9]{1,3} conditional_branches=[0-9]{1,3} local_jumps=[0-9]{1,3} bclr=[0-9]{1,3} bcctr=[0-9]{1,3}$' "$RUNNER_TEMP/v312.log"
          grep -E '^V312_HELPER_CALLEE rank=([1-9]|1[0-2]) target=[0-9a-f]{8} calls=[0-9]{1,3}$' "$RUNNER_TEMP/v312.log" || true
          echo 'V312 SHA-pinned original helper inspected without exporting game bytes'
          echo 'V312 SHA-pinned original helper inspected without exporting game bytes'
          echo 'V312 SHA-pinned original helper inspected without exporting game bytes'
          echo 'V312 SHA-pinned original helper inspected without exporting game bytes'
          echo 'PASS: V312 authenticated first NAND service helper flow classified'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v312.log"
