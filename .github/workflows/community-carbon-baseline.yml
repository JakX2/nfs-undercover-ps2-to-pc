name: Community Carbon research baseline (no game assets)
on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/community-carbon-baseline.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/community-carbon-baseline.yml'
jobs:
  asset-free:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python entry points
        run: python -m compileall -q tools tests examples
      - name: Run all synthetic-only regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run newcomer fake-file quickstart
        run: python examples/synthetic_smoke.py
