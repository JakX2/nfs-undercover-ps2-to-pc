name: Wii Register-only Continuation
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_register_continuation.h'
      - 'research/native_recomp/test_register_continuation.cpp'
      - 'research/native_recomp/test_register_continuation_join.cpp'
      - '.github/workflows/wii-register-continuation.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_register_continuation.cpp -o /tmp/register-continuation
          /tmp/register-continuation
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_register_continuation_join.cpp -o /tmp/register-continuation-join
          /tmp/register-continuation-join
