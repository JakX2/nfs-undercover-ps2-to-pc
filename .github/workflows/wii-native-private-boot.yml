name: Private Wii native boot CI
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/**'
      - '.github/workflows/wii-native-private-boot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-native-wii-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_osinit_eximask_v68.sh
          python3 -m unittest discover -s research/native_recomp -p test_boot_progress.py -v
  original:
    needs: syntax
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage verified private originals
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Pin upstream NWiiRecomp
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
      - name: Authentic original V68 OSInit regression
        env:
          V68_SANITIZE: '0'
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/boot_progress.py \
            --lane osinit-direct --report "$RUNNER_TEMP/report.json" \
            --timeout 1800 \
            --dol "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            --sha256 16a09adcf1987c1f3617d10f3a1cb830f32886afb583f9f8f88e0963ae5fe1f4 \
            -- bash research/native_recomp/run_osinit_eximask_v68.sh \
              "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
              > "$RUNNER_TEMP/native.log" 2>&1 || {
                echo 'V68 original-native regression failed; private logs withheld' >&2
                exit 1
              }
          python3 - "$RUNNER_TEMP/report.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['lane']=='osinit-direct'
          assert r['status'] in ('passed_uninstrumented','passed_instrumented')
          assert r['pass_markers']>=1
          print('PASS: genuine original Wii V68 native execution; continuous __start NOT reached')
          PY
      - name: Clean original files and game-derived code
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nwii" \
            "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/native.log"
