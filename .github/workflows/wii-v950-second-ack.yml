name: Wii V950 Second Completion ACK Transaction
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v950*'
      - '.github/workflows/wii-v950-second-ack.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for n in second_completion_ack_v950 second_si_dispatch_v944 si_completion_ack_v668 postack_transfer_device_v771; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/test_$n.cpp" -o "$RUNNER_TEMP/$n"
            "$RUNNER_TEMP/$n"
          done
