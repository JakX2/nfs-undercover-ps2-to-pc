name: Wii V324 Second-Generation NAND ELF Callgraph
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v324*'
      - '.github/workflows/wii-v324-second-flow.yml'
permissions:
  contents: read
concurrency:
  group: wii-v324-descendant-control-flow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v324:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V324 synthetic-only second-generation ELF callgraph
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/analyze_v324_second_flow.py research/native_recomp/test_v324_second_flow.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v324_second_flow.py' -v
          echo 'PASS: synthetic-only V324 helper callgraph audit'
  owner-original-v324:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V324 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Audit five original NAND helper descendants without exporting code
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/analyze_v324_second_flow.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v324.log" 2>&1 || {
            grep -E '^V324_ELF_AUDIT verified=0$' "$RUNNER_TEMP/v324.log" | sort -u || true
            echo 'V324 original helper audit not verified; game code withheld' >&2
            exit 1
          }
          grep -Fx 'V324_ELF_AUDIT verified=1' "$RUNNER_TEMP/v324.log"
          grep -E '^V324_NAND_FLOW owner=1 targets=5 exact=[0-5] interior=[0-5] unknown=[0-5] calls=[0-9]{1,5}$' "$RUNNER_TEMP/v324.log"
          grep -E '^V324_FLOW pc=[0-9a-f]{8} kind=(exact|interior|unknown|ambiguous|invalid) words=[0-9]{1,4} calls=[0-9]{1,5} targets=[0-9]{1,5} cond=[0-9]{1,5} local=[0-9]{1,5} bclr=[0-9]{1,5} bcctr=[0-9]{1,5} conditional_calls=[0-9]{1,5}$' "$RUNNER_TEMP/v324.log"
          grep -E '^V324_CALLEE from=[0-9a-f]{8} rank=([1-9]|1[0-6]) to=[0-9a-f]{8} calls=[0-9]{1,5}$' "$RUNNER_TEMP/v324.log" || true
          echo 'PASS: V324 SHA-pinned NAND descendant control flow classified'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v324.log"
