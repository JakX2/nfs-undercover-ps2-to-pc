name: Wii V130 Original Interrupt Restore Continuation
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v130*'
      - '.github/workflows/wii-v130-irq-restore.yml'
permissions:
  contents: read
concurrency:
  group: wii-v130-irq-restore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-irq-next-v130:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'Owner Wii staging failed after three bounded attempts' >&2
            exit 1
          fi
      - name: Independently verify V125 private fixture restoration
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py \
            "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Prepare pinned original-free NWii runtime and cache traces
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_perf_patch_guards_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/verify_perf_combo_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_hid4_continuous_patch_v30.py"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_continuous_patch_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_trace_guards_v44.py"
          python3 "$here/apply_jump_table_v58.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_jump_table_patch_v58.py"
          python3 "$here/apply_dcbi_v60.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hollywood_mmio_v62.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_native_lowmem_v63.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_bat_registers_v65.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbz_v67.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_exception_sprg.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_mtmsr_resume_v74.py" "$RUNNER_TEMP/nwii"
          echo 'PASS: V72 focused runtime prerequisites prepared and original-free source guards passed'
      - name: Execute original interrupt-restore routine and discover next call
        run: |
          set -euo pipefail
          umask 077
          test -f research/native_recomp/run_v130_continuous_irq_restore.sh
          test -f research/native_recomp/diagnose_irq_restore_v130.py
          test -f research/native_recomp/restore_v127_osinit_tail.py
          test -f research/native_recomp/restore_v128_next_function.py
          test -f research/native_recomp/classify_v125_runtime_shape.py
          test -f research/native_recomp/diagnose_v125_fixture_coverage.py
          test -f research/native_recomp/make_start_to_sc_helper_v125.py
          test -f research/native_recomp/restore_sc_helper_late_v125.py
          test -f research/native_recomp/make_v125_canonical_fixture.py
          test -f research/native_recomp/test_v125_sc_helper_geometry.py
          test -f research/native_recomp/describe_v125_generator_assertion.py
          test -f research/native_recomp/derive_v125_sc_helper_generator.py
          bash research/native_recomp/run_v130_continuous_irq_restore.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/sc130.log" 2>&1 || {
              grep -E '^V125_GENERATED_TARGET present=[01]$|^V125_RUNTIME_SHAPE exception=[01] fault=[01] missing=[01] memory=[01] limit=[01] stop=[01] lookup=[01] dispatch=[01] state=[01] runtime=[01] range=[01] logic=[01]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_DERIVATION result=failed kind=(missing_anchor|ambiguous_anchor|python_syntax|import_error|other_value_error|other_error)|^V110_WRAPPER_SYNTAX line=[0-9]+$|^V104_STAGE (runtime_cache_trace_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled)$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V110_PUBLIC_CXX_LINE number=[0-9]{1,5}$|^V110_PUBLIC_CXX_KIND expected=[0-9] undeclared=[0-9] type=[0-9] conversion=[0-9]|^V130_NATIVE_EXIT ok=[01]$|^V125_RUNTIME_SHAPE exception=[01] fault=[01] missing=[01] memory=[01] limit=[01] stop=[01] lookup=[01] dispatch=[01] state=[01] runtime=[01] range=[01] logic=[01]$|^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc130.log" || true
              code="$(grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc130.log" | tail -n 1 | cut -d= -f2 || true)"
              if [[ "$code" =~ ^[0-9]{3}$ ]]; then
                if grep -Fxq 'V104_STAGE generator_compiled' "$RUNNER_TEMP/sc130.log" &&
                   ! grep -Fxq 'V104_STAGE generation_complete' "$RUNNER_TEMP/sc130.log"; then
                  python3 research/native_recomp/describe_v125_generator_assertion.py "$((10#$code))" || true
                else
                  python3 research/native_recomp/diagnose_irq_restore_v130.py "$((10#$code))" || true
                fi
              fi
              grep -E '^V112_ASYNC_SUBMIT route=[01] wire=[01] mode=[01] path=[01] abi=[01] prior=[01]$|^V112_ASYNC_SYSCALL order=[01] lines=[01]$|^V111_TERMINAL open=[0-9] selected=[0-9] stop=[01]$|^V111_SC_ASYNC_ENTRY route=[01] copied=[01] path=[01] nonempty=[01] abi=[01] prior=[01]$|^V110_IPC_GATE ack=[01] dispatch=[01] vector=[01] scheduler=[01] active=[01] phase=[01] db=[01] os=[01]$|^V110_ASSERT_HOOK pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$|^V110_TRIAL_START trial=[0-9]{1,2}$|^V130_TRIAL_PASS trial=[0-9]{1,2}$|^V114_CACHE_SYSCALL route=[01] flushed=[01] abi=[01] prior=[01]$|^V115_VECTOR_ENTRY valid=[01]$|^V115_DISABLE_ENTRY route=[01] abi=[01] prior=[01]$|^V116_QUEUE_HELPER route=[01] pointer=[01] abi=[01] prior=[01]$|^V117_SEND_REG route=[01] abi=[01] prior=[01]$|^V117_WALK seq=[0-9]{1,2} pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$|^V118_PPCMSG wire=[01] path=[01]$|^V118_PPCCTRL route=[01] request=[01]$|^V118_CTRL_READ_ENTRY route=[01] abi=[01] prior=[01] msg=[01]$|^V119_CTRL_WRITE_ENTRY route=[01] reads=[01] wire=[01] abi=[01] prior=[01]$|^V120_X1_RESTORE_ENTRY route=[01] sent=[01] wire=[01] abi=[01] prior=[01]$|^V121_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$|^V122_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$|^V123_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$|^V124_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$|^V125_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$|^V120_WALK seq=[0-9]{1,2} pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8} x1=[01]$|^V118_WALK seq=[0-9]{1,2} pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8} msg=[01] x1=[01]$|^V110_SC_STRLEN input=[01] bounded=[01] empty=[01]$|^V110_SC_CONTINUE route=[01] data=[01] abi=[01] prior=[01] branch=[123]$|^V109_SC_SECOND_COPY input=[01] bounded=[01]$' "$RUNNER_TEMP/sc130.log" | sort -u || true
              grep -E '^V118_CTRL_READ_ENTRY' "$RUNNER_TEMP/sc130.log" | head -n 8 || true
              grep -E '^V104_FAIL_HOOK pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$|^V104_FALLTHROUGH pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8} phase=[0-9]{1,2} cache=[0-9]{1,2}$|^V104_TRACE seq=[0-9]{1,2} pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$' "$RUNNER_TEMP/sc130.log" | sort -u | tail -n 28 || true
              grep -E '^V112_(WALK|BOUNDARY)|^V113_(WALK|BOUNDARY)' "$RUNNER_TEMP/sc130.log" | tail -n 20 || true
              grep -E '^V125_EXCEPTION_SITE pc=[0-9a-f]{8} lr=[0-9a-f]{8} phase=[01] kind=[01]$' "$RUNNER_TEMP/sc130.log" | sort -u || true
              grep -E '^V125_EXCEPTION_STEPS delta=[0-9]{1,6}$|^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc130.log" | sort -u || true
              grep -E '^V125_TRACE_CALL seq=[0-9]{1,2} pc=[0-9a-f]{8} lr=[0-9a-f]{8}$|^V125_OPCODE_CLASS first_branch=[01] first_mem=[01] second_branch=[01] second_mem=[01]$' "$RUNNER_TEMP/sc130.log" | sort -u || true
              grep -E '^V125_OPCODE_DETAIL major0=[0-9]{1,2} major1=[0-9]{1,2} xo0=[0-9]{1,4} zero0=[01] zero1=[01]$' "$RUNNER_TEMP/sc130.log" | sort -u || true
              grep -E '^V125_FIXTURE_CODE mapped=[01] owner=[01] zero=[01] nop=[01] same=[01]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_GEOMETRY_FAILURE code=[0-9]{1,2} valueerror=[01]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_GEOMETRY_KIND import=[01] type=[01] value=[01] other=[01]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_STAGE_CHECK (after_probe|before_geometry|after_geometry|geometry_failure_branch)=1$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_LATE_RESTORE ok=[01]$|^V125_CANONICAL result=(failed|verified)$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_LATE_DETAIL code=[0-9]{2}$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_LATE_PREFIX kind=[0-4]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_GEOMETRY_STATUS ok=[01]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V125_BAD_BRANCH site=[0-9a-f]{8} major=[0-9]{1,2} link=[01] absolute=[01]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V127_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$|^V127_OSINIT_RESTORE ok=[01]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V127_NATIVE_COUNTS start=[0-9]{1,2} pass=[0-9]{1,2} next=[0-9]{1,2} prior=[0-9]{1,2}$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V127_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$' "$RUNNER_TEMP/sc130.log" | sort -u || true
              grep -E '^V128_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$|^V128_ORIGINAL_RESTORE ok=[01]$|^V128_NATIVE_COUNTS start=[0-9]{1,2} pass=[0-9]{1,2} next=[0-9]{1,2} prior=[0-9]{1,2}$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V129_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$' "$RUNNER_TEMP/sc130.log" || true
              grep -E '^V130_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=[01] wire=[01] abi=[01] text=[01]$' "$RUNNER_TEMP/sc130.log" || true
              echo 'V130 interrupt-restore native continuation failed; private details withheld' >&2
              exit 1
            }
          grep -Fx 'V110_WRAPPER derived' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V110_WRAPPER syntax_ok' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V110_HARNESS_MARKERS count=4' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V130_NATIVE_EXIT ok=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V125_LATE_RESTORE ok=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V125_CANONICAL result=verified' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V127_OSINIT_RESTORE ok=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V128_ORIGINAL_RESTORE ok=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V130_STAGE native_test_passed' "$RUNNER_TEMP/sc130.log"
          grep -Eq '^V110_SC_STRLEN input=1 bounded=1 empty=[01]$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V110_SC_CONTINUE route=1 data=1 abi=1 prior=1 branch=2' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V111_SC_ASYNC_ENTRY route=1 copied=1 path=1 nonempty=1 abi=1 prior=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V113_FLUSH_ENTRY route=1 span=1 abi=1 prior=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V114_CACHE_SYSCALL route=1 flushed=1 abi=1 prior=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V115_VECTOR_ENTRY valid=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V115_DISABLE_ENTRY route=1 abi=1 prior=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V116_QUEUE_HELPER route=1 pointer=1 abi=1 prior=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V117_SEND_REG route=1 abi=1 prior=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V118_CTRL_READ_ENTRY route=1 abi=1 prior=1 msg=[01]$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V119_CTRL_WRITE_ENTRY route=1 reads=1 wire=1 abi=1 prior=1' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V120_X1_RESTORE_ENTRY route=1 sent=1 wire=1 abi=1 prior=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V121_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V121_NEXT_CALL pc=80545150 lr=80519934 route=1 wire=1 abi=1 text=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V122_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V122_NEXT_CALL pc=8054514c lr=804f1ed4 route=1 wire=1 abi=1 text=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V123_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V123_NEXT_CALL pc=80545150 lr=8051de54 route=1 wire=1 abi=1 text=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V124_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V124_NEXT_CALL pc=8051e5bc lr=8051e054 route=1 wire=1 abi=1 text=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V125_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V125_NEXT_CALL pc=80545150 lr=8051e05c route=1 wire=1 abi=1 text=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V127_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V127_NEXT_CALL pc=8052f830 lr=80520970 route=1 wire=1 abi=1 text=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V128_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V128_NEXT_CALL pc=805265ac lr=8052f84c route=1 wire=1 abi=1 text=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V129_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -Fx 'V129_NEXT_CALL pc=805265d4 lr=8052f92c route=1 wire=1 abi=1 text=1' "$RUNNER_TEMP/sc130.log"
          grep -E '^V130_NEXT_CALL pc=[0-9a-f]{8} lr=[0-9a-f]{8} route=1 wire=1 abi=1 text=1$' "$RUNNER_TEMP/sc130.log"
          grep -E '^BOOT_PROGRESS entry=0x8000403C pc=0x[0-9A-F]{8} stage=130$' "$RUNNER_TEMP/sc130.log"
          echo 'PASS: owner-original V130 executed interrupt-restore routine and reached successor'
      - name: Remove private owner and generated code
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals" "$RUNNER_TEMP/sc130.log"
