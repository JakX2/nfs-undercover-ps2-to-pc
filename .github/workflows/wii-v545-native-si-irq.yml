name: Wii Native SI Exception Return
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v545*'
      - '.github/workflows/wii-v545-native-si-irq.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-si-irq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned NWiiRecomp
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw545"
          git -C "$RUNNER_TEMP/nw545" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw545" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw545" checkout -q --detach FETCH_HEAD
      - name: Generate native split and nonsplit PPC interrupt/return tests
        run: bash research/native_recomp/run_v545_si_irq_return.sh "$RUNNER_TEMP/nw545"
