name: Wii V243 Original ISFS Callback Branch Bounds
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v243*'
      - '.github/workflows/wii-v243-original-callback-branch.yml'
permissions:
  contents: read
concurrency:
  group: wii-v243-original-callback-branch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v243:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate synthetic PowerPC branch decoder and private output gating
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v243_original_callback_branch.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v243_original_callback_branch.py' -v
  owner-original-elf-v243:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned private owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage owner original Wii ELF and DOL into private runner scratch
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          test "$staged" -eq 1
      - name: Audit original ELF SHA and bounded PowerPC callback edges
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v243_original_callback_branch.py \
            "$RUNNER_TEMP/originals/NfsMWRelease.elf" \
            > "$RUNNER_TEMP/v243.log" 2>&1 || {
              echo 'V243 original ELF audit failed; private diagnostics withheld' >&2
              exit 1
            }
          grep -E '^V243_ORIGINAL_BRANCH digest=1 callback=1 isfs=1 executable=1 separate=[01] same_section=[01] text=1 direct_isfs=[01] direct_entry=[01] direct_prologue=[01] lr_branch=[01] ctr_branch=[01]$' "$RUNNER_TEMP/v243.log"
          echo 'V243_ORIGINAL_ELF_BRANCH_AUDIT verified=1'
      - name: Erase private owner ELF, DOL, and audit log
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v243.log"
