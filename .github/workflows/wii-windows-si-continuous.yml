name: Wii Native Windows Continuous SI Startup

# One private original-DOL full-image build through the deepest existing
# native SI handler/callback path. No instruction-count target. This does
# not claim boot until a separately authenticated game-main/frame witness.
on:
  workflow_dispatch:
    inputs:
      native_rfi:
        description: "Run authentic original scheduler/OSLoadContext RFI and pending SI reentry on Windows"
        required: false
        type: boolean
        default: false
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-windows-si-continuous.yml'
      - 'research/native_recomp/windows_full_build_v426.py'
      - 'research/native_recomp/windows_transfer_prefix_v751.py'
      - 'research/native_recomp/windows_transfer_return_v752.py'
      - 'research/native_recomp/windows_transfer_suffix_v753.py'
      - 'research/native_recomp/windows_alarm_return_v754.py'
      - 'research/native_recomp/windows_alarm_suffix_v755.py'
      - 'research/native_recomp/windows_callback_prefix_v756.py'
      - 'research/native_recomp/windows_progression_matrix_v757.py'
      - 'research/native_recomp/test_v757_windows_progression_matrix.py'
      - 'research/native_recomp/windows_callback_time_v758.py'
      - 'research/native_recomp/test_v758_windows_callback_time.py'
      - 'research/native_recomp/windows_callback_frontier_v759.py'
      - 'research/native_recomp/test_v759_windows_callback_frontier.py'
      - 'research/native_recomp/windows_wireless_wrapper_v760.py'
      - 'research/native_recomp/test_v760_windows_wireless_wrapper.py'
      - 'research/native_recomp/windows_wireless_write_v761.py'
      - 'research/native_recomp/test_v761_windows_wireless_write.py'
      - 'research/native_recomp/windows_combined_callback_v762.py'
      - 'research/native_recomp/test_v762_windows_combined_callback.py'
      - 'research/native_recomp/windows_handler_return_v763.py'
      - 'research/native_recomp/test_v763_windows_handler_return.py'
      - 'research/native_recomp/prepare_v922_windows_scheduler_entry.py'
      - 'research/native_recomp/windows_scheduler_entry_v922.py'
      - 'research/native_recomp/test_v922_windows_scheduler_entry.py'
      - 'research/native_recomp/prepare_v923_windows_scheduler_return.py'
      - 'research/native_recomp/windows_scheduler_return_v923.py'
      - 'research/native_recomp/test_v923_windows_scheduler_return.py'
      - 'research/native_recomp/prepare_v924_windows_reschedule_entry.py'
      - 'research/native_recomp/windows_reschedule_entry_v924.py'
      - 'research/native_recomp/test_v924_windows_reschedule_entry.py'
      - 'research/native_recomp/prepare_v925_windows_reschedule_return.py'
      - 'research/native_recomp/windows_reschedule_return_v925.py'
      - 'research/native_recomp/test_v925_windows_reschedule_return.py'
      - 'research/native_recomp/prepare_windows_rfi_context_bridge.py'
      - 'research/native_recomp/test_windows_rfi_context_bridge.py'
      - 'research/native_recomp/prepare_windows_native_rfi_v926.py'
      - 'research/native_recomp/test_windows_native_rfi_v926.py'
      - 'research/native_recomp/windows_native_rfi_v926.py'
      - 'research/native_recomp/test_windows_native_rfi_audit_v926.py'
      - 'research/native_recomp/prepare_v921_windows_dispatcher_epilogue.py'
      - 'research/native_recomp/test_v921_windows_dispatcher_epilogue.py'
      - 'research/native_recomp/prepare_v868_handler_suffix.py'
      - 'research/native_recomp/prepare_v919_handler_epilogue.py'
      - 'research/native_recomp/prepare_v920_handler_return.py'
      - 'research/native_recomp/prepare_v863_combined_callback.py'
      - 'research/native_recomp/prepare_v861_wireless_write.py'
      - 'research/native_recomp/prepare_v847_wireless_wrapper.py'
      - 'research/native_recomp/prepare_v831_callback_frontier.py'
      - 'research/native_recomp/prepare_v813_callback_time.py'
      - 'research/native_recomp/prepare_v777_transfer_return.py'
      - 'research/native_recomp/prepare_v778_transfer_suffix.py'
      - 'research/native_recomp/prepare_v786_alarm_return.py'
      - 'research/native_recomp/prepare_v789_alarm_suffix.py'
      - 'research/native_recomp/prepare_v807_callback_prefix.py'
permissions:
  contents: read
concurrency:
  group: wii-windows-continuous-si-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-gates:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate full chain without proprietary executable
        shell: pwsh
        run: |
          $specs = @(
            'test_v757_windows_progression_matrix.py',
            'test_v758_windows_callback_time.py',
            'test_v759_windows_callback_frontier.py',
            'test_v760_windows_wireless_wrapper.py',
            'test_v761_windows_wireless_write.py',
            'test_v762_windows_combined_callback.py',
            'test_v763_windows_handler_return.py',
            'test_v922_windows_scheduler_entry.py',
            'test_v923_windows_scheduler_return.py',
            'test_v924_windows_reschedule_entry.py',
            'test_v925_windows_reschedule_return.py',
            'test_windows_rfi_context_bridge.py',
            'test_windows_native_rfi_v926.py',
            'test_windows_native_rfi_audit_v926.py',
            'test_v921_windows_dispatcher_epilogue.py',
            'test_v868_handler_suffix.py',
            'test_v919_handler_epilogue.py',
            'test_v920_handler_return.py',
            'test_v863_combined_callback.py',
            'test_v864_combined_callback.py',
            'test_v861_wireless_write.py',
            'test_v862_wireless_write_audit.py',
            'test_v847_wireless_wrapper.py',
            'test_v848_wireless_wrapper.py',
            'test_v831_callback_frontier.py',
            'test_v836_callback_frontier.py',
            'test_v813_callback_time.py',
            'test_v822_callback_time.py',
            'test_v752_windows_transfer_return.py',
            'test_v753_windows_transfer_suffix.py',
            'test_v754_windows_alarm_return.py',
            'test_v755_windows_alarm_suffix.py',
            'test_v756_windows_callback_prefix.py',
            'test_v777_transfer_return.py',
            'test_v807_callback_prefix.py'
          )
          foreach ($spec in $specs) {
            python -m unittest discover -s research/native_recomp -p $spec -v
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  owner-original-windows:
    needs: source-gates
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned private staging dependency
        run: python -m pip install --quiet 'gdown==5.2.0'
      - name: Stage and authenticate owner DOL and ELF
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        shell: pwsh
        run: |
          python owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py (Join-Path $env:RUNNER_TEMP 'native-si-input')
          exit $LASTEXITCODE
      - name: Fetch exact pinned NWiiRecomp
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'native-si-nwii'
          git init -q $root
          git -C $root remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C $root fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $root checkout -q --detach FETCH_HEAD
          exit $LASTEXITCODE
      - name: Build one full native Windows image and test successive original SI boundaries
        if: inputs.native_rfi != true
        shell: pwsh
        run: |
          $original = Join-Path $env:RUNNER_TEMP 'native-si-input'
          python research/native_recomp/windows_full_build_v426.py (Join-Path $env:RUNNER_TEMP 'native-si-nwii') (Join-Path $env:RUNNER_TEMP 'native-si-image') --owner-dol (Join-Path $original 'NfsMWRelease.dol') --owner-elf (Join-Path $original 'NfsMWRelease.elf') --owner-scope os-si-handler-time --owner-progression-matrix
          exit $LASTEXITCODE
      - name: Execute original native RFI and pending SI second vector on Windows
        if: inputs.native_rfi == true
        shell: pwsh
        run: |
          $original = Join-Path $env:RUNNER_TEMP 'native-si-input'
          python research/native_recomp/windows_full_build_v426.py (Join-Path $env:RUNNER_TEMP 'native-si-nwii') (Join-Path $env:RUNNER_TEMP 'native-si-image') --owner-dol (Join-Path $original 'NfsMWRelease.dol') --owner-elf (Join-Path $original 'NfsMWRelease.elf') --owner-scope os-si-handler-time --owner-native-rfi
          exit $LASTEXITCODE
      - name: Remove original code and private Windows build output
        if: always()
        shell: pwsh
        run: |
          foreach ($folder in @('native-si-input','native-si-nwii','native-si-image')) {
            $p = Join-Path $env:RUNNER_TEMP $folder
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
