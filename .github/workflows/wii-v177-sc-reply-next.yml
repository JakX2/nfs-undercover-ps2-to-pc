0-9]{1,3} changed=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$|^V176_SC_REPLY_NEXT clean=[01] wire=[01] queue=[01] guest=[01] caller=[01] coherent=[01] mapped=[01] before=[0-9]{1,3} status=[0-9]{1,3} changed=[01] osinit=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$|^V177_SC_REPLY_NEXT clean=[01] wire=[01] queue=[01] guest=[01] caller=[01] coherent=[01] mapped=[01] before=[0-9]{1,3} status=[0-9]{1,3} changed=[01] ipc=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$' "$RUNNER_TEMP/sc177.log" | sort -u || true
              code="$(grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc177.log" |
                tail -n 1 | cut -d= -f2 || true)"
              if [[ "$code" =~ ^[0-9]{3}$ && "$code" != "000" ]]; then
