          grep -E '^V174_SC_POST_REPLY_HELPER cleared=1 reply=[01] guest=1 caller=1 coherent=1 mapped=1 before=1 status=[0-9]{1,3} changed=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$' "$RUNNER_TEMP/sc177.log" | sort -u
          grep -Fx 'V175_SC_REPLY_NEXT verified=1' "$RUNNER_TEMP/sc177.log"
          grep -E '^V175_SC_REPLY_NEXT clean=1 wire=1 queue=1 guest=1 caller=1 coherent=1 mapped=1 before=1 status=[0-9]{1,3} changed=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$' "$RUNNER_TEMP/sc177.log" | sort -u
          grep -Fx 'V176_SC_REPLY_NEXT verified=1' "$RUNNER_TEMP/sc177.log"
          grep -E '^V176_SC_REPLY_NEXT clean=[01] wire=[01] queue=[01] guest=1 caller=1 coherent=1 mapped=1 before=1 status=[0-9]{1,3} changed=[01] osinit=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$' "$RUNNER_TEMP/sc177.log" | sort -u
          grep -Fx 'V177_SC_REPLY_NEXT verified=1' "$RUNNER_TEMP/sc177.log"
          grep -E '^V177_SC_REPLY_NEXT clean=[01] wire=[01] queue=[01] guest=1 caller=1 coherent=1 mapped=1 before=1 status=[0-9]{1,3} changed=[01] ipc=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$' "$RUNNER_TEMP/sc177.log" | sort -u
          echo 'PASS: original SC reply guest callee advanced to authentic next call'
      - name: Remove private owner and generated code
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals" "$RUNNER_TEMP/sc177.log"
