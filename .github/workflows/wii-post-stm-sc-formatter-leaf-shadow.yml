name: Wii SC Formatter Leaf Native Observer
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_post_stm_sc_leaf_shadow.h'
      - 'research/native_recomp/test_post_stm_sc_formatter_leaf_shadow.cpp'
      - '.github/workflows/wii-post-stm-sc-formatter-leaf-shadow.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for test in test_post_stm_sc_leaf_shadow test_post_stm_sc_formatter_leaf_shadow; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
