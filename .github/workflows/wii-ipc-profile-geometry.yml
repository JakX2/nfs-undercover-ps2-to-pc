name: Wii Private Original IPC Profiling Geometry
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/prepare_ipc_profile_geometry.py'
      - 'research/native_recomp/test_ipc_profile_geometry.py'
      - '.github/workflows/wii-ipc-profile-geometry.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-ipc-profile-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/prepare_ipc_profile_geometry.py
          python3 -m unittest discover -s research/native_recomp -p test_ipc_profile_geometry.py -v
  owner-geometry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require verified native ring enqueue and profiling contract
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          reqs=(
              Requirement(45848283031,'8a3916c9ddd2f0c0882d7a9bd5016e8174b003ec',
                          '.github/workflows/wii-v1410-ioctl-queue-owner.yml','owner-queue'),
              Requirement(45848705833,'ae9d2622be3de52a4b03def96a2956c0e0b78b55',
                          '.github/workflows/wii-v1415-profile-enqueue.yml','source'),
          )
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          if not all(verify(fetch,x) for x in reqs):raise SystemExit('IPC_PROFILE_GATE verified=0')
          print('IPC_PROFILE_GATE verified=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Authenticate original profiling helper and writable objects
        run: |
          python3 research/native_recomp/prepare_ipc_profile_geometry.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean private originals
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
