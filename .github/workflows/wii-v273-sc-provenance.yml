name: Wii V273 Original Wii SYSCONF Value Provenance
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v273*'
      - '.github/workflows/wii-v273-sc-provenance.yml'
permissions:
  contents: read
concurrency:
  group: wii-v273-sc-provenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v273:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V273 bounded PowerPC register-source analysis
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v273_sc_provenance.py research/native_recomp/test_v273_sc_provenance.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v273_sc_provenance.py' -v
          echo 'PASS: original-free V273 PowerPC status provenance'
  owner-original-v273:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V273 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Classify original Wii SYSCONF store-source provenance privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v273_sc_provenance.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v273.log" 2>&1 || {
            grep -E '^V273_PROVENANCE_AUDIT verified=0$' "$RUNNER_TEMP/v273.log" | sort -u || true
            echo 'V273 original PPC value provenance not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V273_PROVENANCE_AUDIT verified=1' "$RUNNER_TEMP/v273.log"
          grep -E '^V273_SC_PROVENANCE owners=6 stores=11 c0=[0-9]{1,3} c1=[0-9]{1,3} c2=[0-9]{1,3} c3=[0-9]{1,3} cother=[0-9]{1,3} status=[0-9]{1,3} load=[0-9]{1,3} unknown=[0-9]{1,3}$' "$RUNNER_TEMP/v273.log"
          test "$(grep -Ec '^V273_OWNER pc=[0-9a-f]{8} stores=[0-9]{1,3} c0=[0-9]{1,3} c1=[0-9]{1,3} c2=[0-9]{1,3} c3=[0-9]{1,3} cother=[0-9]{1,3} status=[0-9]{1,3} load=[0-9]{1,3} unknown=[0-9]{1,3}$' "$RUNNER_TEMP/v273.log")" -eq 6
          grep -E '^V273_OWNER pc=[0-9a-f]{8} stores=[0-9]{1,3} c0=[0-9]{1,3} c1=[0-9]{1,3} c2=[0-9]{1,3} c3=[0-9]{1,3} cother=[0-9]{1,3} status=[0-9]{1,3} load=[0-9]{1,3} unknown=[0-9]{1,3}$' "$RUNNER_TEMP/v273.log"
          echo 'PASS: V273 authenticated Wii SYSCONF value provenance classification'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v273.log"
