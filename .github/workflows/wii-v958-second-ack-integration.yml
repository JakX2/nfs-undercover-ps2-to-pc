name: Wii V958 Second ACK Integration Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v958*'
      - 'research/native_recomp/*v957*'
      - 'research/native_recomp/*v959*'
      - 'research/native_recomp/*v964*'
      - 'research/native_recomp/*v967*'
      - 'research/native_recomp/*v975*'
      - 'research/native_recomp/*v977*'
      - 'research/native_recomp/*v981*'
      - 'research/native_recomp/*v984*'
      - 'research/native_recomp/*v986*'
      - 'research/native_recomp/*v989*'
      - 'research/native_recomp/*v990*'
      - 'research/native_recomp/*v995*'
      - 'research/native_recomp/*v997*'
      - 'research/native_recomp/*v1000*'
      - 'research/native_recomp/wii_second_si_dispatch_v944.h'
      - '.github/workflows/wii-v958-second-ack-integration.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v958_second_ack.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v964_composed_mmio.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v967_post_ack.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v975_second_time.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v977_composed_time.py -v
          echo 'V977_LIVE_TIME valid=1 earlier_modes=2 refused=3 actual_binding=1 original_execution=0'
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_si_transfer_arguments_v981.cpp -o "$RUNNER_TEMP/v981"
          "$RUNNER_TEMP/v981"
          python3 -m unittest discover -s research/native_recomp -p test_v984_composed_frontier.py -v
          echo "V984_LIVE_FRONTIER valid=1 classified_not_admitted=2 refused=3 earlier_mode=1 original_execution=0"
          python3 -m unittest discover -s research/native_recomp -p test_v986_transfer_frontier.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v989_shared_time.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v990_composed_shared.py -v
          echo 'V990_LIVE_SHARED valid=1 prior_mode=1 refused=7 actual_binding=1 original_execution=0'
          python3 -m unittest discover -s research/native_recomp -p test_v995_success_frontier.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v997_composed_success_frontier.py -v
          echo 'V997_LIVE_SUCCESS_FRONTIER valid=2 classified_not_admitted=5 refused=2 earlier_mode=1 original_execution=0'
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_strict_ack_route_v1000.cpp -o "$RUNNER_TEMP/v1000"
          "$RUNNER_TEMP/v1000"
          bash -n research/native_recomp/run_v575_dsp_sc_launch.sh
          bash -n research/native_recomp/run_v572_full_sc_translation.sh
          bash -n research/native_recomp/run_v572_full_sc_translation.sh
          bash -n research/native_recomp/run_v575_dsp_sc_launch.sh
          python3 -m py_compile research/native_recomp/audit_v975_second_time.py
          python3 -m unittest discover -s research/native_recomp -p test_v951_second_dispatch.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v939_second_vector.py -v
          bash -n research/native_recomp/run_v572_full_sc_translation.sh
          bash -n research/native_recomp/run_v575_dsp_sc_launch.sh
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_second_si_dispatch_v944.cpp -o "$RUNNER_TEMP/v944"
          "$RUNNER_TEMP/v944"
          mkdir -p "$RUNNER_TEMP/v959"
          cp research/native_recomp/synthetic_second_ack_expectations_v959.h "$RUNNER_TEMP/v959/v958_private_second_ack.h"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -I"$RUNNER_TEMP/v959" -Iresearch/native_recomp research/native_recomp/test_second_ack_live_v959.cpp -o "$RUNNER_TEMP/v959/probe"
          env -u UNDERCOVER_V958_SECOND_ACK "$RUNNER_TEMP/v959/probe" default
          UNDERCOVER_V958_SECOND_ACK=1 "$RUNNER_TEMP/v959/probe" valid | grep -Ex 'V958_ACK_RESULT original_w1c=1 next_label=1 saved_fields=38 token_preserved=1 visits=6 reads=1 writes=1 boot_verified=0'
          for mode in frame guard entry return read write; do
            rc=0
            UNDERCOVER_V958_SECOND_ACK=1 "$RUNNER_TEMP/v959/probe" "$mode" > "$RUNNER_TEMP/v959/log" 2>&1 || rc=$?
            [[ "$rc" == 126 ]]
            grep -Ex 'V958_ACK_INVALID kind=[1-7] stage=[0-3] reason=[0-5] call_reason=[0-5] visits=[0-9]{1,4}' "$RUNNER_TEMP/v959/log"
          done
          echo 'V959_LIVE_ACK synthetic=1 valid=1 disabled=1 refused=6 original_execution=0'
