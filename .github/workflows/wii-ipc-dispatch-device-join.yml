name: Wii IPC Dispatch and Deferred Device Join
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/test_ipc_dispatch_device_join.cpp'
      - 'research/native_recomp/wii_ipc_dispatch_execution.h'
      - 'research/native_recomp/wii_ipc_ring_dispatch.h'
      - 'research/native_recomp/wii_stm_deferred_event_gate.h'
      - '.github/workflows/wii-ipc-dispatch-device-join.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cd research/native_recomp
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_ipc_dispatch_device_join.cpp -o /tmp/ipc_dispatch_device_join
          /tmp/ipc_dispatch_device_join
