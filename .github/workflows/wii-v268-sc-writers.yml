name: Wii V268 Original Wii SYSCONF Status Writers
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v268*'
      - '.github/workflows/wii-v268-sc-writers.yml'
permissions:
  contents: read
concurrency:
  group: wii-v268-sc-writers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v268:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V268 original-free SYSCONF direct-writer classifier
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v268_sc_status_writers.py research/native_recomp/test_v268_sc_status_writers.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v268_sc_status_writers.py' -v
          echo 'PASS: original-free V268 SYSCONF writer classifier'
  owner-original-v268:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V268 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Identify original Wii SYSCONF SDA store ownership privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v268_sc_status_writers.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v268.log" 2>&1 || {
            grep -E '^V268_SC_AUDIT verified=0$' "$RUNNER_TEMP/v268.log" | sort -u || true
            echo 'V268 direct status writer scan not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V268_SC_AUDIT verified=1' "$RUNNER_TEMP/v268.log"
          grep -E '^V268_SC_DIRECT sections=([1-9]|[1-2][0-9]|3[0-2]) read=[0-9]{1,5} write=[0-9]{1,5} byte_read=[0-9]{1,5} byte_write=[0-9]{1,5} helper_read=[0-9]{1,3} helper_write=[0-9]{1,3} writer_owners=[0-9]{1,4} unmapped=[0-9]{1,5}$' "$RUNNER_TEMP/v268.log"
          grep -E '^V268_SC_WRITER rank=[1-8] owner=[0-9a-f]{8} writes=[0-9]{1,4}$' "$RUNNER_TEMP/v268.log" || true
          echo 'PASS: V268 authenticated original Wii SYSCONF writer scan'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v268.log"
