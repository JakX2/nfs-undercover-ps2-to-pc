name: Wii V1404 Original Async Submit Prefix
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/V1404_IOCTL_SUBMIT.md'
      - 'research/native_recomp/prepare_v1404_ioctl_submit.py'
      - 'research/native_recomp/wii_ioctl_submit_prefix_v1403.h'
      - '.github/workflows/wii-v1404-ioctl-submit-owner.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-v1404-ioctl-submit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 -m py_compile research/native_recomp/prepare_v1404_ioctl_submit.py
          for test in test_ioctl_submit_prefix_v1403 test_ioctl_flush_tail_v1401 test_ioctl_first_flush_v1398 test_ioctl_construction_v1392 test_stm_deferred_event_gate test_open_cache_range_v649; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
  owner-prefix:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require verified original two cache flushes and submit entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          reqs=(
              Requirement(45841988118,'1d2bac101d2aae3794de1b9f5459eee56d8b39b5',
                          '.github/workflows/wii-v1401-ioctl-output-owner.yml','owner-output'),
              Requirement(45842664679,'0e9ba0f9a9bbf7650c1965743a5646c65557b479',
                          '.github/workflows/wii-v1403-submit-prefix.yml','source'),
              Requirement(45840288686,'a710fbc12b3bea7114697ba1449b9b5d4da324ec',
                          '.github/workflows/wii-v1398-ioctl-flush-owner.yml','owner-flush'),
              Requirement(45839363656,'b0b142983a8f58217c6a65a1789ddf9f1be82cfb',
                          '.github/workflows/wii-v1392-ioctl-construction-owner.yml','owner-construction'),
              Requirement(45836361710,'98a7d6ab28c7c739ba9a3e0c26f062904675db64',
                          '.github/workflows/wii-v1389-ioctl-allocation-retry.yml','owner-retry'),
              Requirement(45834913624,'729d545c6042b818bb99510fa16dbd1ea2703ff4',
                          '.github/workflows/wii-v1386-ioctl-prefix-owner.yml','owner-prefix'),
              Requirement(45833865115,'54fed29537c7fb4aafa43ec291aac1919f1536ee',
                          '.github/workflows/wii-v1385-async-ioctl.yml','owner-geometry'),
              Requirement(45833301504,'57e327302cbbe32d4142ce6e16ad70035dbd587c',
                          '.github/workflows/wii-v1383-stm-ioctl-owner.yml','owner-ioctl'),
              Requirement(45832698667,'421eb1478b8ccf31cb1d2254269883da972c63df',
                          '.github/workflows/wii-v1379-second-return-owner.yml','owner-open'),
              Requirement(45831706043,'cacbfc7f6b5103224cc926db6a1af8e4c6c3deaf',
                          '.github/workflows/wii-v1377-stm-tail.yml','owner-tail'),
          )
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:
              ok=all(verify(fetch,req) for req in reqs)
          except (OSError,ValueError,subprocess.SubprocessError):
              ok=False
          if not ok:raise SystemExit('V1383_OWNER_GATE verified=0')
          print('V1383_OWNER_GATE verified=1 prior_second_open=8 private_tail=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original submit prefix and queue initialization to header cache flush
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw1352"
          git -C "$RUNNER_TEMP/nw1352" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw1352" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw1352" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v1256_native_scheduler_postack.sh "$RUNNER_TEMP/nw1352" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --irq-stm-ioctl-submit-prefix
      - name: Clean private original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw1352"
