name: Wii Native Original BAT Mapper
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v634*'
      - '.github/workflows/wii-v634-ipc-client.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate corrected BAT witness and runner syntax
        run: |
          python3 -m unittest discover -s research/native_recomp -p test_v636_bat_calls.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_bat_mapping_witness_v590.cpp -o "$RUNNER_TEMP/bat"
          "$RUNNER_TEMP/bat"
          bash -n research/native_recomp/run_v634_native_bat_mapper.sh
  owner-native-bat:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Translate and execute original BAT mapper with production dispatcher
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw616"
          git -C "$RUNNER_TEMP/nw616" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw616" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw616" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v634_native_bat_mapper.sh "$RUNNER_TEMP/nw616" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean private original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw616"
