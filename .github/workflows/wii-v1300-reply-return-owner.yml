name: Wii V1300 Original IPC Reply Handler Return
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1300*'
      - 'research/native_recomp/V1302_REPLY_MMIO_DIAGNOSTIC.md'
      - 'research/native_recomp/V1308_REPLY_X2.md'
      - 'research/native_recomp/V1313_REPLY_CONTROL.md'
      - 'research/native_recomp/V1316_REPLY_HELPER.md'
      - 'research/native_recomp/V1318_REPLY_INSTRUCTION_DIAGNOSTIC.md'
      - 'research/native_recomp/V1323_HELPER_RAM.md'
      - '.github/workflows/wii-v1300-reply-return-owner.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-v1300-return-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate private fixture geometry and runner syntax
        run: |
          python3 -m unittest discover -s research/native_recomp -p test_v626_ipc_fixture.py -v
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 -m unittest discover -s research/native_recomp -p test_v1256_scheduler_fixture.py -v
          python3 -m py_compile research/native_recomp/prepare_v1259_scheduler_vector.py
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_scheduler_irq_entry_v1259.cpp -o /tmp/v1259-test
          /tmp/v1259-test
          python3 -m unittest discover -s research/native_recomp -p test_v1260_scheduler_vector.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Iresearch/native_recomp research/native_recomp/test_external_return_v706.cpp -o /tmp/v706-test
          /tmp/v706-test
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_initialized_dol_data_v1264.cpp -o /tmp/v1264-data
          /tmp/v1264-data
          python3 -m unittest discover -s research/native_recomp -p test_v1261_ipc_dispatch.py -v
          python3 -m py_compile research/native_recomp/prepare_v1266_joined_ack.py
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DUNDERCOVER_TEST_JOINED_ACK -Iresearch/native_recomp research/native_recomp/test_ipc_dispatch_contract_v1265.cpp -o /tmp/v1267-ack
          /tmp/v1267-ack
          python3 -m unittest discover -s research/native_recomp -p test_v1270_ipc_epilogue.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_live_epilogue_source_v1269.cpp -o /tmp/v1269
          /tmp/v1269
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_live_epilogue_select_v1284.cpp -o /tmp/v1284
          /tmp/v1284
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_scheduler_reply_irq_v1268.cpp -o /tmp/v1268
          /tmp/v1268
          python3 -m unittest discover -s research/native_recomp -p test_v1279_reply_geometry.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v1281_reply_fixture.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v1276_isolated_dcbi.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_cold_reply_consume_v1278.cpp -o /tmp/v1278
          /tmp/v1278
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DUNDERCOVER_TEST_JOINED_ACK -DUNDERCOVER_TEST_REPLY_PROCESSOR -Iresearch/native_recomp research/native_recomp/test_ipc_dispatch_contract_v1265.cpp -o /tmp/v1280
          /tmp/v1280
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_word_mmio_completion_v1296.cpp -o /tmp/v1296
          /tmp/v1296
          python3 -m unittest discover -s research/native_recomp -p test_v1289_wake_fixture.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DUNDERCOVER_TEST_JOINED_ACK -DUNDERCOVER_TEST_REPLY_PROCESSOR -DUNDERCOVER_TEST_WAKE_READY -Iresearch/native_recomp research/native_recomp/test_ipc_dispatch_contract_v1265.cpp -o /tmp/v1288
          /tmp/v1288
          python3 -m unittest discover -s research/native_recomp -p test_v1292_nested_wake.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DUNDERCOVER_TEST_JOINED_ACK -DUNDERCOVER_TEST_REPLY_PROCESSOR -DUNDERCOVER_TEST_WAKE_READY -DUNDERCOVER_TEST_NESTED_WAKE -Iresearch/native_recomp research/native_recomp/test_ipc_dispatch_contract_v1265.cpp -o /tmp/v1291
          /tmp/v1291
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DUNDERCOVER_TEST_JOINED_ACK -DUNDERCOVER_TEST_REPLY_PROCESSOR -DUNDERCOVER_TEST_WAKE_READY -DUNDERCOVER_TEST_NESTED_WAKE -DUNDERCOVER_TEST_REPLY_COMPLETION -DUNDERCOVER_TEST_REPLY_RETURN -Iresearch/native_recomp research/native_recomp/test_ipc_dispatch_contract_v1265.cpp -o /tmp/v1298
          /tmp/v1298
          python3 -m unittest discover -s research/native_recomp -p test_v1299_reply_return.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v1316_reply_helper.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_private_expansion_seed_v1323.cpp -o /tmp/v1323
          /tmp/v1323
          printf '#include "wii_joined_ipc_ack_v1266.h"\nint main(){}\n' | g++ -x c++ -std=c++20 -Wall -Wextra -Werror -Iresearch/native_recomp -fsyntax-only -
  owner-reply-return:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require verified prior original nested wake return
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          req=Requirement(45810356227,'fb8dadfc71293a048fe6b668adee4a2ed33011ea',
                          '.github/workflows/wii-v1292-nested-wake-owner.yml','owner-nested-wake')
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:
              ok=verify(fetch,req)
          except (OSError,ValueError,subprocess.SubprocessError):
              ok=False
          if not ok:raise SystemExit('V1300_OWNER_GATE verified=0')
          print('V1297_OWNER_GATE verified=1 prior_original_wake_return=8')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original reply processor and IRQ handler returns
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw1300"
          git -C "$RUNNER_TEMP/nw1300" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw1300" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw1300" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v1256_native_scheduler_postack.sh "$RUNNER_TEMP/nw1300" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --irq-reply-handler-helper
      - name: Clean private original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw1300"
