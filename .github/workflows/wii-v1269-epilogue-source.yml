name: Wii V1269 Pending Epilogue Source Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/test_live_epilogue_source_v1269.cpp'
      - '.github/workflows/wii-v1269-epilogue-source.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test source-specific pending original epilogue witness
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_live_epilogue_source_v1269.cpp -o "$RUNNER_TEMP/v1269"
          "$RUNNER_TEMP/v1269"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_pending_reentry_v932.cpp -o "$RUNNER_TEMP/v932"
          "$RUNNER_TEMP/v932"
