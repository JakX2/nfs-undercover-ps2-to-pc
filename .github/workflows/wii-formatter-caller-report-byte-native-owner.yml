name: Wii Original Formatter 118 Report Byte Native Continuation
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-caller-report-byte-native-owner.yml'
permissions:
  contents: read
  actions: read
# Serializes after the 117 native callee-entry job; the private 118 owner must
# not run before its pinned original-code predecessor has finished.
concurrency:
  group: wii-formatter-return-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 -m py_compile research/native_recomp/prepare_formatter_nested_fixture.py research/native_recomp/prepare_formatter_next_entry_report_byte_contract.py
          python3 research/native_recomp/test_formatter_next_report_byte_fixture.py
          python3 research/native_recomp/test_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_nested_log.py
          python3 research/native_recomp/prepare_formatter_next_entry_report_byte_contract.py --self-test
          for test in test_post_stm_sc_report test_formatter_report_byte_transition test_formatter_nested_join; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
  owner-report-byte:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require pinned original 117 native entry and independently authenticated byte
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          def fetch(endpoint):
              raw=subprocess.check_output(
                  ['gh','api',f"repos/{os.environ['GH_REPO']}/{endpoint}"],
                  stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:
              run_id=45980776459
              prior=fetch(f'actions/runs/{run_id}')
              job=fetch('actions/jobs/140443933734')
              ok=(prior.get('id')==run_id
                  and prior.get('head_sha')=='71704bb3acf05122e538156ce6e63065657058b9'
                  and prior.get('head_branch')=='research/wii-native-recomp-preflight'
                  and prior.get('path')=='.github/workflows/wii-formatter-caller-next-entry-retry.yml'
                  and prior.get('run_attempt')==1
                  and prior.get('status')=='completed' and prior.get('conclusion')=='success'
                  and job.get('id')==140443933734 and job.get('run_id')==run_id
                  and job.get('run_attempt')==1
                  and job.get('name')=='owner-caller-next-entry'
                  and job.get('status')=='completed' and job.get('conclusion')=='success')
              geometry=Requirement(
                  45970804310,'aefa484d8fcd55c26db75fd639aa9df3d7384250',
                  '.github/workflows/wii-formatter-next-entry-report-byte-contract.yml',
                  'owner-geometry')
              ok=ok and verify(fetch,geometry)
          except (OSError,ValueError,TypeError,KeyError,subprocess.SubprocessError):
              ok=False
          if not ok:raise SystemExit('FORMATTER_REPORT_BYTE_OWNER_GATE verified=0')
          print('FORMATTER_REPORT_BYTE_OWNER_GATE verified=1 original_117=1 byte_contract=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage authenticated private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original 118-instruction path and verify actual native byte load
        env:
          UNDERCOVER_EXPECTED_CALLER_INTEGER_COUNT: '2'
          UNDERCOVER_EXPECTED_CALLER_POST_INTEGER_COUNT: '1'
          UNDERCOVER_EXPECTED_CALLER_MIXED_INTEGERS: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_TAKEN: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_FALLTHROUGH: '1'
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw1352"
          git -C "$RUNNER_TEMP/nw1352" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw1352" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw1352" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v1256_native_scheduler_postack.sh "$RUNNER_TEMP/nw1352" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --formatter-nested-caller-report-byte
      - name: Clean original files and generated private code
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw1352"
