name: Wii V936 Pending IRQ Integrity Checks
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_pending_external_reentry_v932.h'
      - 'research/native_recomp/wii_external_return_v706.h'
      - 'research/native_recomp/wii_live_epilogue_v762.h'
      - 'research/native_recomp/test_pending_reentry_v932.cpp'
      - '.github/workflows/wii-v936-pending-integrity.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for n in pending_reentry_v932 external_return_v706 saved_context_join_v921; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/test_$n.cpp" -o "$RUNNER_TEMP/$n"
            "$RUNNER_TEMP/$n"
          done
          python3 -m unittest discover -s research/native_recomp -p test_v932_pending_rfi.py -v
