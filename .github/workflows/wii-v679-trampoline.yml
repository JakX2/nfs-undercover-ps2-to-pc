name: Wii V679 Native Register Save and Backward Tail Control
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v679*'
      - '.github/workflows/wii-v679-trampoline.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Translate and execute independent register-save assembly
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw679"
          git -C "$RUNNER_TEMP/nw679" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw679" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw679" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_trampoline_v679.sh "$RUNNER_TEMP/nw679"
