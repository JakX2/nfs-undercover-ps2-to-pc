name: Wii V895 Original SITransfer Callee Prefix
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v895*'
      - '.github/workflows/wii-v895-transfer-post-time.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v797_callback_prefix.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_callback_prefix_v800.cpp -o "$RUNNER_TEMP/v872"
          "$RUNNER_TEMP/v872"
          python3 -m unittest discover -s research/native_recomp -p test_v874_transfer_disable.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v878_transfer_choice.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v881_packet_choice.py -v
          bash -n research/native_recomp/run_owner_transfer_callee_v895.sh
  owner-context:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original selected callee prefix
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw893"
          git -C "$RUNNER_TEMP/nw893" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw893" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw893" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_owner_transfer_callee_v895.sh "$RUNNER_TEMP/nw893" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Remove private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw893"
