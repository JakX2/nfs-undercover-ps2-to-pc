name: Wii V831 Live Callback Wireless Frontier Preflight
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v831*'
      - 'research/native_recomp/*v836*'
      - 'research/native_recomp/*v847*'
      - 'research/native_recomp/*v829*'
      - '.github/workflows/wii-v831-callback-frontier.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate witness and installer
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v831_callback_frontier.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v836_callback_frontier.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v847_wireless_wrapper.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v848_wireless_wrapper.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_callback_frontier_v829.cpp -o "$RUNNER_TEMP/v829"
          "$RUNNER_TEMP/v829"
          bash -n research/native_recomp/run_v572_full_sc_translation.sh
          bash -n research/native_recomp/run_v575_dsp_sc_launch.sh
  owner-preflight:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Compose private complete image through wireless wrapper boundary
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw831"
          git -C "$RUNNER_TEMP/nw831" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw831" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw831" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v572_full_sc_translation.sh "$RUNNER_TEMP/nw831" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --prepare-si-wireless-wrapper
      - name: Clean private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw831"
  owner-execution:
    needs: owner-preflight
    if: >-
      github.ref == 'refs/heads/research/wii-native-recomp-preflight' &&
      vars.WII_GHIDRA_PRIVATE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'V839 launch live wireless frontier') ||
      contains(github.event.head_commit.message, 'V854 launch live wireless wrapper'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original complete image through selected wireless boundary
        env:
          LIVE_WRAPPER: ${{ contains(github.event.head_commit.message, 'V854 launch live wireless wrapper') }}
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw839"
          git -C "$RUNNER_TEMP/nw839" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw839" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw839" checkout -q --detach FETCH_HEAD
          mode=--run-si-callback-frontier
          if [ "$LIVE_WRAPPER" = true ]; then mode=--run-si-wireless-wrapper; fi
          bash research/native_recomp/run_v572_full_sc_translation.sh "$RUNNER_TEMP/nw839" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" "$mode"
      - name: Clean private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw839"
