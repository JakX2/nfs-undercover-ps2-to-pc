name: Wii Deferred Active Context Return Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_deferred_active_return.h'
      - 'research/native_recomp/test_deferred_active_return.cpp'
      - 'research/native_recomp/wii_stm_resumed_restore.h'
      - 'research/native_recomp/test_stm_resumed_restore.cpp'
      - 'research/native_recomp/wii_stm_final_return.h'
      - 'research/native_recomp/test_stm_final_return.cpp'
      - 'research/native_recomp/wii_post_stm_sc_entry.h'
      - 'research/native_recomp/test_post_stm_sc_entry.cpp'
      - 'research/native_recomp/wii_post_stm_sc_disable.h'
      - 'research/native_recomp/test_post_stm_sc_disable.cpp'
      - 'research/native_recomp/wii_post_stm_sc_decision.h'
      - 'research/native_recomp/test_post_stm_sc_decision.cpp'
      - 'research/native_recomp/wii_post_stm_sc_restore.h'
      - 'research/native_recomp/test_post_stm_sc_restore.cpp'
      - 'research/native_recomp/wii_post_stm_sc_version.h'
      - 'research/native_recomp/test_post_stm_sc_version.cpp'
      - 'research/native_recomp/wii_post_stm_sc_report.h'
      - 'research/native_recomp/test_post_stm_sc_report.cpp'
      - 'research/native_recomp/wii_post_stm_sc_queue.h'
      - 'research/native_recomp/test_post_stm_sc_queue.cpp'
      - '.github/workflows/wii-deferred-active-return.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cd research/native_recomp
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_deferred_active_return.cpp -o /tmp/deferred_active_return
          /tmp/deferred_active_return
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_live_epilogue_source_v1269.cpp -o /tmp/live_epilogue
          /tmp/live_epilogue
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_stm_resumed_restore.cpp -o /tmp/stm_resumed_restore
          /tmp/stm_resumed_restore
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_stm_final_return.cpp -o /tmp/stm_final_return
          /tmp/stm_final_return
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_post_stm_sc_entry.cpp -o /tmp/post_stm_sc_entry
          /tmp/post_stm_sc_entry
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_post_stm_sc_disable.cpp -o /tmp/post_stm_sc_disable
          /tmp/post_stm_sc_disable
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_post_stm_sc_decision.cpp -o /tmp/post_stm_sc_decision
          /tmp/post_stm_sc_decision
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_post_stm_sc_restore.cpp -o /tmp/post_stm_sc_restore
          /tmp/post_stm_sc_restore
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_post_stm_sc_version.cpp -o /tmp/post_stm_sc_version
          /tmp/post_stm_sc_version
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_post_stm_sc_report.cpp -o /tmp/post_stm_sc_report
          /tmp/post_stm_sc_report
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_post_stm_sc_queue.cpp -o /tmp/post_stm_sc_queue
          /tmp/post_stm_sc_queue
