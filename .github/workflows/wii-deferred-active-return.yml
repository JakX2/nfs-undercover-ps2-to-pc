name: Wii Deferred Active Context Return Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_deferred_active_return.h'
      - 'research/native_recomp/test_deferred_active_return.cpp'
      - '.github/workflows/wii-deferred-active-return.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cd research/native_recomp
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie test_deferred_active_return.cpp -o /tmp/deferred_active_return
          /tmp/deferred_active_return
