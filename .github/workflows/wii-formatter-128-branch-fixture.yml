name: Wii Original Formatter 128 Conditional Branch Private Fixture
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-128-branch-fixture.yml'
      - 'research/native_recomp/prepare_formatter_branch_128_fixture.py'
      - 'research/native_recomp/audit_formatter_branch_128_decision.py'
      - 'research/native_recomp/audit_formatter_branch_128_geometry.py'
      - 'research/native_recomp/wii_formatter_conditional_branch.h'
      - 'research/native_recomp/test_formatter_conditional_branch.cpp'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-128-branch-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/prepare_formatter_branch_128_fixture.py research/native_recomp/audit_formatter_branch_128_decision.py research/native_recomp/audit_formatter_branch_128_geometry.py
          python3 research/native_recomp/audit_formatter_branch_128_decision.py --self-test
          python3 research/native_recomp/audit_formatter_branch_128_geometry.py --self-test
          python3 research/native_recomp/prepare_formatter_branch_128_fixture.py --self-test
          for flags in '-O2 -DNDEBUG' '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie'; do
            g++ -std=c++20 $flags -Wall -Wextra -Werror -pedantic -Iresearch/native_recomp research/native_recomp/test_formatter_conditional_branch.cpp -o /tmp/test_formatter_conditional_branch
            /tmp/test_formatter_conditional_branch
          done
  prerequisites:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.pins.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: Require 127 original native success and 128 branch geometry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          from verify_v1062_owner_gate import Requirement, verify
          proofs = (
              Requirement(
                  46079982789,
                  '737b4d7d7c628f4ded8f6656d90a9c7d33b2a4fe',
                  '.github/workflows/wii-formatter-caller-report-sixth-immediate-native-owner.yml',
                  'owner-sixth-immediate'),
              Requirement(
                  46080956269,
                  'e6daeff41441991ffdd0d6b059df0684eac43bb8',
                  '.github/workflows/wii-formatter-128-successor-audit.yml',
                  'owner-provenance'),
          )
          def fetch(endpoint):
              raw = subprocess.check_output(
                  ['gh', 'api', f"repos/{os.environ['GH_REPO']}/{endpoint}"],
                  stderr=subprocess.DEVNULL, timeout=30)
              if len(raw) > 2 * 1024 * 1024:
                  raise ValueError('metadata size')
              return json.loads(raw)
          try:
              ok = all(verify(fetch, proof) for proof in proofs)
          except (OSError, ValueError, TypeError, KeyError, subprocess.SubprocessError):
              ok = False
          print('eligible=' + str(ok).lower())
          PY
      - name: Record fail-closed eligibility
        env:
          ELIGIBLE: ${{ steps.pins.outputs.eligible }}
        run: |
          test "$ELIGIBLE" = true || {
            echo "FORMATTER_128_BRANCH_OWNER_GATE verified=0"
            exit 1
          }
          echo "FORMATTER_128_BRANCH_OWNER_GATE verified=1 original_127=1 branch_geometry=1"
  owner-fixture:
    needs: [original-free, prerequisites]
    if: needs.prerequisites.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage authenticated private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Authenticate private original 128 selected branch edge without executing it
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/prepare_formatter_branch_128_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Remove original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$GITHUB_WORKSPACE/owner-staging"
