name: Wii V1327 Native Idle Scheduler Route
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1327*'
      - '.github/workflows/wii-v1327-idle-route.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_idle_route_v1327.cpp -o /tmp/v1327
          /tmp/v1327
