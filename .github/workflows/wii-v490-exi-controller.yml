name: Wii Native EXI Controller
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v489*'
      - 'research/native_recomp/*v490*'
      - 'research/native_recomp/*v493*'
      - 'research/native_recomp/*v494*'
      - 'research/native_recomp/*v495*'
      - 'research/native_recomp/*v497*'
      - 'research/native_recomp/*v498*'
      - 'research/native_recomp/*v501*'
      - 'research/native_recomp/*v502*'
      - 'research/native_recomp/*v511*'
      - 'research/native_recomp/*v512*'
      - 'research/native_recomp/*v514*'
      - 'research/native_recomp/*v515*'
      - '.github/workflows/wii-v490-exi-controller.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test independent EXI controller with sanitizers
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_controller_v489.cpp -o "$RUNNER_TEMP/v489-exi"
          "$RUNNER_TEMP/v489-exi"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_dma_v493.cpp -o "$RUNNER_TEMP/v493-dma"
          "$RUNNER_TEMP/v493-dma"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_mx_device_v494.cpp -o "$RUNNER_TEMP/v494-mx"
          "$RUNNER_TEMP/v494-mx"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_endpoint_scheduler_v495.cpp -o "$RUNNER_TEMP/v495-schedule"
          "$RUNNER_TEMP/v495-schedule"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_profile_v501.cpp -o "$RUNNER_TEMP/v501-profile"
          "$RUNNER_TEMP/v501-profile"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_si_type_scheduler_v514.cpp -o "$RUNNER_TEMP/v514-si-scheduler"
          "$RUNNER_TEMP/v514-si-scheduler"
      - name: Fetch exact pinned NWiiRecomp
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v490"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$root" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
      - name: Exercise real MMU wrappers with and without EXI controller
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v490"
          rt="$root/nWiiRuntime"
          mkdir -p "$rt/include/undercover"
          cp research/native_recomp/wii_exception_vector_witness_v457.h "$rt/include/undercover/"
          python3 research/native_recomp/apply_irq_bootstrap_v475.py "$root"
          python3 research/native_recomp/apply_irq_banks_v481.py "$root"
          python3 research/native_recomp/apply_exi_controller_v490.py "$root"
          python3 research/native_recomp/apply_exi_controller_v490.py "$root"
          g++ -std=c++20 -O1 -ffunction-sections -fdata-sections -fsanitize=address,undefined -fno-pie -no-pie \
            -I"$rt/include" research/native_recomp/test_nwii_exi_controller_v490.cpp \
            "$rt/src/core/os_hle_stubs.cpp" "$rt/src/hw/hw_pi.cpp" "$rt/src/hw/hw_ipc.cpp" \
            "$rt/src/hw/mmio_dispatcher.cpp" -Wl,--gc-sections -o "$RUNNER_TEMP/v490-pinned"
          "$RUNNER_TEMP/v490-pinned"
      - name: Exercise native instruction-boundary SRAM device against actual MMU and PI
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v490"
          rt="$root/nWiiRuntime"
          python3 research/native_recomp/apply_native_tick_v438.py "$root"
          python3 research/native_recomp/apply_exi_tick_v497.py "$root" emitter
          python3 research/native_recomp/apply_exi_tick_v497.py "$root" emitter
          python3 research/native_recomp/apply_exi_tick_v497.py "$root" runtime
          python3 research/native_recomp/apply_exi_tick_v497.py "$root" runtime
          g++ -std=c++20 -O1 -ffunction-sections -fdata-sections -fsanitize=address,undefined -fno-pie -no-pie \
            -I"$rt/include" research/native_recomp/test_nwii_exi_tick_v497.cpp \
            "$rt/src/core/os_hle_stubs.cpp" "$rt/src/hw/hw_pi.cpp" "$rt/src/hw/hw_ipc.cpp" \
            "$rt/src/hw/mmio_dispatcher.cpp" -Wl,--gc-sections -o "$RUNNER_TEMP/v497-pinned"
          "$RUNNER_TEMP/v497-pinned"
      - name: Translate synthetic PPC loop and execute EXI scheduler from emitted labels
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v490"
          rt="$root/nWiiRuntime"
          python3 research/native_recomp/apply_nonsplit_dispatch_v15.py "$root"
          inc=(-I"$rt/include" -I"$root/nWiiAnalyzer/include" -I"$root/nWiiRecomp/include")
          g++ -std=c++20 -O2 -Wno-unused-variable -Wno-sign-compare "${inc[@]}" \
            research/native_recomp/generate_native_tick_v438.cpp "$rt/src/core/loader.cpp" \
            "$root/nWiiAnalyzer/src/analyzer.cpp" "$root/nWiiAnalyzer/src/dolphin_sigdb.cpp" \
            "$root/nWiiAnalyzer/src/signature_scanner.cpp" "$root/nWiiRecomp/src/recompiler.cpp" \
            "$root/nWiiRecomp/src/symbols.cpp" -o "$RUNNER_TEMP/v498-generator"
          for mode in nonsplit split; do
            dir="$RUNNER_TEMP/v498-$mode"
            mkdir "$dir"
            "$RUNNER_TEMP/v498-generator" "$dir" "$mode"
            flags=()
            if [[ "$mode" == split ]]; then flags=(-DV438_SPLIT -I"$dir"); fi
            g++ -std=c++20 -O1 -pthread -fsanitize=address,undefined -fno-pie -no-pie "${inc[@]}" "${flags[@]}" \
              research/native_recomp/test_native_exi_aot_v498.cpp "$dir"/*.cpp \
              "$rt/src/core/os_hle_stubs.cpp" "$rt/src/hw/mmio_dispatcher.cpp" \
              "$rt/src/hw/hw_pi.cpp" "$rt/src/hw/hw_ipc.cpp" -o "$dir/native"
            timeout 20s "$dir/native"
          done
      - name: Verify opt-in host profile against actual MMU and runtime patch seams
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v490"
          rt="$root/nWiiRuntime"
          python3 research/native_recomp/apply_exi_profile_v501.py "$root"
          python3 research/native_recomp/apply_exi_profile_v501.py "$root"
          g++ -std=c++20 -O1 -ffunction-sections -fdata-sections -fsanitize=address,undefined -fno-pie -no-pie \
            -I"$rt/include" research/native_recomp/test_nwii_exi_profile_v502.cpp \
            "$rt/src/core/os_hle_stubs.cpp" "$rt/src/hw/hw_pi.cpp" "$rt/src/hw/hw_ipc.cpp" \
            "$rt/src/hw/mmio_dispatcher.cpp" -Wl,--gc-sections -o "$RUNNER_TEMP/v502-pinned"
          "$RUNNER_TEMP/v502-pinned"
      - name: Verify native SI binding and actual MMU shared PI interrupt
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v490"
          rt="$root/nWiiRuntime"
          python3 research/native_recomp/apply_si_binding_v512.py "$root"
          python3 research/native_recomp/apply_si_binding_v512.py "$root"
          g++ -std=c++20 -O1 -ffunction-sections -fdata-sections -fsanitize=address,undefined -fno-pie -no-pie \
            -I"$rt/include" research/native_recomp/test_nwii_si_binding_v512.cpp \
            "$rt/src/core/os_hle_stubs.cpp" "$rt/src/hw/hw_pi.cpp" "$rt/src/hw/hw_ipc.cpp" \
            "$rt/src/hw/mmio_dispatcher.cpp" -Wl,--gc-sections -o "$RUNNER_TEMP/v512-pinned"
          "$RUNNER_TEMP/v512-pinned"
      - name: Translate synthetic PPC and verify SI scheduler on both native emission paths
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nwii-v490"
          rt="$root/nWiiRuntime"
          python3 research/native_recomp/apply_si_tick_v515.py "$root" emitter
          python3 research/native_recomp/apply_si_tick_v515.py "$root" emitter
          python3 research/native_recomp/apply_si_tick_v515.py "$root" runtime
          python3 research/native_recomp/apply_si_tick_v515.py "$root" runtime
          inc=(-I"$rt/include" -I"$root/nWiiAnalyzer/include" -I"$root/nWiiRecomp/include")
          g++ -std=c++20 -O2 -Wno-unused-variable -Wno-sign-compare "${inc[@]}" \
            research/native_recomp/generate_native_tick_v438.cpp "$rt/src/core/loader.cpp" \
            "$root/nWiiAnalyzer/src/analyzer.cpp" "$root/nWiiAnalyzer/src/dolphin_sigdb.cpp" \
            "$root/nWiiAnalyzer/src/signature_scanner.cpp" "$root/nWiiRecomp/src/recompiler.cpp" \
            "$root/nWiiRecomp/src/symbols.cpp" -o "$RUNNER_TEMP/v515-generator"
          for mode in nonsplit split; do
            dir="$RUNNER_TEMP/v515-$mode"
            mkdir "$dir"
            "$RUNNER_TEMP/v515-generator" "$dir" "$mode"
            flags=()
            if [[ "$mode" == split ]]; then flags=(-DV438_SPLIT -I"$dir"); fi
            g++ -std=c++20 -O1 -pthread -fsanitize=address,undefined -fno-pie -no-pie "${inc[@]}" "${flags[@]}" \
              research/native_recomp/test_native_si_aot_v515.cpp "$dir"/*.cpp \
              "$rt/src/core/os_hle_stubs.cpp" "$rt/src/hw/mmio_dispatcher.cpp" \
              "$rt/src/hw/hw_pi.cpp" "$rt/src/hw/hw_ipc.cpp" -o "$dir/native"
            timeout 20s "$dir/native"
          done
