name: Wii V206 Original Second IOS Y2 Post-Flag PowerPC Continuation
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v206*'
      - '.github/workflows/wii-v206-sc-y2-post-flag.yml'
permissions:
  contents: read
concurrency:
  # Dedicated concurrency namespace avoids blocking corrected diagnostics behind
  # a historical V182 test run with excessive assertion-catalog derivations.
  group: wii-v206-sc-y2-post-flag-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v206:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test V206 original second Y2 post-flag guest successor
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/derive_v206_sc_y2_post_flag_harness.py research/native_recomp/derive_v206_sc_y2_post_flag_runner.py research/native_recomp/test_v206_sc_y2_post_flag.py research/native_recomp/diagnose_v206_sc_y2_post_flag.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v206_sc_y2_post_flag.py' -v
          bash -n research/native_recomp/run_v206_sc_y2_post_flag.sh
          python3 research/native_recomp/diagnose_v206_sc_y2_post_flag.py 588
  owner-y2-post-flag-v206:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'Owner Wii staging failed after three bounded attempts' >&2
            exit 1
          fi
      - name: Independently verify V125 private fixture restoration
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py \
            "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Prepare pinned original-free NWii runtime and cache traces
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_perf_patch_guards_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/verify_perf_combo_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_hid4_continuous_patch_v30.py"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_continuous_patch_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_trace_guards_v44.py"
          python3 "$here/apply_jump_table_v58.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_jump_table_patch_v58.py"
          python3 "$here/apply_dcbi_v60.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hollywood_mmio_v62.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_native_lowmem_v63.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_bat_registers_v65.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbz_v67.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_exception_sprg.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_mtmsr_resume_v74.py" "$RUNNER_TEMP/nwii"
          echo 'PASS: V72 focused runtime prerequisites prepared and original-free source guards passed'
      - name: Execute original second Y2 handler after both Hollywood W1C writes
        run: |
          set -euo pipefail
          umask 077
          bash research/native_recomp/run_v206_sc_y2_post_flag.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/sc206.log" 2>&1 || {
              grep -E '^V178_DERIVATION result=failed kind=(missing_anchor|ambiguous_anchor|python_syntax|import_error|other_value_error|other_error)$|^V178_PUBLIC_PREFLIGHT_ERROR step=(runtime_verify|cache_verify|exi_compile|exi_test|jump_patch|jump_test|tail_roots|backward_tails|tail_test|sram_compile|sram_test|hollywood_test|vector_test|lowmem_patch|dsp_test|bat_test|dcbz_patch|dcbz_test|preflight_done) count=[0-9]{1,3}$|^V110_WRAPPER (derived|syntax_ok|syntax_failed)$|^V140_SC_IRQ_ENTRY pending=[01] vector=[01] saved=[01] regs=[01] queued=[01]$|^V186_NATIVE_SUCCESS pre=[0-9]{1,2} ack=[0-9]{1,2} state=[0-9]{1,2} previous=[0-9]{1,2}$|^V186_BUILD unit=(harness|generated|loader)$|^V186_BUILD (link|execute)=1$|^V186_PUBLIC_ASSERTION id=[0-9]{4} label=[a-zA-Z0-9_ .,/:()\-]{1,180}$|^V185_PUBLIC_ASSERTION id=[0-9]{4} label=[a-zA-Z0-9_ .,/:()\-]{1,180}$|^V184_PUBLIC_ASSERTION id=[0-9]{4} label=[a-zA-Z0-9_ .,/:()\-]{1,180}$|^V183_PUBLIC_ASSERTION id=[0-9]{4} label=[a-zA-Z0-9_ .,/:()\-]{1,180}$|^V182_PUBLIC_ASSERTION id=[0-9]{4} label=[a-zA-Z0-9_ .,/:()\-]{1,180}$|^V67_NATIVE_ASSERTION id=[0-9]{3,4}$|^V77_COMPILE_UNIT (harness|generated|loader|generator)$|^V77_HARNESS_LINE [0-9]{1,6}$|^V77_WARNING [a-z0-9-]+$|^V79_STAGE [a-z0-9_]+$|^V153_SC_PRE route=[01] present=[01] aligned=[01] mapped=[01] open=[01] prior=[01] same=[01] clear=[01] queued=[01] masked=[01]$|^V154_SC_SCHED_NEXT signal=[01] reply=[01] guest=[01] target=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$|^V155_SC_AFTER_DISABLE y1=[01] reply=[01] progressed=[01] call=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$|^V156_SC_AFTER_RESTORE irq=[01] reply=[01] progress=[01] text=[01] coherent=[01] ee=[01] ready=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$|^V157_SC_RESCHED_NEXT y1=[01] reply=[01] progressed=[01] target=[01] coherent=[01] ee=[01] ready=[01] pc=[0-9a-f]{8} lr=[0-9a-f]{8}$|^V158_SC_LOAD_ENTRY route=[01]$|^V158_SC_LOAD_ARG route=[01] masked=[01] aligned=[01] mapped=[01] idle=[01] thread=[01]$|^V158_SC_RFI pc=[01] msr=[01] regs=[01] waiti