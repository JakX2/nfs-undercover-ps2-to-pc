name: Wii Formatter 123 Native Witness Synthetic Tests
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-123-witness-tests.yml'
      - 'research/native_recomp/wii_formatter_report_second_immediate.h'
      - 'research/native_recomp/test_formatter_report_second_immediate.cpp'
      - 'research/native_recomp/wii_formatter_caller_integer.h'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_formatter_report_second_immediate.cpp -o /tmp/test_formatter_report_second_immediate
          /tmp/test_formatter_report_second_immediate
          g++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -Iresearch/native_recomp research/native_recomp/test_formatter_report_second_immediate.cpp -o /tmp/test_formatter_report_second_immediate_release
          /tmp/test_formatter_report_second_immediate_release
