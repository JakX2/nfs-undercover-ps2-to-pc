name: Wii V815 SRAM Offset Protocol
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v815*'
      - 'research/native_recomp/wii_exi_mx_device_v494.h'
      - '.github/workflows/wii-v815-sram-offset.yml'
permissions:
  contents: read
jobs:
  native-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute actual controller and scheduler regressions
        run: |
          set -euo pipefail
          for test in test_wii_exi_mx_device_v494 test_wii_exi_endpoint_scheduler_v495 test_sram_offset_v815; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/$test.cpp -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done
