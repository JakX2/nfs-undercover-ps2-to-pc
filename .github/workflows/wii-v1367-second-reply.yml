name: Wii V1367 Second Reply and IRQ Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1367*'
      - '.github/workflows/wii-v1367-second-reply.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for test in test_cold_open_reply_gate_v1253 test_scheduler_irq_entry_v1259 test_scheduler_reply_irq_v1268 test_second_reply_gate_v1367 test_second_irq_v1367; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
