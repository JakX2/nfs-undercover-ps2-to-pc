name: Wii V288 Original Wii NAND Early CR0 Producer
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v288*'
      - '.github/workflows/wii-v288-nand-early-cr.yml'
permissions:
  contents: read
concurrency:
  group: wii-v288-nand-early-cr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v288:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V288 original-free NAND entry CR0 producer semantics
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v288_nand_early_cr.py research/native_recomp/test_v288_nand_early_cr.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v288_nand_early_cr.py' -v
          echo 'PASS: V288 original-free original NAND CR0 producer'
  owner-original-v288:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V288 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Decode original Wii NAND first forward-branch CR0 producer
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v288_nand_early_cr.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v288.log" 2>&1 || {
            grep -E '^V288_EARLY_CR_AUDIT verified=0$' "$RUNNER_TEMP/v288.log" | sort -u || true
            echo 'V288 early CR0 producer not verified; private code withheld' >&2
            exit 1
          }
          grep -Fx 'V288_EARLY_CR_AUDIT verified=1' "$RUNNER_TEMP/v288.log"
          grep -E '^V288_EARLY_CR child=8052fa60 branch_offset=24 skip_target=92 bo=4 bi=2 cr_expected=0 producer=(entry|barrier|cmpimm|cmplimm|cmpreg|cmplreg|record|mtcrf|crlogical) producer_offset=(-1|[0-9]{1,2}) cr_field=(-1|[0-7]) ra=(-1|[0-9]|[1-2][0-9]|3[01]) rb=(-1|[0-9]|[1-2][0-9]|3[01]) imm_class=(-1|[0-4])$' "$RUNNER_TEMP/v288.log"
          echo 'V288 validated original NAND early PowerPC CR0 producer'
          echo 'V288 owner-original ELF read-only and authenticated'
          echo 'V279 isolated original NAND direct linked callsite verified'
          echo 'V279 no raw PowerPC instructions or original owner bytes exported'
          echo 'V279 authenticated control-flow classification complete'
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V288 owner-verified early NAND branch CR0 producer'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v288.log"
