name: Wii V106 Owner SC Public Literal Inventory
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/probe_sc_literals_v106.py'
      - 'research/native_recomp/test_sc_literals_v106.py'
      - '.github/workflows/wii-v106-sc-literals.yml'
permissions:
  contents: read
jobs:
  owner-public-paths:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned original inputs privately
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Inspect allowlisted public Wii SDK configuration literals
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/test_sc_literals_v106.py
          python3 research/native_recomp/probe_sc_literals_v106.py \
            "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/sc106.log" 2>&1 || {
              echo 'V106 authenticated public path inventory failed; owner data withheld'
              exit 1
            }
          grep -E '^V106_SC_LITERAL label=(sysconf_path|sysconf_leaf|setting_path|fs_device|es_device) count=([0-9]|1[0-6])$|^PASS: bounded owner-original public SC pathname inventory$' "$RUNNER_TEMP/sc106.log"
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/sc106.log"
