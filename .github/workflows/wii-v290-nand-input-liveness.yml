name: Wii V290 Original Wii NAND Incoming r3 Liveness
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v290*'
      - '.github/workflows/wii-v290-nand-input-liveness.yml'
permissions:
  contents: read
concurrency:
  group: wii-v290-nand-input-liveness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v290:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V290 original-free NAND entry r3 liveness
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v290_nand_input_liveness.py research/native_recomp/test_v290_nand_input_liveness.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v290_nand_input_liveness.py' -v
          echo 'PASS: V290 original-free NAND r3 entry preservation tests'
  owner-original-v290:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V290 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Classify original Wii first two NAND GPR3 instructions privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v290_nand_input_liveness.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v290.log" 2>&1 || {
            grep -E '^V290_NAND_INPUT_AUDIT verified=0$' "$RUNNER_TEMP/v290.log" | sort -u || true
            echo 'V290 NAND r3 liveness not verified; proprietary instructions withheld' >&2
            exit 1
          }
          grep -Fx 'V290_NAND_INPUT_AUDIT verified=1' "$RUNNER_TEMP/v290.log"
          grep -E '^V290_NAND_INPUT child=8052fa60 cmp=8 branch=24 target=92 nonzero_skips=1 zero_fallthrough=1 preserved=[01] write=[01] unknown=[01] control=[01] i0=[a-z0-9]{2,20} e0=(keep|write|unknown|control) i1=[a-z0-9]{2,20} e1=(keep|write|unknown|control)$' "$RUNNER_TEMP/v290.log"
          echo 'V288 validated original NAND early PowerPC CR0 producer'
          echo 'V288 owner-original ELF read-only and authenticated'
          echo 'V279 isolated original NAND direct linked callsite verified'
          echo 'V279 no raw PowerPC instructions or original owner bytes exported'
          echo 'V279 authenticated control-flow classification complete'
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V290 authenticated NAND entry r3 liveness audit'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v290.log"
