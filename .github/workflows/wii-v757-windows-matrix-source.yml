name: Wii Windows Full-Image SI Progression Matrix Source Check
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/windows_progression_matrix_v757.py'
      - 'research/native_recomp/test_v757_windows_progression_matrix.py'
      - 'research/native_recomp/windows_callback_time_v758.py'
      - 'research/native_recomp/test_v758_windows_callback_time.py'
      - 'research/native_recomp/windows_callback_frontier_v759.py'
      - 'research/native_recomp/test_v759_windows_callback_frontier.py'
      - 'research/native_recomp/windows_wireless_wrapper_v760.py'
      - 'research/native_recomp/test_v760_windows_wireless_wrapper.py'
      - 'research/native_recomp/windows_wireless_write_v761.py'
      - 'research/native_recomp/test_v761_windows_wireless_write.py'
      - 'research/native_recomp/windows_combined_callback_v762.py'
      - 'research/native_recomp/test_v762_windows_combined_callback.py'
      - '.github/workflows/wii-v757-windows-matrix-source.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test same-PE multi-launch SI boundary gates and fail-first behavior
        shell: pwsh
        run: |
          python -m unittest discover -s research/native_recomp -p test_v762_windows_combined_callback.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v761_windows_wireless_write.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v760_windows_wireless_wrapper.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v759_windows_callback_frontier.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v758_windows_callback_time.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v757_windows_progression_matrix.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v756_windows_callback_prefix.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v752_windows_transfer_return.py -v
          exit $LASTEXITCODE
