name: Wii V283 Original Wii NAND Early Skip Branch
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v283*'
      - '.github/workflows/wii-v283-nand-early-guard.yml'
permissions:
  contents: read
concurrency:
  group: wii-v283-nand-early-guard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v283:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V283 original-free NAND early branch semantics
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v283_nand_early_guard.py research/native_recomp/test_v283_nand_early_guard.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v283_nand_early_guard.py' -v
          echo 'PASS: V283 original-free PowerPC NAND early skip branches'
  owner-original-v283:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V283 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Decode original Wii NAND early and late SC writer skip branches
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v283_nand_early_guard.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v283.log" 2>&1 || {
            grep -E '^V283_GUARD_AUDIT verified=0$' "$RUNNER_TEMP/v283.log" | sort -u || true
            echo 'V283 original skip guard not verified; private code withheld' >&2
            exit 1
          }
          grep -Fx 'V283_GUARD_AUDIT verified=1' "$RUNNER_TEMP/v283.log"
          test "$(grep -Ec '^V283_NAND_GUARD rank=[12] child=8052fa60 branch_offset=[0-9]{1,4} target_offset=[0-9]{1,4} call_offset=184 bo=([0-9]|[1-2][0-9]|3[01]) bi=([0-9]|[1-2][0-9]|3[01]) cr_field=[0-7] cr_bit=[0-3] cr_expected=(-1|[01]) ctr_decrement=[01] producer=[0-3] cmp_field=(-1|[0-7]) cmp_ra=(-1|[0-9]|[1-2][0-9]|3[01]) cmp_rb=(-1|[0-9]|[1-2][0-9]|3[01]) imm_class=(-1|[0-5]) direct_cr=[01]$' "$RUNNER_TEMP/v283.log")" -eq 2
          grep -E '^V283_NAND_GUARD rank=[12] child=8052fa60 branch_offset=[0-9]{1,4} target_offset=[0-9]{1,4} call_offset=184 bo=([0-9]|[1-2][0-9]|3[01]) bi=([0-9]|[1-2][0-9]|3[01]) cr_field=[0-7] cr_bit=[0-3] cr_expected=(-1|[01]) ctr_decrement=[01] producer=[0-3] cmp_field=(-1|[0-7]) cmp_ra=(-1|[0-9]|[1-2][0-9]|3[01]) cmp_rb=(-1|[0-9]|[1-2][0-9]|3[01]) imm_class=(-1|[0-5]) direct_cr=[01]$' "$RUNNER_TEMP/v283.log"
          echo 'V279 isolated original NAND direct linked callsite verified'
          echo 'V279 no raw PowerPC instructions or original owner bytes exported'
          echo 'V279 authenticated control-flow classification complete'
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V283 authenticated original Wii NAND early skip branch'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v283.log"
