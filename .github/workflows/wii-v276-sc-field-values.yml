name: Wii V276 Original Wii SYSCONF Field-Value Stores
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v276*'
      - '.github/workflows/wii-v276-sc-field-values.yml'
permissions:
  contents: read
concurrency:
  group: wii-v276-sc-field-values-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v276:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V276 original-free PPC same-base SC field value tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v276_sc_field_values.py research/native_recomp/test_v276_sc_field_values.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v276_sc_field_values.py' -v
          echo 'PASS: original-free V276 same-base field source tests'
  owner-original-v276:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V276 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Inspect original Wii +0x188 status source stores privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v276_sc_field_values.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v276.log" 2>&1 || {
            grep -E '^V276_FIELD_VALUES verified=0$' "$RUNNER_TEMP/v276.log" | sort -u || true
            echo 'V276 field-value source not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V276_FIELD_VALUES verified=1' "$RUNNER_TEMP/v276.log"
          grep -Fx 'V276_FIELD_AUDIT_SUMMARY owners=2 loads=4 stores=3' "$RUNNER_TEMP/v276.log"
          test "$(grep -Ec '^V276_FIELD_BASE owner=[0-9a-f]{8} base_reg=([0-9]|[1-2][0-9]|3[01]) loads=2 writes=([12])$' "$RUNNER_TEMP/v276.log")" -eq 2
          test "$(grep -Ec '^V276_LOCAL_WRITE owner=[0-9a-f]{8} offset=[0-9]{1,5} width=(word|half|byte) base_reg=([0-9]|[1-2][0-9]|3[01]) same_base=[01] source_reg=([0-9]|[1-2][0-9]|3[01]) source=(byte[0-3]|otherconst|status|load|unknown)$' "$RUNNER_TEMP/v276.log")" -eq 3
          grep -E '^V276_FIELD_BASE owner=[0-9a-f]{8} base_reg=([0-9]|[1-2][0-9]|3[01]) loads=2 writes=([12])$' "$RUNNER_TEMP/v276.log"
          grep -E '^V276_LOCAL_WRITE owner=[0-9a-f]{8} offset=[0-9]{1,5} width=(word|half|byte) base_reg=([0-9]|[1-2][0-9]|3[01]) same_base=[01] source_reg=([0-9]|[1-2][0-9]|3[01]) source=(byte[0-3]|otherconst|status|load|unknown)$' "$RUNNER_TEMP/v276.log"
          echo 'PASS: V276 authenticated original Wii field source value classification'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v276.log"
