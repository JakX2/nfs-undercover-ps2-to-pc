name: Wii Native Cold IPC Client Witness
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v623*'
      - 'research/native_recomp/wii_native_ios_binding.h'
      - '.github/workflows/wii-v623-ipc-client.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute cold client observer with actual native IOS backend
        run: |
          set -euo pipefail
          for src in test_wii_ipc_client_witness_v623 test_wii_cold_ipc_control_v617 test_wii_native_ios_binding test_wii_native_ios_transport; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$src.cpp" -o "$RUNNER_TEMP/$src"
            "$RUNNER_TEMP/$src"
          done
