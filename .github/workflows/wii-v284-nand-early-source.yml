name: Wii V284 Original Wii NAND Early Return Source
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v284*'
      - '.github/workflows/wii-v284-nand-early-source.yml'
permissions:
  contents: read
concurrency:
  group: wii-v284-nand-early-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v284:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V284 original-free NAND early return source
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v284_nand_early_source.py research/native_recomp/test_v284_nand_early_source.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v284_nand_early_source.py' -v
          echo 'PASS: V284 original-free NAND early zero-result source'
  owner-original-v284:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V284 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Trace original Wii NAND early zero-skip source privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v284_nand_early_source.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v284.log" 2>&1 || {
            grep -E '^V284_EARLY_AUDIT verified=0$' "$RUNNER_TEMP/v284.log" | sort -u || true
            echo 'V284 early r3 producer not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V284_EARLY_AUDIT verified=1' "$RUNNER_TEMP/v284.log"
          grep -E '^V284_NAND_EARLY child=8052fa60 compare_offset=84 branch_offset=88 skip_target=188 source=(call|load|immediate|computed|barrier|unknown|entry) source_offset=(-1|[0-9]{1,4}) target=[0-9a-f]{8} tracked=([0-9]|[1-2][0-9]|3[01]) copies=[0-9]{1,2} width=[0-4] base=(-1|[0-9]|[1-2][0-9]|3[01]) disp=-?[0-9]{1,5}$' "$RUNNER_TEMP/v284.log"
          echo 'V279 isolated original NAND direct linked callsite verified'
          echo 'V279 no raw PowerPC instructions or original owner bytes exported'
          echo 'V279 authenticated control-flow classification complete'
          echo 'V277 owner-original direct-call audit read-only and SHA-verified'
          echo 'PASS: V284 authenticated original NAND first-guard source'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v284.log"
