name: Wii V298 Scoped Legacy SC Reply Observer
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v298*'
      - 'research/native_recomp/*v299*'
      - 'research/native_recomp/*v300*'
      - 'research/native_recomp/*v301*'
      - 'research/native_recomp/*v302*'
      - 'research/native_recomp/*v303*'
      - 'research/native_recomp/*v304*'
      - 'research/native_recomp/*v306*'
      - 'research/native_recomp/*v307*'
      - 'research/native_recomp/*v308*'
      - 'research/native_recomp/*v309*'
      - 'research/native_recomp/*v310*'
      - 'research/native_recomp/*v317*'
      - 'research/native_recomp/*v319*'
      - 'research/native_recomp/*v321*'
      - 'research/native_recomp/*v323*'
      - 'research/native_recomp/*v326*'
      - 'research/native_recomp/*v333*'
      - 'research/native_recomp/*v335*'
      - 'research/native_recomp/*v340*'
      - 'research/native_recomp/*v342*'
      - 'research/native_recomp/*v352*'
      - 'research/native_recomp/*v353*'
      - 'research/native_recomp/*v359*'
      - 'research/native_recomp/*v361*'
      - 'research/native_recomp/*v362*'
      - 'research/native_recomp/*v365*'
      - 'research/native_recomp/*v367*'
      - 'research/native_recomp/*v368*'
      - 'research/native_recomp/*v369*'
      - '.github/workflows/wii-v298-scoped-nand.yml'
permissions:
  contents: read
concurrency:
  group: wii-v298-scoped-nand-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v298:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V298 original-free legacy observer scoping
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/analyze_v298_scope_native.py research/native_recomp/test_v298_scoped_nand.py research/native_recomp/derive_v298_scope_reply_observer.py research/native_recomp/derive_v298_scoped_nand_runner.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v298_scoped_nand.py' -v
          python3 -m py_compile research/native_recomp/diagnose_v299_native_log.py research/native_recomp/test_v299_native_log.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v299_native_log.py' -v
          python3 -m py_compile research/native_recomp/analyze_v300_trace_hotspots.py research/native_recomp/test_v300_trace_hotspots.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v300_trace_hotspots.py' -v
          python3 -m py_compile research/native_recomp/analyze_v301_nand_first_helper.py research/native_recomp/test_v301_nand_first_helper.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v301_nand_first_helper.py' -v
          python3 -m py_compile research/native_recomp/restore_v302_private_helper.py research/native_recomp/test_v302_private_helper.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v302_private_helper.py' -v
          python3 -m py_compile research/native_recomp/analyze_v303_helper_coverage.py research/native_recomp/test_v303_helper_coverage.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v303_helper_coverage.py' -v
          python3 -m py_compile research/native_recomp/analyze_v304_helper_exec.py research/native_recomp/test_v304_helper_exec.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v304_helper_exec.py' -v
          python3 -m py_compile research/native_recomp/analyze_v306_helper_descendants.py research/native_recomp/test_v306_helper_descendants.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v306_helper_descendants.py' -v
          python3 -m py_compile research/native_recomp/analyze_v307_helper_abort.py research/native_recomp/test_v307_helper_abort.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v307_helper_abort.py' -v
          python3 -m py_compile research/native_recomp/resolve_v308_descendant_boundaries.py research/native_recomp/test_v308_descendant_boundaries.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v308_descendant_boundaries.py' -v
          python3 -m py_compile research/native_recomp/analyze_v309_native_edges.py research/native_recomp/test_v309_native_edges.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v309_native_edges.py' -v
          python3 -m py_compile research/native_recomp/restore_v310_private_descendant.py research/native_recomp/test_v310_private_descendant.py research/native_recomp/analyze_v310_restored_coverage.py research/native_recomp/test_v310_restored_coverage.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v310_private_descendant.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v310_restored_coverage.py' -v
          python3 -m py_compile research/native_recomp/audit_v317_descendant_edges.py research/native_recomp/test_v317_descendant_edges.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v317_descendant_edges.py' -v
          python3 -m py_compile research/native_recomp/audit_v319_native_entries.py research/native_recomp/test_v319_native_entries.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v319_native_entries.py' -v
          python3 -m py_compile research/native_recomp/derive_v321_guest_entry_probe.py research/native_recomp/test_v321_guest_entry_probe.py research/native_recomp/analyze_v321_native_entry_comparison.py research/native_recomp/test_v321_native_entry_comparison.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v321_guest_entry_probe.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v321_native_entry_comparison.py' -v
          python3 -m py_compile research/native_recomp/analyze_v323_second_descendants.py research/native_recomp/test_v323_second_descendants.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v323_second_descendants.py' -v
          python3 -m py_compile research/native_recomp/analyze_v326_third_descendants.py research/native_recomp/test_v326_third_descendants.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v326_third_descendants.py' -v
          python3 -m py_compile research/native_recomp/analyze_v333_nand_cache_native.py research/native_recomp/test_v333_nand_cache_native.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v333_nand_cache_native.py' -v
          python3 -m py_compile research/native_recomp/analyze_v335_nand_ipc_frontier.py research/native_recomp/test_v335_nand_ipc_frontier.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v335_nand_ipc_frontier.py' -v
          python3 -m py_compile research/native_recomp/derive_v340_nand_mmio_probe.py research/native_recomp/test_v340_nand_mmio_probe.py research/native_recomp/analyze_v340_nand_mmio.py research/native_recomp/test_v340_nand_mmio.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v340_nand_mmio_probe.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v340_nand_mmio.py' -v
          python3 -m py_compile research/native_recomp/test_v342_full_harness_smoke.py
          python3 -m py_compile research/native_recomp/derive_v352_nand_mailbox_route.py research/native_recomp/test_v352_nand_mailbox_route.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v352_nand_mailbox_route.py' -v
          python3 -m py_compile research/native_recomp/derive_v367_nand_irq_mask_route.py research/native_recomp/test_v367_nand_irq_mask_route.py research/native_recomp/analyze_v367_nand_irq_mask.py research/native_recomp/test_v367_nand_irq_mask_audit.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v367_nand_irq_mask_route.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v367_nand_irq_mask_audit.py' -v
          python3 -m py_compile research/native_recomp/derive_v369_post_ack_mmio_probe.py research/native_recomp/test_v369_post_ack_mmio_probe.py research/native_recomp/analyze_v369_post_ack_mmio.py research/native_recomp/test_v369_post_ack_mmio_audit.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v369_post_ack_mmio_probe.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v369_post_ack_mmio_audit.py' -v
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie \
            research/native_recomp/test_wii_nand_irq_mask_v368.cpp -o "$RUNNER_TEMP/nand-mask-v368"
          "$RUNNER_TEMP/nand-mask-v368"
          python3 -m py_compile research/native_recomp/analyze_v353_nand_mailbox_sequence.py research/native_recomp/test_v353_nand_mailbox_sequence.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v353_nand_mailbox_sequence.py' -v
          python3 -m py_compile research/native_recomp/derive_v359_post_x1_call_probe.py research/native_recomp/test_v359_post_x1_call_probe.py research/native_recomp/analyze_v359_post_x1_calls.py research/native_recomp/test_v359_post_x1_calls.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v359_post_x1_call_probe.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v359_post_x1_calls.py' -v
          python3 -m py_compile research/native_recomp/derive_v361_nand_ios_yield.py research/native_recomp/test_v361_nand_ios_yield.py research/native_recomp/analyze_v361_nand_ios_yield.py research/native_recomp/test_v361_nand_ios_yield_audit.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v361_nand_ios_yield.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v361_nand_ios_yield_audit.py' -v
          python3 -m py_compile research/native_recomp/analyze_v362_bounded_native_exit.py research/native_recomp/test_v362_bounded_native_exit.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v362_bounded_native_exit.py' -v
          python3 -m py_compile research/native_recomp/derive_v365_nand_irq_readiness.py research/native_recomp/test_v365_nand_irq_readiness.py research/native_recomp/analyze_v365_nand_irq_readiness.py research/native_recomp/test_v365_nand_irq_readiness_audit.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v365_nand_irq_readiness.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v365_nand_irq_readiness_audit.py' -v
          python3 -m unittest discover -s research/native_recomp -p 'test_v342_full_harness_smoke.py' -v
          bash -n research/native_recomp/run_v298_scoped_nand.sh
          # V330 source-only provenance for the native 0474 cache-syscall assertion.
          # Only source filenames and line numbers appear in CI, never C++ contents.
          python3 - <<'PY'
          from pathlib import Path
          needles = ("IPC request unexpected cache syscall sequence",
                     "cache syscall sequence", "IPC request unexpected")
          roots = (Path("research/native_recomp"),)
          found = []
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in (".py", ".cpp", ".cc", ".h", ".hpp", ".sh"):
                      continue
                  if path.stat().st_size > 2_000_000:
                      continue
                  data = path.read_text(encoding="utf-8", errors="replace")
                  for n, line in enumerate(data.splitlines(), 1):
                      if any(phrase in line for phrase in needles):
                          found.append((path.as_posix(), n, int(needles[0] in line)))
          print("V330_CACHE_SOURCE matches="+str(len(found)))
          for path, line, exact in sorted(found)[:32]:
              print("V330_CACHE_SOURCE_ENTRY path="+path+" line="+str(line)+" exact="+str(exact))
          PY
  owner-original-v298:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V298 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Prepare pinned NWii runtime and source guards
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_perf_patch_guards_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/verify_perf_combo_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_hid4_continuous_patch_v30.py"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_continuous_patch_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_trace_guards_v44.py"
          python3 "$here/apply_jump_table_v58.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_jump_table_patch_v58.py"
          python3 "$here/apply_dcbi_v60.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hollywood_mmio_v62.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_native_lowmem_v63.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_bat_registers_v65.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbz_v67.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_exception_sprg.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_mtmsr_resume_v74.py" "$RUNNER_TEMP/nwii"
      - name: Execute original NAND AOT with post-callback V178 observer scoped
        run: |
          set -euo pipefail
          umask 077
          V293_PRIVATE_ELF="$RUNNER_TEMP/originals/NfsMWRelease.elf" bash research/native_recomp/run_v298_scoped_nand.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/sc298.log" 2>&1 || {
              grep -E '^V260_PPCMSG_BOUNDARY guest=[01] aligned=[01] mapped=[01] fresh=[01] coherent=[01] reply=[01] open=[01] mem2=[01] mode_ok=[01] path_phys=[01] path_alias=[01] idle=[01] prewrite=1$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V260_NAND_GUEST callback=[01] event=[01] memory=[01] trial=([1-9]|1[0-6])$|^V260_CALL_FRONTIER guest=[01] coherent=[01] mapped=[01] calls=[0-9]{1,3} sc=[0-9]{1,3} pc=[0-9a-f]{8} lr=[0-9a-f]{8}$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V257_NAND_NEXT guest=[01] caller=[01] code=[01] mapped=[01] reply=[01] coherent=[01] sc=[0-9]{1,3} pc=[0-9a-f]{8} lr=[0-9a-f]{8}$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V250_STAGE (derive|compile|link|execute)=[01]$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V178_NATIVE_ASSERTION id=[0-9]{4}$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V250_PUBLIC_FAILURE id=[0-9]{4} label=[A-Za-z0-9 _.,:/()\-]{1,170} callback=[01] nand=[01] trials=([0-9]|1[0-6])$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V262_STATE_ERROR reason=[a-z_]{1,48}$|^V261_CENSUS_ERROR reason=[a-z_]{1,48}$|^V250_STAGE (derive|compile|link|execute)=[01]$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V178_DERIVATION result=failed kind=(missing_anchor|ambiguous_anchor|python_syntax|import_error|other_value_error|other_error)$|^V110_WRAPPER (derived|syntax_failed|syntax_ok)$|^V110_WRAPPER_SYNTAX line [0-9]{1,4}$|^V250_STAGE (derive|compile|link|execute)=[01]$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V294_DERIVE_EXCEPTION class=(RecursionError|FileNotFoundError|PermissionError|TypeError|AttributeError|NameError|RuntimeError|MemoryError|OSError|KeyError|AssertionError|Other)$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V263_HOTSPOT_ERROR reason=[a-z_]{1,60}$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V269_WATCH_ERROR reason=[a-z_]{1,48}$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V278_ENTRY_ERROR reason=[a-z_]{1,50}$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V289_SERVICE_ERROR reason=[a-z_]{1,50}$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V292_AOT_AUDIT verified=0$' "$RUNNER_TEMP/sc298.log" || true
              grep -E '^V293_RESTORE_AUDIT verified=0$|^V293_RESTORE result=failed$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V294_AOT_STAGE (regenerate|inspect|coverage|compile|link)=[01]$|^V294_AOT_COVERAGE targets=4 ' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V295_NATIVE_OUTCOME |^V295_EXEC_AUDIT verified=[01]$|^V295_BOUNDED_CANDIDATE inspected=[01]$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V296_NATIVE_FRONTIER |^V296_FRONTIER_AUDIT verified=[01]$|^V296_SERVICE_PROBE inspected=[01]$|^V296_HARNESS_STAGE compile=[01]$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V298_NATIVE_SCOPE |^V298_SCOPE_AUDIT verified=[01]$|^V298_RETIRED_OBSERVER inspected=[01]$|^V298_HARNESS_STAGE compile=[01]$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V299_NATIVE_DIAG rc=[0-9]{1,3} kind=(timeout|launch|signal|zero|nonzero) size_band=[0-3] over_limit=[01] edge_sample=1 callback=[01] child=[01] early=[01] late=[01] writer=[01] exception=(runtime|range|alloc|logic|unclassified)$|^V299_NATIVE_DIAG verified=[01]$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V300_TRACE_SAMPLE size_band=[0-3] sample_lines=[0-9]{1,6} matched=[0-9]{1,6} unmatched=[0-9]{1,6} distinct=[0-9]{1,5} distinct_pc=[0-9]{1,5}$|^V300_TRACE_MARKER rank=[1-5] name=V[0-9]{2,3}_[A-Z][A-Z0-9_]{1,45} hits=[0-9]{1,6}$|^V300_TRACE_PC rank=[1-5] pc=[0-9a-f]{8} hits=[0-9]{1,6}$|^V300_TRACE_AUDIT verified=[01]$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V301_HELPER_AOT owner=1 elf=1 pc=804f2064 words=[0-9]{1,5} present=[01] same=[0-9]{1,5} nop=[0-9]{1,5} blr=[0-9]{1,5} other=[0-9]{1,5} body=[01] dispatch=[01] caller=[01] unmapped=[01] direct=[01]$|^V301_HELPER_AUDIT (verified=[01]|inspected=1)$' "$RUNNER_TEMP/sc298.log" | sort -u || true
              grep -E '^V302_HELPER_RESTORE owner=1 pc=804f2064 words=[0-9]{1,5} present=[01] same=[0-9]{1,5} nop=[0-9]{1,5} extended=[01] protected=1 candidate=1$|^V302_RESTORE_AUDIT verified=[01]$|^V302_HELPER_CANDIDATE inspected=1$' "$RUNNER_TEMP/sc298.log" | sort -u || true
