name: Wii V741 Cold IRQ Return Capture
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v741*'
      - '.github/workflows/wii-v741-cold-return-capture.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pre-entry context capture
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_cold_return_capture_v741.cpp -o "$RUNNER_TEMP/v741"
          "$RUNNER_TEMP/v741"
