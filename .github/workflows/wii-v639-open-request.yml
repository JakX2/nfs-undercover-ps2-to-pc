name: Wii Original IOS Open Request Geometry
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v639*'
      - '.github/workflows/wii-v639-open-request.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify request observer with synthetic CPU state
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/make_v639_open_geometry.py
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_open_request_witness_v639.cpp -o "$RUNNER_TEMP/request"
          "$RUNNER_TEMP/request"
  owner-open-geometry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Authenticate original allocation and submission call geometry
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/make_v639_open_geometry.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --private-header "$RUNNER_TEMP/open-expectations.h"
          printf '#include "open-expectations.h"\nint main(){}\n' > "$RUNNER_TEMP/open-test.cpp"
          g++ -std=c++20 -fsyntax-only -Iresearch/native_recomp "$RUNNER_TEMP/open-test.cpp"
          rm -f "$RUNNER_TEMP/open-expectations.h" "$RUNNER_TEMP/open-test.cpp"
      - name: Clean private original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw616"
