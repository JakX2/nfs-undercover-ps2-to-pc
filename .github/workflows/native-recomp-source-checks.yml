name: Native recomp source-only checks

on:
  push:
    branches:
      - research/wii-native-recomp-preflight
    paths:
      - 'research/native_recomp/**'
      - '.github/workflows/native-recomp-source-checks.yml'
  pull_request:
    paths:
      - 'research/native_recomp/**'
      - '.github/workflows/native-recomp-source-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python source syntax
        run: |
          find research/native_recomp -name '*.py' -print0 |
            xargs -0 -r -n1 python3 -m py_compile
      - name: Check bash source syntax
        run: |
          find research/native_recomp -name '*.sh' -print0 |
            xargs -0 -r -n1 bash -n
      - name: Run boot checkpoint driver regressions
        run: |
          python3 -m unittest discover -s research/native_recomp -p test_boot_progress.py -v
      - name: Test original-free IPC reply harness derivation
        run: |
          python3 research/native_recomp/test_reply_entry_derivation.py
          python3 research/native_recomp/test_ready_thread_v81.py
          python3 research/native_recomp/test_thread_resume_v82.py
          python3 research/native_recomp/test_second_open_v83.py
          python3 research/native_recomp/test_second_ack_v84.py
          python3 research/native_recomp/test_both_stm_opens_v85.py
          python3 research/native_recomp/test_stm_ioctl_fixture_v86.py
          python3 research/native_recomp/test_stm_ioctl_harness_v86.py
          python3 research/native_recomp/test_stm_event_v87.py
          python3 research/native_recomp/test_stm_return_v88.py
          python3 research/native_recomp/test_post_stm_v89.py
          python3 research/native_recomp/test_console_route_v90.py
          python3 research/native_recomp/test_extend_private_text.py
          python3 research/native_recomp/test_resource_open_v91.py
          python3 research/native_recomp/test_filesystem_return_v92.py
          python3 research/native_recomp/test_isfs_return_v93.py
          python3 research/native_recomp/test_es_open_v94.py
          python3 research/native_recomp/test_title_return_v95.py
          python3 research/native_recomp/test_directory_return_v96.py
          python3 research/native_recomp/test_es_close_v97.py
          python3 research/native_recomp/test_startup_tail_metadata_v90.py
      - name: Test original-free native dcbz memory effects
        run: |
          python3 research/native_recomp/test_dcbz_patch_v67.py
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_flat_cacheline_zero_v67.cpp -o "$RUNNER_TEMP/dcbz-test"
          "$RUNNER_TEMP/dcbz-test"
      - name: Test native Hollywood IPC mailbox under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_wii_ipc_mailbox.cpp -o "$RUNNER_TEMP/ipc-mailbox-test"
          "$RUNNER_TEMP/ipc-mailbox-test"
      - name: Test native STM IOS IPC dispatcher under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_wii_stm_ios.cpp -o "$RUNNER_TEMP/stm-ios-test"
          "$RUNNER_TEMP/stm-ios-test"
      - name: Test native Hollywood IRQ routing under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_wii_hollywood_irq.cpp -o "$RUNNER_TEMP/hollywood-irq-test"
          "$RUNNER_TEMP/hollywood-irq-test"
      - name: Test integrated IOS MMIO bus under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_wii_ios_bus.cpp -o "$RUNNER_TEMP/ios-bus-test"
          "$RUNNER_TEMP/ios-bus-test"
      - name: Test mounted native guest filesystem under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -no-pie research/native_recomp/test_wii_guest_filesystem.cpp -o "$RUNNER_TEMP/guest-fs-test"
          "$RUNNER_TEMP/guest-fs-test"
      - name: Test native read-only title metadata under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -no-pie research/native_recomp/test_wii_title_metadata.cpp -o "$RUNNER_TEMP/title-data-test"
          "$RUNNER_TEMP/title-data-test"
      - name: Test enabled-interrupt cache syscall entry under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_native_idle_cache_sc.cpp -o "$RUNNER_TEMP/idle-sc"
          "$RUNNER_TEMP/idle-sc"
      - name: Test native external IRQ entry under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_native_external_irq.cpp -o "$RUNNER_TEMP/external-irq-test"
          "$RUNNER_TEMP/external-irq-test"
      - name: Reject proprietary game fixture extensions
        run: |
          if git ls-files research/native_recomp | grep -E '\.(dol|elf|iso|gcm|gcz)$|/owner_PRIVATE\.'; then
            echo 'Private game image accidentally tracked' >&2
            exit 1
          fi
          echo 'No prohibited native-game fixture extensions tracked'
