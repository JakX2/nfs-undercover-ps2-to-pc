permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python source syntax
        run: |
          find research/native_recomp -name '*.py' -print0 |
            xargs -0 -r -n1 python3 -m py_compile
      - name: Check bash source syntax
        run: |
          find research/native_recomp -name '*.sh' -print0 |
            xargs -0 -r -n1 bash -n
      - name: Run boot checkpoint driver regressions
        run: |
          python3 -m unittest discover -s research/native_recomp -p test_boot_progress.py -v
      - name: Test original-free IPC reply harness derivation
        run: |
          python3 research/native_recomp/test_reply_entry_derivation.py
          python3 research/native_recomp/test_ready_thread_v81.py
          python3 research/native_recomp/test_thread_resume_v82.py
