        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_native_idle_cache_sc.cpp -o "$RUNNER_TEMP/idle-sc"
          "$RUNNER_TEMP/idle-sc"
      - name: Test native external IRQ entry under sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
            research/native_recomp/test_native_external_irq.cpp -o "$RUNNER_TEMP/external-irq-test"
          "$RUNNER_TEMP/external-irq-test"
      - name: Reject proprietary game fixture extensions
        run: |
          if git ls-files research/native_recomp | grep -E '\.(dol|elf|iso|gcm|gcz)$|/owner_PRIVATE\.'; then
            echo 'Private game image accidentally tracked' >&2
            exit 1
          fi
          echo 'No prohibited native-game fixture extensions tracked'
