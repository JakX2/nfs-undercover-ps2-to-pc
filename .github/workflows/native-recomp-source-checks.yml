permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python source syntax
        run: |
          find research/native_recomp -name '*.py' -print0 |
            xargs -0 -r -n1 python3 -m py_compile
      - name: Check bash source syntax
        run: |
          find research/native_recomp -name '*.sh' -print0 |
            xargs -0 -r -n1 bash -n
      - name: Run boot checkpoint driver regressions
        run: |
          python3 -m unittest discover -s research/native_recomp -p test_boot_progress.py -v
      - name: Check complete-image first-vector candidate and bounded debug oracle
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v457_exception_vector.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v458_debug_stack.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exception_vector_witness_v457.cpp -o "$RUNNER_TEMP/v457-source"
          "$RUNNER_TEMP/v457-source"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exception_pack_v462.cpp -o "$RUNNER_TEMP/v462-source"
          "$RUNNER_TEMP/v462-source"
          python3 -m unittest discover -s research/native_recomp -p test_v466_exception_pack.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exception_pack_route_v466.cpp -o "$RUNNER_TEMP/v466-route"
          "$RUNNER_TEMP/v466-route"
          python3 -m unittest discover -s research/native_recomp -p test_v468_exception_pack_geometry.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v470_alarm_startup.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_alarm_startup_witness_v470.cpp -o "$RUNNER_TEMP/v470-alarm"
          "$RUNNER_TEMP/v470-alarm"
          python3 -m unittest discover -s research/native_recomp -p test_v473_module_irq.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_module_irq_witness_v473.cpp -o "$RUNNER_TEMP/v473-irq"
          "$RUNNER_TEMP/v473-irq"
          python3 -m unittest discover -s research/native_recomp -p test_v475_irq_bootstrap.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_irq_bootstrap_v475.cpp -o "$RUNNER_TEMP/v475-irq"
          "$RUNNER_TEMP/v475-irq"
          python3 -m unittest discover -s research/native_recomp -p test_v476_irq_mmio.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_irq_banks_v480.cpp -o "$RUNNER_TEMP/v480-banks"
          "$RUNNER_TEMP/v480-banks"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_irq_return_witness_v482.cpp -o "$RUNNER_TEMP/v482-irq"
          "$RUNNER_TEMP/v482-irq"
          python3 -m unittest discover -s research/native_recomp -p test_v483_irq_return.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v486_context_startup.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_context_startup_witness_v486.cpp -o "$RUNNER_TEMP/v486-context"
          "$RUNNER_TEMP/v486-context"
          python3 -m unittest discover -s research/native_recomp -p test_v488_os_cache_reuse.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_os_cache_reuse_v488.cpp -o "$RUNNER_TEMP/v488-reuse"
          "$RUNNER_TEMP/v488-reuse"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_controller_v489.cpp -o "$RUNNER_TEMP/v489-exi"
          "$RUNNER_TEMP/v489-exi"
          python3 -m unittest discover -s research/native_recomp -p test_v491_exi_poll.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_poll_witness_v491.cpp -o "$RUNNER_TEMP/v491-poll"
          "$RUNNER_TEMP/v491-poll"
          python3 -m unittest discover -s research/native_recomp -p test_v500_exi_handlers.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_handler_witness_v500.cpp -o "$RUNNER_TEMP/v500-handlers"
          "$RUNNER_TEMP/v500-handlers"
          python3 -m unittest discover -s research/native_recomp -p test_v504_exi_id.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_id_witness_v504.cpp -o "$RUNNER_TEMP/v504-id"
          "$RUNNER_TEMP/v504-id"
          python3 -m unittest discover -s research/native_recomp -p test_v505_exi_profile_writer.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v510_exi_absent.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_exi_absent_witness_v510.cpp -o "$RUNNER_TEMP/v510-absent"
          "$RUNNER_TEMP/v510-absent"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_si_controller_v511.cpp -o "$RUNNER_TEMP/v511-si"
          "$RUNNER_TEMP/v511-si"
          python3 -m unittest discover -s research/native_recomp -p test_v520_si_entry.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_si_entry_witness_v520.cpp -o "$RUNNER_TEMP/v520-si-entry"
          "$RUNNER_TEMP/v520-si-entry"
          python3 -m unittest discover -s research/native_recomp -p test_v524_si_sampling.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_si_sampling_witness_v524.cpp -o "$RUNNER_TEMP/v524-si-sample"
          "$RUNNER_TEMP/v524-si-sample"
          python3 -m unittest discover -s research/native_recomp -p test_v543_si_sample_diagnostic.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v529_si_discovery.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_si_discovery_witness_v529.cpp -o "$RUNNER_TEMP/v529-si-discovery"
          "$RUNNER_TEMP/v529-si-discovery"
          python3 -m unittest discover -s research/native_recomp -p test_v534_sram_read.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wii_sram_read_witness_v534.cpp -o "$RUNNER_TEMP/v534-sram"
          "$RUNNER_TEMP/v534-sram"
      - name: Prepare pinned patched public NWiiRuntime for harness syntax check
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_jump_table_v58.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbi_v60.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hollywood_mmio_v62.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_native_lowmem_v63.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_bat_registers_v65.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbz_v67.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_exception_sprg.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_mtmsr_resume_v74.py" "$RUNNER_TEMP/nwii"
          test -f "$RUNNER_TEMP/nwii/nWiiRuntime/include/runtime/cpu_context.h"
      - name: Validate signed immediate compare emitter SO correction
        run: |
          set -euo pipefail
          here=research/native_recomp
          public="$RUNNER_TEMP/nwii"
          candidate="$RUNNER_TEMP/cmpi-source"
          mkdir -p "$candidate/nWiiRecomp/src"
          git -C "$public" show HEAD:nWiiRecomp/src/recompiler.cpp > "$candidate/nWiiRecomp/src/recompiler.cpp"
          python3 "$here/apply_signed_compare_so.py" --self-test
          python3 "$here/apply_signed_compare_so.py" "$candidate"
          cp "$candidate/nWiiRecomp/src/recompiler.cpp" "$candidate/once.cpp"
          python3 "$here/apply_signed_compare_so.py" "$candidate"
          cmp "$candidate/once.cpp" "$candidate/nWiiRecomp/src/recompiler.cpp"
          g++ -std=c++20 -fsyntax-only -I"$public/nWiiRuntime/include" -I"$public/nWiiAnalyzer/include" -I"$public/nWiiRecomp/include" "$candidate/nWiiRecomp/src/recompiler.cpp"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie "$here/test_signed_compare_so_emission.cpp" -o "$RUNNER_TEMP/cmpi-source-test"
          "$RUNNER_TEMP/cmpi-source-test"
      - name: Compile full original-free NAND observer harness before owner runs
        env:
          V347_NWII_ROOT: ${{ runner.temp }}/nwii
        run: |
          python3 -m unittest discover -s research/native_recomp -p 'test_v342_full_harness_smoke.py' -v
      - name: Test original-free IPC reply harness derivation
        run: |
          python3 research/native_recomp/test_reply_entry_derivation.py
          python3 research/native_recomp/test_ready_thread_v81.py
          python3 research/native_recomp/test_thread_resume_v82.py
