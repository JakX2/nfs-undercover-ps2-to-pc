name: Undercover Wii hosted Ghidra (private originals gated)

# Original game content is processed only in a gated main-branch job.
on:
  pull_request:
    paths:
      - '.github/workflows/wii-ghidra-hosted.yml'
      - 'research/cloud_ghidra/**'
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: undercover-wii-ghidra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-only-smoke:
    name: Synthetic PowerPC DOL / real headless Ghidra 12.1.3
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run original-free staging and manifest regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/cloud_ghidra -p 'test_*.py' -v
          find research/cloud_ghidra -name '*.py' -print0 | xargs -0 -r -n1 python3 -m py_compile
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghidra-archives
          key: ghidra-12-1-3-verified-93a5d11a9ad5
      - name: Install pinned Ghidra and Wii loader without owner inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra-archives" "$RUNNER_TEMP/ghidra-install"
          cd "$RUNNER_TEMP/ghidra-archives"
          if [[ ! -s ghidra.zip ]]; then
            curl --fail --location --retry 3 --silent --show-error \
              'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip' -o ghidra.zip
          fi
          echo '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  ghidra.zip' | sha256sum -c -
          unzip -q ghidra.zip -d "$RUNNER_TEMP/ghidra-install"
          if [[ ! -s gamecube-loader.zip ]]; then
            curl --fail --location --retry 3 --silent --show-error \
              'https://github.com/Cuyler36/Ghidra-GameCube-Loader/releases/download/1.3.1/GameCubeLoader-1.3.0-921504c-Ghidra_12.1.zip' -o gamecube-loader.zip
          fi
          echo '9892f28fc1e7f19bb3fcec7cfb4ad2ab7504503b571d93de8b142a6f7bec8ed0  gamecube-loader.zip' | sha256sum -c -
          ghidra="$RUNNER_TEMP/ghidra-install/ghidra_12.1.3_PUBLIC"
          unzip -q gamecube-loader.zip -d "$ghidra/Ghidra/Extensions/Ghidra"
          test -x "$ghidra/support/analyzeHeadless"
          test "$(find "$ghidra/Ghidra/Extensions/Ghidra" -name ppc_gekko_broadway.ldefs | wc -l)" -eq 1
      - name: Verify synthetic PowerPC function discovery and call graph
        shell: bash
        run: |
          set -euo pipefail
          python3 research/cloud_ghidra/make_synthetic_dol.py "$RUNNER_TEMP/synthetic_wii.dol"
          mkdir -p "$RUNNER_TEMP/ghidra-projects"
          ghidra="$RUNNER_TEMP/ghidra-install/ghidra_12.1.3_PUBLIC"
          "$ghidra/support/analyzeHeadless" "$RUNNER_TEMP/ghidra-projects" WiiSynthetic \
            -import "$RUNNER_TEMP/synthetic_wii.dol" -loader GameCubeLoader \
            -loader-autoloadMaps false \
            -scriptPath "$GITHUB_WORKSPACE/research/cloud_ghidra" \
            -postScript ExportWiiFunctionManifest.java "$RUNNER_TEMP/synthetic-functions.json" synthetic \
            -analysisTimeoutPerFile 180 -deleteProject > "$RUNNER_TEMP/synthetic-ghidra.log" 2>&1 || {
              tail -80 "$RUNNER_TEMP/synthetic-ghidra.log"
              exit 1
            }
          python3 research/cloud_ghidra/check_manifest.py "$RUNNER_TEMP/synthetic-functions.json"

  owner-original:
    name: Authenticated Drive owner Wii DOL headless analysis (private only)
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated Google Drive client
        run: python3 -m pip install --disable-pip-version-check --quiet 'google-api-python-client==2.187.0' 'google-auth==2.42.1'
      - name: Retrieve owner originals through read-only authenticated Drive access
        shell: bash
        env:
          WII_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.WII_GDRIVE_SERVICE_ACCOUNT_JSON }}
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 research/cloud_ghidra/stage_owner_wii.py "$RUNNER_TEMP/wii-owner-private"
          test -s "$RUNNER_TEMP/wii-owner-private/NfsMWRelease.dol"
          test -s "$RUNNER_TEMP/wii-owner-private/NfsMWRelease.elf"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghidra-archives
          key: ghidra-12-1-3-verified-93a5d11a9ad5
      - name: Install pinned authenticated cloud analyzer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra-archives" "$RUNNER_TEMP/ghidra-install"
          cd "$RUNNER_TEMP/ghidra-archives"
          if [[ ! -s ghidra.zip ]]; then
            curl --fail --location --retry 3 --silent --show-error \
              'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip' -o ghidra.zip
          fi
          echo '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  ghidra.zip' | sha256sum -c -
          unzip -q ghidra.zip -d "$RUNNER_TEMP/ghidra-install"
          if [[ ! -s gamecube-loader.zip ]]; then
            curl --fail --location --retry 3 --silent --show-error \
              'https://github.com/Cuyler36/Ghidra-GameCube-Loader/releases/download/1.3.1/GameCubeLoader-1.3.0-921504c-Ghidra_12.1.zip' -o gamecube-loader.zip
          fi
          echo '9892f28fc1e7f19bb3fcec7cfb4ad2ab7504503b571d93de8b142a6f7bec8ed0  gamecube-loader.zip' | sha256sum -c -
          ghidra="$RUNNER_TEMP/ghidra-install/ghidra_12.1.3_PUBLIC"
          unzip -q gamecube-loader.zip -d "$ghidra/Ghidra/Extensions/Ghidra"
          test -x "$ghidra/support/analyzeHeadless"
          test "$(find "$ghidra/Ghidra/Extensions/Ghidra" -name ppc_gekko_broadway.ldefs | wc -l)" -eq 1
      - name: Run original owner DOL Ghidra and validate privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/wii-private-projects"
          ghidra="$RUNNER_TEMP/ghidra-install/ghidra_12.1.3_PUBLIC"
          # Keep ALL original-bearing Ghidra logs and JSON in ephemeral scratch.
          "$ghidra/support/analyzeHeadless" "$RUNNER_TEMP/wii-private-projects" OwnerOriginal \
            -import "$RUNNER_TEMP/wii-owner-private/NfsMWRelease.dol" \
            -loader GameCubeLoader -loader-autoloadMaps false \
            -scriptPath "$GITHUB_WORKSPACE/research/cloud_ghidra" \
            -postScript ExportWiiFunctionManifest.java "$RUNNER_TEMP/private-wii-index.json" private \
            -analysisTimeoutPerFile 2400 -deleteProject \
            > "$RUNNER_TEMP/private-ghidra.log" 2>&1 || {
              echo 'Private Wii analysis failed. Review in a strictly private workspace; original logs are not published.' >&2
              exit 1
            }
          python3 research/cloud_ghidra/check_original_manifest.py "$RUNNER_TEMP/private-wii-index.json"
          echo 'Private Wii Ghidra job verified. No game-derived artifact published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove original inputs, logs, project and reports
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/wii-owner-private" \
            "$RUNNER_TEMP/wii-private-projects" \
            "$RUNNER_TEMP/private-wii-index.json" "$RUNNER_TEMP/private-ghidra.log"
