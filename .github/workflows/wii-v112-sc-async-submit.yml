name: Wii V112 Original SC Async Request Construction
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v112*'
      - '.github/workflows/wii-v112-sc-async-submit.yml'
permissions:
  contents: read
concurrency:
  group: wii-v112-sc-submit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-sc-submit-v112:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Prepare pinned original-free NWii runtime and cache traces
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nwii"
          git -C "$RUNNER_TEMP/nwii" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii" fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nwii" rev-parse HEAD)" = 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          here=research/native_recomp
          python3 "$here/apply_nonsplit_dispatch_v15.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_perf_sprs_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_perf_patch_guards_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid_state_v18.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_fpscr_v19.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_l2cr_v20.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_syscall_pc_v26.py" "$RUNNER_TEMP/nwii"
          python3 "$here/verify_perf_combo_v29.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hid4_continuous_v30.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_hid4_continuous_patch_v30.py"
          python3 "$here/apply_cache_continuous_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_continuous_patch_v39.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_cache_trace_v44.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_cache_trace_guards_v44.py"
          python3 "$here/apply_jump_table_v58.py" "$RUNNER_TEMP/nwii"
          python3 "$here/test_jump_table_patch_v58.py"
          python3 "$here/apply_dcbi_v60.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_hollywood_mmio_v62.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_native_lowmem_v63.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_bat_registers_v65.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_dcbz_v67.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_exception_sprg.py" "$RUNNER_TEMP/nwii"
          python3 "$here/apply_mtmsr_resume_v74.py" "$RUNNER_TEMP/nwii"
          echo 'PASS: V72 focused runtime prerequisites prepared and original-free source guards passed'
      - name: Execute original SC asynchronous IOS request construction
        run: |
          set -euo pipefail
          umask 077
          bash research/native_recomp/run_v112_continuous_sc_async_submit.sh \
            "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals/NfsMWRelease.dol" \
            > "$RUNNER_TEMP/sc112.log" 2>&1 || {
              grep -E '^V110_WRAPPER (derived|syntax_ok|syntax_failed)$|^V110_WRAPPER_SYNTAX line=[0-9]+$|^V104_STAGE (runtime_cache_trace_verified|fixture_generated|geometry_verified|generator_compiled|generation_complete|native_compiled)$' "$RUNNER_TEMP/sc112.log" || true
              grep -E '^V110_PUBLIC_CXX_LINE number=[0-9]{1,5}$|^V110_PUBLIC_CXX_KIND expected=[0-9] undeclared=[0-9] type=[0-9] conversion=[0-9]|^V112_NATIVE_EXIT ok=[01]$|^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc112.log" || true
              code="$(grep -E '^V67_NATIVE_ASSERTION id=[0-9]{3}$' "$RUNNER_TEMP/sc112.log" | tail -n 1 | cut -d= -f2 || true)"
              if [[ "$code" =~ ^[0-9]{3}$ ]]; then
                python3 research/native_recomp/diagnose_sc_async_submit_v112.py "$((10#$code))" || true
              fi
              grep -E '^V112_ASYNC_SUBMIT route=[01] wire=[01] mode=[01] path=[01] abi=[01] prior=[01]$|^V112_ASYNC_SYSCALL order=[01] lines=[01]$|^V111_TERMINAL open=[0-9] selected=[0-9] stop=[01]$|^V111_SC_ASYNC_ENTRY route=[01] copied=[01] path=[01] nonempty=[01] abi=[01] prior=[01]$|^V110_IPC_GATE ack=[01] dispatch=[01] vector=[01] scheduler=[01] active=[01] phase=[01] db=[01] os=[01]$|^V110_ASSERT_HOOK pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$|^V110_TRIAL_START trial=[0-9]{1,2}$|^V112_TRIAL_PASS trial=[0-9]{1,2}$|^V110_SC_STRLEN input=[01] bounded=[01] empty=[01]$|^V110_SC_CONTINUE route=[01] data=[01] abi=[01] prior=[01] branch=[123]$|^V109_SC_SECOND_COPY input=[01] bounded=[01]$' "$RUNNER_TEMP/sc112.log" | sort -u || true
              grep -E '^V104_FAIL_HOOK pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$|^V104_FALLTHROUGH pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8} phase=[0-9]{1,2} cache=[0-9]{1,2}$|^V104_TRACE seq=[0-9]{1,2} pc=[0-9a-f]{1,8} lr=[0-9a-f]{1,8}$' "$RUNNER_TEMP/sc112.log" | sort -u | tail -n 28 || true
              grep -E '^V112_(WALK|BOUNDARY)' "$RUNNER_TEMP/sc112.log" | tail -n 20 || true
              echo 'V112 original IOS_OpenAsync request candidate failed; private diagnostics withheld' >&2
              exit 1
            }
          grep -Fx 'V110_WRAPPER derived' "$RUNNER_TEMP/sc112.log"
          grep -Fx 'V110_WRAPPER syntax_ok' "$RUNNER_TEMP/sc112.log"
          grep -Fx 'V110_HARNESS_MARKERS count=4' "$RUNNER_TEMP/sc112.log"
          grep -Fx 'V112_NATIVE_EXIT ok=1' "$RUNNER_TEMP/sc112.log"
          grep -Fx 'V112_STAGE native_test_passed' "$RUNNER_TEMP/sc112.log"
          grep -Eq '^V110_SC_STRLEN input=1 bounded=1 empty=[01]$' "$RUNNER_TEMP/sc112.log"
          grep -Fx 'V110_SC_CONTINUE route=1 data=1 abi=1 prior=1 branch=2' "$RUNNER_TEMP/sc112.log"
          grep -Fx 'V111_SC_ASYNC_ENTRY route=1 copied=1 path=1 nonempty=1 abi=1 prior=1' "$RUNNER_TEMP/sc112.log"
          grep -Fx 'V112_ASYNC_SUBMIT route=1 wire=1 mode=1 path=1 abi=1 prior=1' "$RUNNER_TEMP/sc112.log"
          grep -Fx 'BOOT_PROGRESS entry=0x8000403C pc=0x805195EC stage=112' "$RUNNER_TEMP/sc112.log"
          echo 'PASS: owner-original V112 SC request reached native IOS submit'
      - name: Remove private owner and generated code
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/nwii" "$RUNNER_TEMP/originals" "$RUNNER_TEMP/sc112.log"
