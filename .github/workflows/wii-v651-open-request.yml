name: Wii Native IPC Heap and IOS Open Request
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v651*'
      - 'research/native_recomp/*v654*'
      - 'research/native_recomp/*v655*'
      - 'research/native_recomp/*v657*'
      - 'research/native_recomp/*v659*'
      - '.github/workflows/wii-v651-open-request.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-only fixture
        run: |
          python3 -m py_compile research/native_recomp/make_v651_open_fixture.py research/native_recomp/apply_isolated_open_cache_v651.py
          bash -n research/native_recomp/run_v651_open_request.sh
          python3 -m unittest discover -s research/native_recomp -p test_v654_open_compile.py -v
  owner-open-request:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original IPC heap, IOS Open submission and first native ACK
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw651"
          git -C "$RUNNER_TEMP/nw651" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw651" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw651" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v651_open_request.sh "$RUNNER_TEMP/nw651" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean private original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw651"
