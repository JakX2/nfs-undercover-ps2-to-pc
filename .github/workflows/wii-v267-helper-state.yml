name: Wii V267 Original Wii SC Retry Helper State
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v267*'
      - '.github/workflows/wii-v267-helper-state.yml'
permissions:
  contents: read
concurrency:
  group: wii-v267-helper-state-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v267:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V267 original-free Wii helper memory and return classifiers
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v267_helper_state.py research/native_recomp/test_v267_helper_state.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v267_helper_state.py' -v
          echo 'PASS: original-free V267 helper state classifier'
  owner-original-v267:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V267 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Inspect original Wii retry helper reads and return paths privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v267_helper_state.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v267.log" 2>&1 || {
            grep -E '^V267_HELPER_AUDIT verified=0$' "$RUNNER_TEMP/v267.log" | sort -u || true
            echo 'V267 helper structure not verified; private owner code withheld' >&2
            exit 1
          }
          grep -Fx 'V267_HELPER_AUDIT verified=1' "$RUNNER_TEMP/v267.log"
          grep -E '^V267_HELPER_STATE size_ins=[0-9]{1,4} direct_calls=[0-9]{1,4} disable=[0-9]{1,4} restore=[0-9]{1,4} gettime=[0-9]{1,4} mftb=[0-9]{1,4} sda_loads=[0-9]{1,4} sc_direct=[0-9]{1,4} sc_byte=[0-9]{1,4} sda_other=[0-9]{1,4} lr_branch=[0-9]{1,4} blr_unconditional=[0-9]{1,4} r3_li_one=[0-9]{1,4} r3_li_zero=[0-9]{1,4} r3_li_other=[0-9]{1,4} r3_load=[0-9]{1,4} r3_or_copy=[0-9]{1,4} cmp_r3_one=[0-9]{1,4}$' "$RUNNER_TEMP/v267.log"
          echo 'PASS: V267 authenticated original Wii helper state structure'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v267.log"
