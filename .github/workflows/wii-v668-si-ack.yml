name: Wii V668 Native SI ACK and Original Handler Geometry
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v668*'
      - 'research/native_recomp/*v682*'
      - 'research/native_recomp/*v683*'
      - 'research/native_recomp/*v686*'
      - 'research/native_recomp/*v690*'
      - 'research/native_recomp/*v691*'
      - 'research/native_recomp/*v695*'
      - '.github/workflows/wii-v668-si-ack.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual SI backend W1C and instruction boundary observer
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v668_si_ack.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v683_save_leaf.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v690_si_nested.py -v
          python3 -m unittest discover -s research/native_recomp -p test_v695_si_deep.py -v
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_si_completion_ack_v668.cpp -o "$RUNNER_TEMP/v668"
          "$RUNNER_TEMP/v668"
  owner-geometry:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Derive original SI handler store and call geometry without publishing code
        run: python3 research/native_recomp/prepare_v668_si_ack.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Classify the first authenticated direct SI dependency
        run: python3 research/native_recomp/audit_si_first_helper_v682.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Classify the newly observed second direct dependency
        run: python3 research/native_recomp/audit_si_first_helper_v682.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --ordinal 2
      - name: Classify first reachable nested dependencies without publishing code
        run: python3 research/native_recomp/audit_si_nested_v690.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Derive nested direct dependencies and bounded MMIO address census
        run: python3 research/native_recomp/audit_si_deep_v695.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Clean private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
