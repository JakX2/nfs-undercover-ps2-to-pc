name: Wii Original Formatter 123 Immediate Fixture (No Execution)
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-123-immediate-fixture.yml'
      - 'research/native_recomp/prepare_formatter_report_post_signext_immediate_fixture.py'
      - 'research/native_recomp/test_formatter_report_post_signext_immediate_fixture.py'
      - 'research/native_recomp/prepare_formatter_nested_fixture.py'
      - 'research/native_recomp/test_formatter_report_second_immediate_nested.py'
      - 'research/native_recomp/audit_formatter_report_signext_successor.py'
      - 'research/native_recomp/prepare_formatter_report_signext_fixture.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-123-immediate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/prepare_formatter_report_post_signext_immediate_fixture.py research/native_recomp/test_formatter_report_post_signext_immediate_fixture.py
          python3 research/native_recomp/test_formatter_report_post_signext_immediate_fixture.py
          python3 research/native_recomp/test_formatter_report_second_immediate_nested.py
          python3 research/native_recomp/test_formatter_report_signext_nested.py
          python3 research/native_recomp/test_formatter_nested_fixture.py
          python3 research/native_recomp/audit_formatter_report_signext_successor.py --self-test
          python3 research/native_recomp/test_formatter_report_signext_fixture.py
  owner-provenance:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require completed pinned original instruction 123 classification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          requirement=Requirement(
              46017050592,'50187f90af9035ff06bf3c4917b138a9a9d59647',
              '.github/workflows/wii-formatter-123-successor-audit.yml',
              'owner-provenance')
          def fetch(endpoint):
              raw=subprocess.check_output(
                  ['gh','api',f"repos/{os.environ['GH_REPO']}/{endpoint}"],
                  stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:ok=verify(fetch,requirement)
          except (OSError,ValueError,TypeError,KeyError,subprocess.SubprocessError):ok=False
          if not ok:raise SystemExit('FORMATTER_123_FIXTURE_GATE verified=0')
          print('FORMATTER_123_FIXTURE_GATE verified=1 original_123_classification=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage authenticated private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Authenticate original instruction 123 immediate and next guard
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/prepare_formatter_report_post_signext_immediate_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf"
      - name: Remove original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals"
