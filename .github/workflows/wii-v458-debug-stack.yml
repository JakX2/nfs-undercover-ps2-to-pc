name: Wii Original Debug Stack Verification
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v458*'
      - '.github/workflows/wii-v458-debug-stack.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wii-v458-debug-stack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test original-free bounded stack instruction validation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/native_recomp -p test_v458_debug_stack.py -v
          bash -n research/native_recomp/run_v458_debug_stack.sh
      - name: Fetch pinned NWiiRecomp
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw458"
          git -C "$RUNNER_TEMP/nw458" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw458" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw458" checkout -q --detach FETCH_HEAD
      - name: Execute independent synthetic stack routine in both native output modes
        run: bash research/native_recomp/run_v458_debug_stack.sh "$RUNNER_TEMP/nw458"
  owner:
    needs: synthetic
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage verified original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals458"
      - name: Fetch pinned NWiiRecomp
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nw458"
          git -C "$RUNNER_TEMP/nw458" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw458" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw458" checkout -q --detach FETCH_HEAD
      - name: Authenticate and execute original debug stack routine if eligible
        run: |
          bash research/native_recomp/run_v458_debug_stack.sh "$RUNNER_TEMP/nw458" \
            "$RUNNER_TEMP/originals458/NfsMWRelease.dol" "$RUNNER_TEMP/originals458/NfsMWRelease.elf"
      - name: Clean all original material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals458" "$RUNNER_TEMP/nw458"
