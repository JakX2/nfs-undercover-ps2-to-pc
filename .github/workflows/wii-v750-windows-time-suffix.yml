name: Wii V750 Windows Original Post-Time Boundary
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/windows_time_suffix_v750.py'
      - 'research/native_recomp/test_v750_windows_time_suffix.py'
      - 'research/native_recomp/windows_full_build_v426.py'
      - '.github/workflows/wii-v750-windows-time-suffix.yml'
permissions:
  contents: read
concurrency:
  group: wii-v750-windows-time-suffix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate strict control and expected refusal without owner assets
        shell: pwsh
        run: |
          python -m unittest discover -s research/native_recomp -p test_v750_windows_time_suffix.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v747_time_suffix.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v429_windows_scope.py -v
          exit $LASTEXITCODE
  owner-windows:
    needs: original-free
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned private staging dependency
        run: python -m pip install --quiet 'gdown==5.2.0'
      - name: Stage and authenticate owner DOL and ELF
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        shell: pwsh
        run: |
          python owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py (Join-Path $env:RUNNER_TEMP 'orig750')
          exit $LASTEXITCODE
      - name: Fetch exact pinned NWiiRecomp
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nw750-o'
          git init -q $root
          git -C $root remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C $root fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $root checkout -q --detach FETCH_HEAD
          exit $LASTEXITCODE
      - name: Build full private Windows x64 image and stop at first unsupported post-time call
        shell: pwsh
        run: |
          $orig = Join-Path $env:RUNNER_TEMP 'orig750'
          python research/native_recomp/windows_full_build_v426.py (Join-Path $env:RUNNER_TEMP 'nw750-o') (Join-Path $env:RUNNER_TEMP 'w750-o') --owner-dol (Join-Path $orig 'NfsMWRelease.dol') --owner-elf (Join-Path $orig 'NfsMWRelease.elf') --owner-scope os-si-handler-time --owner-time-suffix
          exit $LASTEXITCODE
      - name: Delete owner inputs, generated game code and private binaries
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('orig750','nw750-o','w750-o')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $path) { Remove-Item -Recurse -Force $path }
          }
