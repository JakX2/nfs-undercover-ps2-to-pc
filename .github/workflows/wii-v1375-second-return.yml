name: Wii V1375 Second Submit and Allocator Return
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/V1375_SECOND_RETURN_CONTRACT.md'
      - '.github/workflows/wii-v1375-second-return.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          for test in test_submit_resume_v1342 test_allocator_release_v1347 test_allocator_descriptor_v1356 test_open_return_v1351; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DUNDERCOVER_TEST_SECOND_RETURN -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
