name: Wii V274 Original Wii SYSCONF Writer Input Loads
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v274*'
      - '.github/workflows/wii-v274-sc-input-loads.yml'
permissions:
  contents: read
concurrency:
  group: wii-v274-sc-input-loads-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-free-v274:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V274 original-free Wii callback input load categories
        run: |
          set -euo pipefail
          python3 -m py_compile research/native_recomp/audit_v274_sc_input_loads.py research/native_recomp/test_v274_sc_input_loads.py
          python3 -m unittest discover -s research/native_recomp -p 'test_v274_sc_input_loads.py' -v
          echo 'PASS: original-free V274 SC input load categories'
  owner-original-v274:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned private Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'V274 owner original staging failed' >&2
            exit 1
          fi
      - name: Verify authenticated private owner original
        run: |
          set -euo pipefail
          python3 research/native_recomp/verify_v125_owner_fixture.py "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Classify original Wii callback-dependent SC input loads privately
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/audit_v274_sc_input_loads.py "$RUNNER_TEMP/originals/NfsMWRelease.elf" > "$RUNNER_TEMP/v274.log" 2>&1 || {
            grep -E '^V274_INPUT_AUDIT verified=0$' "$RUNNER_TEMP/v274.log" | sort -u || true
            echo 'V274 SC input sources not verified; original code withheld' >&2
            exit 1
          }
          grep -Fx 'V274_INPUT_AUDIT verified=1' "$RUNNER_TEMP/v274.log"
          grep -E '^V274_INPUT_SUMMARY owners=3 stores=6 load=[0-9]{1,2} status=[0-9]{1,2} constant=[0-9]{1,2} computed=[0-9]{1,2} unknown=[0-9]{1,2} branch=[0-9]{1,2} entry=[0-9]{1,2}$' "$RUNNER_TEMP/v274.log"
          test "$(grep -Ec '^V274_INPUT owner=[0-9a-f]{8} store_offset=[0-9]{1,5} kind=(load|status|constant|computed|unknown|branch|entry) width=(none|byte|half|word) base=(none|absolute|stack|sda|pointer) disp=-?[0-9]{1,6} source_offset=(-1|[0-9]{1,5}) copies=[0-9]{1,2}$' "$RUNNER_TEMP/v274.log")" -eq 6
          grep -E '^V274_INPUT owner=[0-9a-f]{8} store_offset=[0-9]{1,5} kind=(load|status|constant|computed|unknown|branch|entry) width=(none|byte|half|word) base=(none|absolute|stack|sda|pointer) disp=-?[0-9]{1,6} source_offset=(-1|[0-9]{1,5}) copies=[0-9]{1,2}$' "$RUNNER_TEMP/v274.log"
          echo 'PASS: V274 authenticated original Wii writer input load classification'
      - name: Remove private owner inputs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/v274.log"
