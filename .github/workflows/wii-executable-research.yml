name: Wii executable research checks

on:
  pull_request:
    paths:
      - 'research/wii_executable/**'
      - '.github/workflows/wii-executable-research.yml'
  push:
    branches:
      - 'research/wii-elf-symbol-map'
    paths:
      - 'research/wii_executable/**'
      - '.github/workflows/wii-executable-research.yml'

permissions:
  contents: read

jobs:
  synthetic-and-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original-free Python ELF/DOL synthetic tests
        run: python3 -m unittest discover -s research/wii_executable -p 'test_*.py' -v
      - name: Build reconstructed C++17 helpers
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            research/wii_executable/attrib_text.cpp \
            research/wii_executable/test_attrib_text.cpp \
            -o /tmp/nfsuc-attrib-tests
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -O1 \
            research/wii_executable/attrib_text.cpp \
            research/wii_executable/attrib_tweak.cpp \
            research/wii_executable/test_attrib_tweak.cpp \
            -o /tmp/nfsuc-attrib-tweak-tests
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -O1 \
            research/wii_executable/attrib_text.cpp \
            research/wii_executable/attrib_tweak.cpp \
            research/wii_executable/attrib_memory.cpp \
            research/wii_executable/test_attrib_memory.cpp \
            -o /tmp/nfsuc-attrib-memory-tests
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -O1 \
            research/wii_executable/attrib_text.cpp \
            research/wii_executable/attrib_tweak.cpp \
            research/wii_executable/attrib_memory.cpp \
            research/wii_executable/wii_vehicle_snapshot.cpp \
            research/wii_executable/test_wii_vehicle_snapshot.cpp \
            -o /tmp/nfsuc-wii-vehicle-tests
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -O1 \
            research/wii_executable/attrib_text.cpp \
            research/wii_executable/attrib_tweak.cpp \
            research/wii_executable/attrib_memory.cpp \
            research/wii_executable/wii_vehicle_snapshot.cpp \
            research/wii_executable/wii_rigidbody_controls.cpp \
            research/wii_executable/test_wii_rigidbody_controls.cpp \
            -o /tmp/nfsuc-wii-rigidbody-controls-tests
      - name: Run C++ behavioral, memory and vehicle state regressions
        run: |
          /tmp/nfsuc-attrib-tests
          ASAN_OPTIONS=detect_leaks=1 /tmp/nfsuc-attrib-tweak-tests
          ASAN_OPTIONS=detect_leaks=1 /tmp/nfsuc-attrib-memory-tests
          ASAN_OPTIONS=detect_leaks=1 /tmp/nfsuc-wii-vehicle-tests
          ASAN_OPTIONS=detect_leaks=1 /tmp/nfsuc-wii-rigidbody-controls-tests
