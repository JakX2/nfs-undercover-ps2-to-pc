name: Wii Original Formatter 122 Signext Native Continuation
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-caller-report-signext-native-owner.yml'
      - 'research/native_recomp/prepare_formatter_nested_fixture.py'
      - 'research/native_recomp/prepare_formatter_report_signext_fixture.py'
      - 'research/native_recomp/test_formatter_report_signext_fixture.py'
      - 'research/native_recomp/test_formatter_report_signext_nested.py'
      - 'research/native_recomp/wii_formatter_report_signext.h'
      - 'research/native_recomp/test_formatter_report_signext.cpp'
      - 'research/native_recomp/wii_post_stm_sc_formatter.h'
      - 'research/native_recomp/wii_formatter_caller_integer.h'
      - 'research/native_recomp/wii_formatter_report_byte_transition.h'
      - 'research/native_recomp/test_native_scheduler_postack_v1256.cpp'
      - 'research/native_recomp/run_v1256_native_scheduler_postack.sh'
      - 'research/native_recomp/validate_formatter_nested_log.py'
      - 'research/native_recomp/test_formatter_report_signext_log.py'
      - 'research/native_recomp/test_formatter_report_immediate_fixture.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-formatter-122-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 -m py_compile research/native_recomp/prepare_formatter_report_signext_fixture.py research/native_recomp/prepare_formatter_nested_fixture.py research/native_recomp/validate_formatter_nested_log.py
          python3 research/native_recomp/test_formatter_report_signext_fixture.py
          python3 research/native_recomp/test_formatter_report_signext_nested.py
          python3 research/native_recomp/test_formatter_report_signext_log.py
          python3 research/native_recomp/test_formatter_report_immediate_fixture.py
          python3 research/native_recomp/test_formatter_nested_fixture.py
          python3 research/native_recomp/test_formatter_nested_log.py
          for test in test_formatter_caller_integer test_formatter_report_byte_transition test_formatter_nested_join test_formatter_report_signext; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
  owner-signext:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require pinned original 121 native execution and original 122 fixture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          prerequisites=(
              Requirement(46012175547,'dfe82f1add2e10522336ddb292de125c062ca81f',
                          '.github/workflows/wii-formatter-caller-report-immediate-native-owner.yml',
                          'owner-immediate'),
              Requirement(46014796225,'e8fda1b9c98fc7fffd23be9345a66c6f08e16128',
                          '.github/workflows/wii-formatter-122-signext-fixture.yml',
                          'owner-provenance'),
          )
          def fetch(endpoint):
              raw=subprocess.check_output(
                  ['gh','api',f"repos/{os.environ['GH_REPO']}/{endpoint}"],
                  stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:ok=all(verify(fetch,requirement) for requirement in prerequisites)
          except (OSError,ValueError,TypeError,KeyError,subprocess.SubprocessError):ok=False
          if not ok:raise SystemExit('FORMATTER_122_NATIVE_GATE verified=0')
          print('FORMATTER_122_NATIVE_GATE verified=1 original_121=1 authenticated_122=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage authenticated private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original 122-instruction guarded native continuation
        env:
          UNDERCOVER_EXPECTED_CALLER_INTEGER_COUNT: '2'
          UNDERCOVER_EXPECTED_CALLER_POST_INTEGER_COUNT: '1'
          UNDERCOVER_EXPECTED_CALLER_MIXED_INTEGERS: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_TAKEN: '2'
          UNDERCOVER_EXPECTED_CALLER_MIXED_FALLTHROUGH: '1'
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nwii122"
          git -C "$RUNNER_TEMP/nwii122" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nwii122" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nwii122" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v1256_native_scheduler_postack.sh "$RUNNER_TEMP/nwii122" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --formatter-nested-caller-report-signext
      - name: Remove original files and generated translated code
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nwii122"
