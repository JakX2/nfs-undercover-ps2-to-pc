name: Wii V1254 Submission Control Semantics
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v1254*'
      - 'research/native_recomp/wii_post_ack_submit_join_v1251.h'
      - '.github/workflows/wii-v1254-submit-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_submit_control_v1254.cpp -o "$RUNNER_TEMP/control"
          "$RUNNER_TEMP/control"
