name: Wii Formatter Bounded Integer Tail Source Tests
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - '.github/workflows/wii-formatter-bounded-integer-tail.yml'
      - 'research/native_recomp/wii_formatter_integer_tail.h'
      - 'research/native_recomp/test_formatter_integer_tail.cpp'
      - 'research/native_recomp/prepare_formatter_integer_tail.py'
      - 'research/native_recomp/test_formatter_integer_tail_plan.py'
      - 'research/native_recomp/wii_formatter_caller_integer.h'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 research/native_recomp/test_formatter_integer_tail_plan.py
          for flags in '-O2 -DNDEBUG' '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie'; do
            g++ -std=c++20 $flags -Wall -Wextra -Werror -pedantic -Iresearch/native_recomp research/native_recomp/test_formatter_integer_tail.cpp -o /tmp/test_formatter_integer_tail
            /tmp/test_formatter_integer_tail
          done
