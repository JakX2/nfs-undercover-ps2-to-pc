name: Wii Native Windows Complete Image
on:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/windows_full_build_v426.py'
      - 'research/native_recomp/test_v426_windows_full_build.py'
      - 'research/native_recomp/windows_boot_frontier_v722.py'
      - 'research/native_recomp/test_v722_windows_boot_frontier.py'
      - 'research/native_recomp/*v726*'
      - 'research/native_recomp/*v742*'
      - 'research/native_recomp/wii_si_handler_return_v725.h'
      - 'research/native_recomp/test_v429_windows_scope.py'
      - 'research/native_recomp/windows_startup_scope_v434.py'
      - 'research/native_recomp/test_v434_windows_startup_scope.py'
      - 'research/native_recomp/*v436*'
      - 'research/native_recomp/apply_native_tick_v438.py'
      - 'research/native_recomp/test_v441_windows_ticks.py'
      - 'research/native_recomp/wii_dol_loader_v431.h'
      - 'research/native_recomp/apply_dol_loader_v431.py'
      - 'research/native_recomp/prepare_v425_full_hardware.py'
      - 'research/native_recomp/audit_v425_full_hardware.py'
      - 'research/native_recomp/wii_full_hardware_witness.h'
      - 'research/native_recomp/wii_full_hardware_probe_v425.h'
      - 'research/native_recomp/wii_probe_log_format.h'
      - 'research/native_recomp/prepare_v439_full_os_hardware.py'
      - 'research/native_recomp/audit_v439_full_os_hardware.py'
      - 'research/native_recomp/wii_full_os_hardware_witness.h'
      - 'research/native_recomp/apply_function_root_v443.py'
      - 'research/native_recomp/prepare_v444_full_os_arena.py'
      - 'research/native_recomp/audit_v444_full_os_arena.py'
      - 'research/native_recomp/wii_full_os_arena_witness.h'
      - 'research/native_recomp/prepare_v446_full_os_ipc.py'
      - 'research/native_recomp/audit_v446_full_os_ipc.py'
      - 'research/native_recomp/wii_full_os_ipc_witness.h'
      - 'research/native_recomp/apply_exact_dispatch_v445.py'
      - 'research/native_recomp/*v457*'
      - 'research/native_recomp/*v466*'
      - 'research/native_recomp/*v470*'
      - 'research/native_recomp/*v473*'
      - 'research/native_recomp/*v475*'
      - 'research/native_recomp/*v476*'
      - 'research/native_recomp/*v504*'
      - 'research/native_recomp/*v505*'
      - 'research/native_recomp/*v510*'
      - 'research/native_recomp/*v520*'
      - 'research/native_recomp/*v524*'
      - 'research/native_recomp/*v529*'
      - 'research/native_recomp/*v656*'
      - 'research/native_recomp/*v658*'
      - 'research/native_recomp/*v665*'
      - 'research/native_recomp/*v674*'
      - 'research/native_recomp/*v687*'
      - 'research/native_recomp/*v701*'
      - 'research/native_recomp/*v721*'
      - 'research/native_recomp/*v609*'
      - 'research/native_recomp/*v596*'
      - 'research/native_recomp/*v606*'
      - 'research/native_recomp/*v607*'
      - 'research/native_recomp/*v598*'
      - 'research/native_recomp/prepare_v603_boot_report.py'
      - 'research/native_recomp/audit_v544_si_init_flag.py'
      - 'research/native_recomp/wii_exception_pack_v462.h'
      - 'research/native_recomp/apply_cache_continuous_v39.py'
      - 'research/native_recomp/apply_cache_trace_v44.py'
      - 'research/native_recomp/apply_dcbz_v67.py'
      - 'research/native_recomp/flat_cacheline_zero_v67.h'
      - 'research/native_recomp/apply_cache_order_v456.py'
      - '.github/workflows/wii-native-windows-full.yml'
  workflow_dispatch:
    inputs:
      owner_scope:
        description: 'Bounded original Windows startup through authenticated SI handler time'
        type: choice
        default: os-si-handler-time
        required: true
        options: [startup, hardware, cache, data, os-entry, os-time, os-hardware, os-arena, os-ipc, os-vector, os-pack, os-alarm, os-irq, os-mmio, os-irq-return, os-context, os-cache-reuse, os-exi-poll, os-exi-handlers, os-exi-id, os-exi-absent, os-si-entry, os-si-sample, os-si-return, os-sram, os-thread, os-audio, os-dsp-stage, os-dsp-sc, os-dsp-return, os-report, os-arena-clear, os-external-entry, os-si-dispatch, os-si-ack, os-si-os-leaves, os-si-handler-time]
      legacy_loader:
        description: 'Use the old DOL loader as an independent control'
        type: boolean
        default: false
      legacy_ticks:
        description: 'Use old pre-label instruction counting as a control'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wii-native-windows-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate PE and reversible source changes
        run: |
          python -m unittest discover -s research/native_recomp -p test_v426_windows_full_build.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v429_windows_scope.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v434_windows_startup_scope.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v722_windows_boot_frontier.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v726_handler_return.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v742_handler_time.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v436_windows_loader.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v534_sram_read.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v536_sram_profile.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v576_windows_dsp_scope.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v574_dsp_sc.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v593_irq_exi_composition.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v581_dsp_return.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v609_arena_clear.py -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s research/native_recomp -p test_v441_windows_ticks.py -v
          exit $LASTEXITCODE
      - name: Fetch exact pinned NWiiRecomp
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nw426-s'
          git init -q $root
          git -C $root remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C $root fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $root checkout -q --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Translate, compile, link and launch an independent PPC program on Windows
        shell: pwsh
        run: |
          python research/native_recomp/windows_full_build_v426.py (Join-Path $env:RUNNER_TEMP 'nw426-s') (Join-Path $env:RUNNER_TEMP 'w426-s')
          exit $LASTEXITCODE
      - name: Show original-free diagnostics if the synthetic build fails
        if: failure()
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'w426-s'
          if (Test-Path $work) {
            Get-ChildItem $work -File -Filter '*.log' | ForEach-Object {
              Write-Host ("--- " + $_.Name)
              Get-Content $_.FullName -Tail 80
            }
            $launchLog = Join-Path $work 'launch/private.log'
            if (Test-Path $launchLog) { Get-Content $launchLog -Tail 80 }
          }
      - name: Clean synthetic build
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('nw426-s','w426-s')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $path) { Remove-Item -Recurse -Force $path }
          }
  owner-windows:
    needs: synthetic-windows
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned staging dependency
        run: python -m pip install --quiet 'gdown==5.2.0'
      - name: Stage and SHA-verify private original inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        shell: pwsh
        run: |
          python owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py (Join-Path $env:RUNNER_TEMP 'orig426')
          exit $LASTEXITCODE
      - name: Fetch exact pinned NWiiRecomp
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nw426-o'
          git init -q $root
          git -C $root remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C $root fetch -q --depth 1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $root checkout -q --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build complete private native Windows executable and verify bounded startup
        env:
          OWNER_SCOPE: ${{ inputs.owner_scope || 'os-si-handler-time' }}
          LEGACY_TICKS: ${{ inputs.legacy_ticks && '1' || '0' }}
          LEGACY_LOADER: ${{ inputs.legacy_loader && '1' || '0' }}
        shell: pwsh
        run: |
          $orig = Join-Path $env:RUNNER_TEMP 'orig426'
          $extra = @()
          if ($env:LEGACY_LOADER -eq '1') { $extra += '--legacy-loader' }
          if ($env:LEGACY_TICKS -eq '1') { $extra += '--legacy-ticks' }
          python research/native_recomp/windows_full_build_v426.py (Join-Path $env:RUNNER_TEMP 'nw426-o') (Join-Path $env:RUNNER_TEMP 'w426-o') --owner-dol (Join-Path $orig 'NfsMWRelease.dol') --owner-elf (Join-Path $orig 'NfsMWRelease.elf') --owner-scope $env:OWNER_SCOPE @extra
          exit $LASTEXITCODE
      - name: Clean all private original files, logs and binaries
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('orig426','nw426-o','w426-o')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $path) { Remove-Item -Recurse -Force $path }
          }
