name: Wii V135 Original SC Status Dataflow Audit
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v135*'
      - 'research/native_recomp/audit_sc_status_writer_sites.py'
      - 'research/native_recomp/test_sc_status_writer_sites.py'
      - '.github/workflows/wii-v135-sc-dataflow.yml'
permissions:
  contents: read
concurrency:
  group: wii-v135-sc-dataflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-v135-sc-dataflow:
    if: vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner staging dependency
        run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Stage SHA-pinned owner Wii game locally
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          staged=0
          for attempt in 1 2 3; do
            if python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"; then
              staged=1
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if (( staged != 1 )); then
            echo 'Owner Wii staging failed after three bounded attempts' >&2
            exit 1
          fi
      - name: Classify authenticated original SC status helper control flow
        run: |
          set -euo pipefail
          umask 077
          python3 research/native_recomp/diagnose_v135_sc_flow.py \
            "$RUNNER_TEMP/originals/NfsMWRelease.dol"
      - name: Remove private owner Wii executable
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/originals"
