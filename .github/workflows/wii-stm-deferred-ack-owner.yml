name: Wii Original Deferred STM ACK Handler Return
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/wii_deferred_ack_execution.h'
      - 'research/native_recomp/prepare_ipc_deferred_ack_geometry.py'
      - 'research/native_recomp/test_deferred_ack_execution.cpp'
      - '.github/workflows/wii-stm-deferred-ack-owner.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: wii-stm-deferred-ack-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n research/native_recomp/run_v1256_native_scheduler_postack.sh
          python3 -m py_compile research/native_recomp/prepare_ipc_deferred_ack_geometry.py
          python3 research/native_recomp/test_ipc_deferred_ack_geometry.py
          python3 research/native_recomp/test_stm_outer_restore.py
          for test in test_deferred_ack_execution test_stm_deferred_event_gate test_ipc_deferred_ack_memory; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp "research/native_recomp/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
  owner-ack:
    needs: original-free
    if: github.ref == 'refs/heads/research/wii-native-recomp-preflight' && vars.WII_GHIDRA_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require verified original dispatcher and deferred ACK contracts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: research/native_recomp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from verify_v1062_owner_gate import Requirement,verify
          reqs=(
              Requirement(45866141110,'9117209e03e09c70d4dc9e7d4eb0e2b31640d228',
                          '.github/workflows/wii-stm-deferred-dispatch-owner.yml','owner-dispatch'),
              Requirement(45866043989,'a8eb8abb14c3c13a3780d7856a7423e5f75c0c94',
                          '.github/workflows/wii-deferred-ack-execution.yml','source'),
              Requirement(45866204581,'52a9475afc0d3bc8f7da2e777ee0a7b5786ca245',
                          '.github/workflows/wii-ipc-deferred-ack-geometry.yml','owner-geometry'),
          )
          def fetch(path):
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/{path}"],stderr=subprocess.DEVNULL,timeout=30)
              if len(raw)>2*1024*1024:raise ValueError('metadata size')
              return json.loads(raw)
          try:
              ok=all(verify(fetch,req) for req in reqs)
          except (OSError,ValueError,subprocess.SubprocessError):
              ok=False
          if not ok:raise SystemExit('STM_DEFERRED_ACK_OWNER_GATE verified=0')
          print('STM_DEFERRED_ACK_OWNER_GATE verified=1')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 59e8af244d1e8105a04029ec35b95baf34fc5084
          path: owner-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet 'gdown==5.2.0'
      - name: Authenticate private owner inputs
        env:
          WII_ORIGINAL_DOL_ID: ${{ secrets.WII_ORIGINAL_DOL_ID }}
          WII_ORIGINAL_ELF_ID: ${{ secrets.WII_ORIGINAL_ELF_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 owner-staging/research/cloud_ghidra/stage_owner_wii_gdown.py "$RUNNER_TEMP/originals"
      - name: Execute original third IPC ACK handler and return
        run: |
          set -euo pipefail
          umask 077
          git init -q "$RUNNER_TEMP/nw1352"
          git -C "$RUNNER_TEMP/nw1352" remote add origin https://github.com/BlackLineInteractive/NWiiRecomp.git
          git -C "$RUNNER_TEMP/nw1352" fetch -q --depth=1 origin 595f176f1d24cc54ff2e8389feed12d7fb553cc2
          git -C "$RUNNER_TEMP/nw1352" checkout -q --detach FETCH_HEAD
          bash research/native_recomp/run_v1256_native_scheduler_postack.sh "$RUNNER_TEMP/nw1352" "$RUNNER_TEMP/originals/NfsMWRelease.dol" "$RUNNER_TEMP/originals/NfsMWRelease.elf" --irq-stm-deferred-ack
      - name: Clean private original files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/originals" "$RUNNER_TEMP/nw1352"
