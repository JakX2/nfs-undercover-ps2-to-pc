name: Wii V1272 Reply Dispatcher Contract
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/V1272_REPLY_DISPATCH.md'
      - '.github/workflows/wii-v1272-reply-dispatch.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify first ACK and second reply dispatcher admission
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DUNDERCOVER_TEST_JOINED_ACK -Iresearch/native_recomp research/native_recomp/test_ipc_dispatch_contract_v1265.cpp -o "$RUNNER_TEMP/v1272"
          "$RUNNER_TEMP/v1272"
