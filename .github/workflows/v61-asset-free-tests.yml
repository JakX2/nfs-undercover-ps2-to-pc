name: V61 format-neutral Carbon chunk probe (synthetic-only)
on:
  push:
    paths:
      - 'research/v61/**'
      - '.github/workflows/v61-asset-free-tests.yml'
  pull_request:
    paths:
      - 'research/v61/**'
      - '.github/workflows/v61-asset-free-tests.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe regression suite (no original game files)
        run: python -m unittest discover -s research/v61 -p test_v61.py -v
