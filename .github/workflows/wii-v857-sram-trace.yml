name: Wii V857 Wireless SRAM Transaction Trace
on:
  workflow_dispatch:
  push:
    branches: [research/wii-native-recomp-preflight]
    paths:
      - 'research/native_recomp/*v857*'
      - '.github/workflows/wii-v857-sram-trace.yml'
permissions:
  contents: read
jobs:
  original-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iresearch/native_recomp research/native_recomp/test_wireless_sram_write_v857.cpp -o "$RUNNER_TEMP/v857"
          "$RUNNER_TEMP/v857"
